# Agentry S4 injection-signature rule bundle (PLAN §8.3, shipped as
# ruleset_releases). This manifest gives the bundle its semantic version,
# which is recorded on every scan_run and pinned in the CLI release (D-12).
version: "0.2.0"
notes: >
  v1 signature set: the six families from the §8.3 S4 row
  (instruction-override, exfiltration, tool-coercion, credential-harvest,
  persistence, obfuscation) plus `destructive`, added in 0.2.0 for the
  Amazon Q wiper shape (Appendix A) — a natural-language order to destroy
  data, which none of the original six matches. Every rule ships with match
  and non-match fixtures; benign lookalikes (security docs that merely
  discuss an attack) must not match, per §17.3.

# Bundle-level suppressions, applied to every rule in addition to its own
# (§17.3 precision requirement). These capture DESCRIPTIVE FRAMING: prose that
# catalogues an attack technique rather than issuing it. Security
# documentation, review checklists, and defensive skills all legitimately
# contain the same verbs and nouns as the attacks they describe — and an agent
# *about* prompt-injection defense has to remain publishable.
#
# Scoped to the matched line, like per-rule notPatterns, so one descriptive
# phrase cannot whitelist a whole file. The residual risk is stated plainly in
# the deviations register (DEV-010, agentry-notes): an attacker who wraps a live directive in
# cataloguing language evades the S4 line hit, and is then left to S3, S5, S6,
# and S9 — which is why the pipeline is layered rather than a single gate.
notPatterns:
  # Cataloguing / enumerating language.
  - 'prompts?\s+(to|that|which)\b'
  - 'content\s+(asking|that|which)\b'
  - 'text\s+(that|which|asking)\b'
  - 'requests?\s+that\s+(try|attempt)'
  - '\b(look|looking|watch|watching|check|checking|scan|scanning)\s+for\b'
  - '\b(indicators?|signs?|symptoms?|markers?|hallmarks?|techniques?|tactics?|patterns?\s+of)\b'
  - '\b(harvesting|exfiltration|override|coercion|persistence|obfuscation)\b\s*[.:]'
  # Reporting / review framing.
  - '\bfindings?\b'
  - '\breport (it|them|each|the|what)\b'
  - '\b(quote|excerpt|cite)\s+(it|them|the|a)\b'
  - '\bphrasing\b'
  - '\b(verdict|checklist|rubric|review)\b'
