# Agentry S4 injection-signature rule bundle (PLAN §8.3, shipped as
# ruleset_releases). This manifest gives the bundle its semantic version,
# which is recorded on every scan_run and pinned in the CLI release (D-12).
version: "0.4.10"
notes: >
  v1 signature set: the six S4 injection families (instruction-override,
  exfiltration, tool-coercion, credential-harvest, persistence,
  obfuscation) plus `destructive`, added in 0.2.0 for the Amazon Q wiper
  shape — a natural-language order to destroy data, which none of the
  original six matches. Every rule ships with match and non-match fixtures,
  and benign lookalikes (security docs that merely discuss an attack) must
  not match. 0.2.2 changes no signature: it records three re-ratings by the
  pipeline's own stages, from medium to high, so that an undeclared
  capability or an attempted injection reaches a person whatever the
  auto-publish threshold — S6/undeclared-env, and AI Review's
  C1_injection and C3_undeclared_capability at score 2 — and that content
  a stage could not read forces review (agentry#771). 0.2.3 changes no
  signature and no rating: it is the first ruleset whose registration also
  judges the review queue again and publishes what now passes the gate
  (agentry#772), released so that redo runs. 0.3.0 changes no signature
  and no rating: it moves the platform baseline's auto-publish threshold
  from low to medium (agentry#773). A version whose worst finding is
  medium publishes with the finding on its report; a high finding, or
  content a stage could not read, goes to a person; a critical one is
  rejected. The threshold is released with this version and kept beside
  it in pkg/ruleset, not in this manifest. 0.3.1 changes no signature: it
  re-rates S7's advisory findings (agentry#774). An advisory's CVSS v3.x
  and v4.0 vectors are scored; a Critical advisory is a critical finding;
  a High one is high from a base score of 8.5 and medium below it, and
  high with no usable score; an advisory with no word of its database's
  own takes its score's band, where it was medium. A declared server the
  scan has no data for (the lookup failed with no earlier answer, an
  ecosystem it does not cover, no pinned version) is one medium finding,
  S7/osv-no-data, in place of S7/osv-error. The threshold stays medium.
  0.3.2 changes no signature: it loosens three hidden-content and
  release-diff ratings that held what is not a major risk (agentry#775).
  S3/zero-width no longer fires for a zero-width joiner inside an emoji
  ZWJ sequence or for a byte-order mark at the start of a file; it still
  fires for the same code points anywhere else. S9/new-obfuscation fires
  only for a newly appearing S3 class rated medium or above, so a patch
  that adds an HTML comment or trailing whitespace is not held for it.
  A host the manifest declares in network.egress is low, whether declared
  before or in this release: S9/new-egress (newly declared egress) is low
  for a named host and stays medium for wildcard egress, and
  S9/new-egress-content is low for a declared host at any bump, and stays
  high on a patch release for any other host or an email recipient.
  S9/escalated is unchanged. The threshold stays medium.
  0.3.3 changes no signature and no rating: it narrows where the
  bundle-level suppressions below look (agentry#845). They are read over
  the paragraph that holds a hit, and a Markdown heading now ends that
  paragraph, so a heading such as "# Findings" or "## Review" over a live
  directive no longer suppresses it; a hit on a heading line is judged by
  that line alone. The threshold stays medium.
  0.3.4 changes no signature and no rating: a heading is one to six
  hashes followed by any Unicode space, not only an ASCII space or tab
  (agentry#851). Production's red team found that a no-break space after
  the hashes ("##\u00a0Findings"), which reads as a heading but is not one
  to CommonMark, kept the line in the directive's paragraph and let its
  word suppress the directive. The threshold stays medium.
  0.4.0 holds a release only for what it does not declare, or for an
  injection technique (agentry#893; plan quickagents-that-run.md D7 as
  answered by the operator, 2026-10-05). The credential-harvest and
  exfiltration rules fire on a directive addressed to the agent (an
  imperative at the start of a sentence, list item or clause, or after
  "then", "please", "you", "you must", "don't forget to" and the like),
  not on a security QuickAgent's vocabulary in code, tables or
  descriptions of a risk; a rule that names a variable in a manifest's
  `secrets` field is left alone. The hits of the three capability
  families (credential-harvest, exfiltration, destructive) are then rated
  by what their lines name against what the manifest declares: high for
  a host, address, secret, credential file or program it does not declare
  (an email recipient is never declared), and for any of the three when
  nothing of the kind is declared; medium for declared egress hosts,
  declared programs outside DR-64's base commands, and a text that names
  no secret or program where the capability is declared; low for named
  declared secrets, base commands and declared MCP servers. The
  injection families keep their ratings, and S9 no longer escalates a
  rated hit (a newly declared capability is the manifest diff's to
  report). Outside the bundle: S2 drops a gitleaks hit whose captured
  value is a documented placeholder (an RFC 2606 name, a template marker,
  with nothing secret-shaped left beside it), and AI Review rates
  exfiltration and destructive actions medium at most, deceiving the user
  high from a probable score (the operator's instruction of 2026-10-06),
  and asks the undeclared-capability question about what the text
  instructs, not what it describes. The threshold stays medium.
  0.4.1 changes no signature and no rating. AI Review is given the
  release's stated purpose (its name, summary and guide overview), and
  the undeclared-capability question holds only an action that is
  dangerous, needs a capability the release does not declare, and is out
  of line with that purpose (the operator's instruction of 2026-10-10,
  agentry#1044): the runner holds every run to what is declared, so an
  undeclared capability that serves the purpose fails safe at run time.
  Released so that registering it judges the review queue again. The
  threshold stays medium.
  0.4.2 takes the directive anchor of 0.4.0's exfiltration and
  credential-harvest rules to tool-coercion-002's first form: its lead
  word (always, first, immediately, silently, automatically, at startup,
  on load, when you start) must open a sentence, list item or clause, or
  follow "then", "please", "you must" and the like (agentry#1037). A
  drafted codebase scanner on production was held for "the first
  character, `find -exec`, `curl -o`", its list of the option-injection
  sinks it looks for. No other signature and no rating changes. The
  threshold stays medium.
  0.4.3 changes no signature. The destinations a hit names, and S9's
  new destinations in content, are read with one grammar (agentry#958):
  characters no host name holds are trimmed from a URL host's ends, so a
  declared host in a Markdown code span or bold text is the declared host
  (a drafted scanner on production was held for `api.osv.dev` keyed with
  its closing backtick), while one inside a name keeps the whole name;
  a backslash ends S9's authority as it ended S4's; an IPv4 address must
  be one. S9 finds bare hosts under any top-level domain ICANN delegates
  rather than a list of sixteen, and IPv4 addresses, so a patch that
  starts sending to webhook.site is held. A two-label name under a
  file-like domain (.md, .zip, .mov, .sh, .py, .pl, .pm, .rs, .so) with
  no path or port after it, and in program source a dotted name outside
  a string, is not a host. The threshold stays medium.
  0.4.4 changes no signature. It narrows S9's bare names in Markdown's
  code (agentry#958): 0.4.3's rescan on dev drew new mediums for
  `window.name`, `request.post`, `application.properties` and
  `app.zip/src/UserDao.java`, words and files under delegated TLDs. In a
  code span or a fenced block a bare name now counts when it is quoted,
  has a path after it, or is under a TLD hosts are usually under (com,
  net, org, io, dev, ai, co, app, cloud, xyz, edu, gov, a country code
  that is not also a field name, a special-use name); .java joins the
  file-like domains, and a port after a file name is no longer evidence
  of a host (agent.md:12). Prose outside code keeps 0.4.3's rule. The
  threshold stays medium.
  0.4.5 changes no signature and no rating. It names the release that
  taught AI Review what a target host grants (agentry#1092, DEV-242): the
  rubric's statement of the runner's grants says a machine listed under
  capabilities.targetHosts may be run and administered through the host
  tools, while reaching another machine from it or sending what it reads
  elsewhere is not declared unless the stated purpose intends it; the
  rubric hash moves. S1 reports, low, an exec declaration naming ssh,
  scp, sftp or rsync. The threshold stays medium.
  0.4.6 changes no signature and no rating. It names the release whose
  S6 reads an ssh, scp, sftp or rsync destination written user@host or
  user@host:path as a host the script reaches (agentry#1095); before it,
  every user@host was skipped with curl's @file argument. Only the
  destination and jump-host words of the command a segment runs are read
  (past assignments and wrappers such as sudo or sshpass), so an e-mail
  address in a comment, another command's arguments or the command ssh
  runs remotely is not a host. The threshold stays medium.
  0.4.7 changes no signature and no rating. It names the release whose
  S6 reads a shell command written with its path (/usr/bin/curl), inside
  backticks or escaped with a backslash (\curl) as that command
  (agentry#1148): a network call, a filesystem write, ssh's destination,
  and a pipe into a path-qualified shell (| /bin/sh) as remote execution.
  A word that only contains a command's name (/etc/ssh/sshd_config,
  mycurl) is still not the command. The threshold stays medium.
  0.4.8 changes no signature and no rating. It names the release whose
  S6 reads the host forms it did not (agentry#1149): IPv4 and bracketed
  IPv6 addresses, ftp, sftp, scp, ssh, rsync, telnet and ws URLs and a
  URL's userinfo, a destination with no user or a dynamic one
  ($(whoami)@host), ssh-copy-id, autossh, mosh and sshfs, a destination a
  script assigns to a variable, and commands in a command substitution
  inside double quotes or in the string sh -c or eval runs. Loopback
  addresses are not hosts. The threshold stays medium.
  0.4.9 changes no signature. It names the release whose rating by
  declaration and S9 read a declared browser (capabilities.browser) as
  a way out the release declares (agentry#1198): an exfiltration or
  credential-harvest hit that names a host the browser may open (its
  hosts, exact or below a "*." entry; any host for a public browser),
  or names none where a browser host is declared, is medium, not high
  (the person's own site alone is no way out); S9's content diff reads
  such a host as declared (low), and its manifest diff reports a browser
  host the previous release did not name as new-egress, low for an exact
  host and medium for a "*." entry. S6 is unchanged. The threshold stays
  medium.
  0.4.10 changes no signature. It names the release whose S6 also reads
  the other direction, needed but not declared: the runner tools the
  instruction calls for against the grants the manifest declares (the
  browser tools against capabilities.browser, run_command against exec
  commands, fetch against network.egress hosts, the host tools against
  capabilities.targetHosts, the workspace file tools against
  filesystem.read and filesystem.write, and a <server>__<tool> name
  against capabilities.mcpServers). A run without the grant has no such
  tool, so each grant missing is one high finding, S6/ungranted-tool,
  that sends the version to a person and is never critical; a rescan
  weighs it at medium, so registering this version pulls no published
  version for it. A tool named only where the instruction turns it away,
  or in a paragraph that speaks of another package as a QuickAgent, is
  not a need, and browser_evaluate is a need a browser that may type
  secrets does not meet. The threshold stays medium.

# Bundle-level suppressions, applied to every rule in addition to its own
# (§17.3 precision requirement). These capture DESCRIPTIVE FRAMING: prose that
# catalogues an attack technique rather than issuing it. Security
# documentation, review checklists, and defensive skills all legitimately
# contain the same verbs and nouns as the attacks they describe — and an agent
# *about* prompt-injection defense has to remain publishable.
#
# Scoped to the PARAGRAPH that holds the hit (contiguous non-blank lines),
# unlike per-rule notPatterns, which see only the matched line: descriptive
# prose wraps, and its marker can sit on the line before the match. A blank
# line or a Markdown heading ends the paragraph (a heading is judged alone,
# since 0.3.3), so one descriptive phrase cannot whitelist a whole file. The
# residual risk is stated plainly in the deviations register (DEV-010,
# agentry-notes): an attacker who wraps a live directive in cataloguing
# language, or sets a descriptive sentence beside it in the same paragraph,
# evades the S4 hit, and is then left to S3, S5, S6, and S9 — which is why the
# pipeline is layered rather than a single gate.
notPatterns:
  # Cataloguing / enumerating language.
  - 'prompts?\s+(to|that|which)\b'
  - 'content\s+(asking|that|which)\b'
  - 'text\s+(that|which|asking)\b'
  - 'requests?\s+that\s+(try|attempt)'
  - '\b(look|looking|watch|watching|check|checking|scan|scanning)\s+for\b'
  - '\b(indicators?|signs?|symptoms?|markers?|hallmarks?|techniques?|tactics?|patterns?\s+of)\b'
  - '\b(harvesting|exfiltration|override|coercion|persistence|obfuscation)\b\s*[.:]'
  # Reporting / review framing.
  - '\bfindings?\b'
  - '\breport (it|them|each|the|what)\b'
  - '\b(quote|excerpt|cite)\s+(it|them|the|a)\b'
  - '\bphrasing\b'
  - '\b(verdict|checklist|rubric|review)\b'
