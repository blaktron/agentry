{{define "content"}}
<h1>Sign in</h1>
{{with .Data}}
{{if .Providers}}
<section class="card">
  {{range .Providers}}<p><a class="button" href="{{index $.Data.ProviderHref .ID}}">Continue with {{.Label}}</a></p>{{end}}
</section>
{{else}}
<p class="muted">This registry signs people in through an OpenID provider, and the operator has not configured one. Ask the operator to add one.</p>
{{end}}
{{end}}
{{end}}
