<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" width="300" height="48" role="img" aria-label="SecureAgentry">
  <!-- Wordmark: the mark plus the product name in the web app's sans stack
       and ink colors (globals.css). Theme-aware via the SVG's own media
       query, which browsers evaluate for SVG used in <img>. -->
  <style>
    .shield { fill: #0e7a63; }
    .check { fill: none; stroke: #faf9f7; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
    text { font: 600 26px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1c1917; letter-spacing: -0.02em; }
    @media (prefers-color-scheme: dark) {
      .shield { fill: #4fd1b0; }
      .check { stroke: #141210; }
      text { fill: #e7e5e4; }
    }
  </style>
  <g transform="translate(0,4) scale(0.84)">
    <path class="shield" d="M24 3 41 10.5 V 23 C 41 34.5 34 42.5 24 46.5 C 14 42.5 7 34.5 7 23 V 10.5 Z"/>
    <path class="check" d="M15.5 24.5 L 21.5 30.5 L 32.5 18.5"/>
  </g>
  <text x="48" y="33">SecureAgentry</text>
</svg>
