<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="SecureAgentry">
  <!-- The SecureAgentry mark: a shield with a check, in the viridian accent.
       Theme-aware via the SVG's own media query (globals.css tokens). -->
  <style>
    .shield { fill: #0e7a63; }
    .check { fill: none; stroke: #faf9f7; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .shield { fill: #4fd1b0; }
      .check { stroke: #141210; }
    }
  </style>
  <path class="shield" d="M24 3 41 10.5 V 23 C 41 34.5 34 42.5 24 46.5 C 14 42.5 7 34.5 7 23 V 10.5 Z"/>
  <path class="check" d="M15.5 24.5 L 21.5 30.5 L 32.5 18.5"/>
</svg>
