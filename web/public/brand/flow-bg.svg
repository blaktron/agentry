<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Directory-service sign-in background: the registry's page ground with
       a faint viridian glow. Calm and legible, per the design notes —
       replaces authentik's default photograph. Theme-aware. -->
  <style>
    .ground { fill: #faf9f7; }
    .glow  { fill: #0e7a63; opacity: 0.05; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #141210; }
      .glow  { fill: #4fd1b0; opacity: 0.05; }
    }
  </style>
  <rect class="ground" width="1920" height="1080"/>
  <circle class="glow" cx="960" cy="220" r="640"/>
</svg>
