<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Directory-service sign-in background: the registry's page ground with
       a faint viridian glow fading to nothing (no visible edge). Calm and
       legible, per the design notes - replaces authentik's default
       photograph. Theme-aware. -->
  <style>
    .ground { fill: #faf9f7; }
    .glow { fill: url(#gl); }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #141210; }
      .glow { fill: url(#gd); }
    }
  </style>
  <defs>
    <radialGradient id="gl" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0e7a63" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0e7a63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gd" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#4fd1b0" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#4fd1b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect class="ground" width="1920" height="1080"/>
  <rect class="glow" width="1920" height="1080"/>
</svg>
