# drafted by the Drafter (agentry draft); review every line before you submit it
schemaVersion: "2"
name: lockfile-vulnerability-upgrades
namespace: draft
version: 0.1.0
summary: Checks every pinned package in your lockfiles against OSV and reports the vulnerable ones with the version to upgrade each one to.
license: Apache-2.0
tags:
  - dependencies
  - vulnerabilities
  - osv
  - lockfiles
  - supply-chain
  - upgrades
modes:
  - autonomous
entrypoints:
  instruction: AGENT.md
intake:
  - id: scope
    prompt: 'Anything to narrow down? Optional: e.g. "only the Python and Go lockfiles", "ignore dev dependencies", "critical only". Blank means every package in every lockfile, all severities, worst first.'
    type: text
    required: false
guide:
  overview: 'You add a project''s lockfiles and it audits them: it parses the exact pinned versions from package-lock.json, yarn.lock, pnpm-lock.yaml, uv.lock, poetry.lock, requirements.txt, go.mod/go.sum, Cargo.lock, Gemfile.lock, composer.lock, mix.lock, pom.xml and NuGet lock files, then batch-queries them against the OSV advisory database. You get back report.md: a summary per lockfile, an upgrade table sorted worst-severity-first with the version to move each package to, detail lines for HIGH and CRITICAL findings, and a list of entries it could not check (ranges, git refs, local paths) so a clean-looking result is never mistaken for an unqueried one. Nothing is installed and no file in your project is modified.'
  prepare:
    - 'The project''s lockfiles: package-lock.json, uv.lock, go.sum, Cargo.lock and the like.'
    - The manifest files too (pyproject.toml, go.mod, package.json) if your versions are ranges rather than pins.
    - Tell it in the task if you only care about one language, one file, or high severities only.
    - 'Nothing to install or configure: OSV.dev is public and the advisory server needs no key.'
  files: Add the lockfiles you want checked. A whole project folder works too; it picks out the lockfiles and skips anything without an exact pinned version.
  task: e.g. Audit every lockfile in this project, put anything critical first, and tell me the smallest version that clears all advisories for each package.
capabilities:
  network:
    egress: none
  filesystem:
    read: none
    write: none
  exec: none
  dataAccess:
    - code
  mcpServers:
    - npm: '@cyanheads/osv-advisory-mcp-server'
      version: 0.1.13
      tools:
        - osv_query_batch
        - osv_get_vulnerability
        - osv_list_ecosystems
      egress:
        - api.osv.dev
      env:
        LOGS_DIR: /tmp/osv-logs
publish:
  include:
    - agent.yaml
    - AGENT.md
    - README.md
    - LICENSE
