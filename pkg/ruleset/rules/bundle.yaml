# Agentry S4 injection-signature rule bundle (PLAN §8.3, shipped as
# ruleset_releases). This manifest gives the bundle its semantic version,
# which is recorded on every scan_run and pinned in the CLI release (D-12).
version: "0.3.3"
notes: >
  v1 signature set: the six S4 injection families (instruction-override,
  exfiltration, tool-coercion, credential-harvest, persistence,
  obfuscation) plus `destructive`, added in 0.2.0 for the Amazon Q wiper
  shape — a natural-language order to destroy data, which none of the
  original six matches. Every rule ships with match and non-match fixtures,
  and benign lookalikes (security docs that merely discuss an attack) must
  not match. 0.2.2 changes no signature: it records three re-ratings by the
  pipeline's own stages, from medium to high, so that an undeclared
  capability or an attempted injection reaches a person whatever the
  auto-publish threshold — S6/undeclared-env, and AI Review's
  C1_injection and C3_undeclared_capability at score 2 — and that content
  a stage could not read forces review (agentry#771). 0.2.3 changes no
  signature and no rating: it is the first ruleset whose registration also
  judges the review queue again and publishes what now passes the gate
  (agentry#772), released so that redo runs. 0.3.0 changes no signature
  and no rating: it moves the platform baseline's auto-publish threshold
  from low to medium (agentry#773). A version whose worst finding is
  medium publishes with the finding on its report; a high finding, or
  content a stage could not read, goes to a person; a critical one is
  rejected. The threshold is released with this version and kept beside
  it in pkg/ruleset, not in this manifest. 0.3.1 changes no signature: it
  re-rates S7's advisory findings (agentry#774). An advisory's CVSS v3.x
  and v4.0 vectors are scored; a Critical advisory is a critical finding;
  a High one is high from a base score of 8.5 and medium below it, and
  high with no usable score; an advisory with no word of its database's
  own takes its score's band, where it was medium. A declared server the
  scan has no data for (the lookup failed with no earlier answer, an
  ecosystem it does not cover, no pinned version) is one medium finding,
  S7/osv-no-data, in place of S7/osv-error. The threshold stays medium.
  0.3.2 changes no signature: it loosens three hidden-content and
  release-diff ratings that held what is not a major risk (agentry#775).
  S3/zero-width no longer fires for a zero-width joiner inside an emoji
  ZWJ sequence or for a byte-order mark at the start of a file; it still
  fires for the same code points anywhere else. S9/new-obfuscation fires
  only for a newly appearing S3 class rated medium or above, so a patch
  that adds an HTML comment or trailing whitespace is not held for it.
  A host the manifest declares in network.egress is low, whether declared
  before or in this release: S9/new-egress (newly declared egress) is low
  for a named host and stays medium for wildcard egress, and
  S9/new-egress-content is low for a declared host at any bump, and stays
  high on a patch release for any other host or an email recipient.
  S9/escalated is unchanged. The threshold stays medium.
  0.3.3 changes no signature and no rating: it narrows where the
  bundle-level suppressions below look (agentry#845). They are read over
  the paragraph that holds a hit, and a Markdown heading now ends that
  paragraph, so a heading such as "# Findings" or "## Review" over a live
  directive no longer suppresses it; a hit on a heading line is judged by
  that line alone. The threshold stays medium.

# Bundle-level suppressions, applied to every rule in addition to its own
# (§17.3 precision requirement). These capture DESCRIPTIVE FRAMING: prose that
# catalogues an attack technique rather than issuing it. Security
# documentation, review checklists, and defensive skills all legitimately
# contain the same verbs and nouns as the attacks they describe — and an agent
# *about* prompt-injection defense has to remain publishable.
#
# Scoped to the PARAGRAPH that holds the hit (contiguous non-blank lines),
# unlike per-rule notPatterns, which see only the matched line: descriptive
# prose wraps, and its marker can sit on the line before the match. A blank
# line or a Markdown heading ends the paragraph (a heading is judged alone,
# since 0.3.3), so one descriptive phrase cannot whitelist a whole file. The
# residual risk is stated plainly in the deviations register (DEV-010,
# agentry-notes): an attacker who wraps a live directive in cataloguing
# language, or sets a descriptive sentence beside it in the same paragraph,
# evades the S4 hit, and is then left to S3, S5, S6, and S9 — which is why the
# pipeline is layered rather than a single gate.
notPatterns:
  # Cataloguing / enumerating language.
  - 'prompts?\s+(to|that|which)\b'
  - 'content\s+(asking|that|which)\b'
  - 'text\s+(that|which|asking)\b'
  - 'requests?\s+that\s+(try|attempt)'
  - '\b(look|looking|watch|watching|check|checking|scan|scanning)\s+for\b'
  - '\b(indicators?|signs?|symptoms?|markers?|hallmarks?|techniques?|tactics?|patterns?\s+of)\b'
  - '\b(harvesting|exfiltration|override|coercion|persistence|obfuscation)\b\s*[.:]'
  # Reporting / review framing.
  - '\bfindings?\b'
  - '\breport (it|them|each|the|what)\b'
  - '\b(quote|excerpt|cite)\s+(it|them|the|a)\b'
  - '\bphrasing\b'
  - '\b(verdict|checklist|rubric|review)\b'
