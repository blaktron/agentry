schemaVersion: "2"
name: probe-agent
namespace: acme
version: 1.3.0
summary: "Probes how the Builder reads a revision."
license: "MIT"
tags: ["github"]

modes: [autonomous]

entrypoints:
  instruction: AGENT.md

intake:
  - id: repo
    prompt: "Which repository?"
    required: true

capabilities:
  network:
    egress: ["api.github.com", "uploads.github.com"]
  filesystem:
    read: workspace
    write: { paths: ["out"] }
  exec: { commands: ["git"] }

publish:
  include: [agent.yaml, AGENT.md, README.md, LICENSE]
