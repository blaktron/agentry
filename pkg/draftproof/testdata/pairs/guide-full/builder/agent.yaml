schemaVersion: "2"
name: probe-agent
namespace: acme
version: 1.3.0
summary: "Probes how the Builder reads a revision."
license: "MIT"

modes: [autonomous]

entrypoints:
  instruction: AGENT.md

guide:
  overview: "Reads the incident.  \nReturns a summary.\n\n- one\n- two"
  prepare: ["A PagerDuty account", "An incident id"]
  files: "One CSV file."
  task: "e.g. Summarise INC-1"
  connect:
    PD_TOKEN: "Create a **read-only** key.\n\n1. Open settings\n2. Copy the key"
    SLACK_TOKEN: "A bot token."
    GITHUB_TOKEN: "A fine-grained token."
    JIRA_TOKEN: "An API token."
    LINEAR_TOKEN: "A personal key."

capabilities:
  network:
    egress: none
  filesystem:
    read: workspace
    write: none
  exec: none
  secrets: ["PD_TOKEN", "SLACK_TOKEN", "GITHUB_TOKEN", "JIRA_TOKEN", "LINEAR_TOKEN"]

publish:
  include: [agent.yaml, AGENT.md, README.md, LICENSE]
