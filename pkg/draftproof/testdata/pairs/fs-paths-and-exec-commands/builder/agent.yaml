schemaVersion: "2"
name: probe-agent
namespace: acme
version: 1.3.0
summary: "Probes how the Builder reads a revision."
license: "MIT"

modes: [autonomous]

entrypoints:
  instruction: AGENT.md

capabilities:
  network:
    egress: none
  filesystem:
    read: { paths: ["data/in.csv", "data/in.csv", "docs"] }
    write: workspace
  exec: { commands: ["git", "git", "python3"] }

publish:
  include: [agent.yaml, AGENT.md, README.md, LICENSE]
