schemaVersion: "2"
name: probe-agent
namespace: acme
version: 1.3.0
summary: "Probes how the Builder reads a revision."
license: "MIT"

modes: [autonomous]

entrypoints:
  instruction: AGENT.md

intake:
  - id: topic
    prompt: "What should I look at?"
    required: true
  - id: api_key
    prompt: "Your API key"
    type: secret
    required: true
  - id: region
    prompt: "Which region?"
    type: choice
    choices: ["emea", "north america", "apac"]
  - id: report
    prompt: "The report to read"
    type: file
  - id: count
    prompt: "How many?"

capabilities:
  network:
    egress: none
  filesystem:
    read: workspace
    write: none
  exec: none
  secrets: ["API_KEY"]

publish:
  include: [agent.yaml, AGENT.md, README.md, LICENSE]
