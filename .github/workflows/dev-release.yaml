# dev's prereleases. Every push to dev that
# release-please would release on main (a commit of a type the config shows
# in the changelog: feat, fix, perf, security, deps or revert, since the last
# dev tag) is tagged vX.Y.Z-dev.N, the Nth prerelease of the version main's
# next release will have. It is then released through release.yaml exactly as
# a main release is: verified, built, signed, and published as a GitHub
# Release marked prerelease, with its image and chart tagged with it, never
# `latest`. scripts/release/next-dev-tag.sh picks the tag and says how.
#
# Why a tagging workflow and not release-please's prerelease mode:
# release-please only tags when its release PR merges, so a prerelease per dev
# push would mean a second standing PR merged into dev for every one, and dev
# would then carry manifest and changelog commits that main's release-please
# also writes. The version it proposes is still the one main will release,
# because the script reads the same config.
#
# The tag is created with the workflow's own token, whose events never start
# other workflows, so this workflow calls release.yaml itself (the same
# reason release-please.yaml does). workflow_dispatch on dev cuts a
# prerelease of dev's head even without a releasable commit and still refuses a head that is already tagged.
name: dev-release
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    if: github.repository == 'blaktron/agentry' && github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    # One tag job at a time, so two pushes never pick the same N; only this
    # short job is serialised, so each push's release runs on its own. GitHub
    # keeps one pending run per group: a push whose tag job is still pending
    # when a third arrives is folded into the later one's tag.
    concurrency:
      group: dev-release-tag
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Every tag and both branches: the version comes from the newest
          # release wherever it is, the guard from origin/dev.
          fetch-depth: 0
          persist-credentials: false
      - name: The next dev tag
        id: next
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          AGENTRY_ALLOW_V1: ${{ vars.AGENTRY_ALLOW_V1 }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag=$(./scripts/release/next-dev-tag.sh ${FORCE:+"$FORCE"})
          if [ -z "$tag" ]; then
            echo "nothing to release at $GITHUB_SHA: already tagged, or no releasable commit since the last dev tag"
            exit 0
          fi
          ./scripts/release/tag-guard.sh "$tag" "$GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $GITHUB_SHA as $tag"
      - name: Create the tag
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          jq -n --arg ref "refs/tags/$TAG" --arg sha "$GITHUB_SHA" '{ref: $ref, sha: $sha}' \
            | curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" -d @- >/dev/null

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.tag.outputs.tag }}
