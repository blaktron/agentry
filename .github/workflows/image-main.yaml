# The agentryd image of a branch: publishes
# ghcr.io/blaktron/agentry/agentryd:<branch> — :main for the release line, :dev
# for the integration branch — and :sha-<short>, so a front end's and the
# enterprise build's CI can boot a real API without building Go, against the
# branch they are on. Run by hand only: the maintainers' release pipeline
# publishes these moving tags after each merge.
name: image-main
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write   # keyless signing (OIDC)
concurrency:
  group: image-main-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: short sha
        run: echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          file: deploy/compose/Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}-${{ env.SHORT }}
          tags: |
            ghcr.io/${{ github.repository }}/agentryd:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/agentryd:sha-${{ env.SHORT }}
          provenance: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/${{ github.repository }}/agentryd@${{ steps.build.outputs.digest }}"
      # The chart beside the image: a prerelease version per
      # branch whose appVersion is the image tag this run built, so
      # `helm install … oci://ghcr.io/blaktron/agentry/charts/agentry --version
      # 0.1.0-dev.<run>.g<sha>` runs agentryd:sha-<sha> by default (the g
      # keeps an all-digit sha from being a numeric semver segment, which
      # may not start with 0). Releases publish the tagged version from
      # release.yaml.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Publish the chart
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base=$(awk '/^version:/{print $2; exit}' deploy/helm/agentry/Chart.yaml)
          version="${base}-${{ github.ref_name }}.${{ github.run_number }}.g${SHORT}"
          echo "$HELM_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/agentry --version "$version" --app-version "sha-${SHORT}" -d "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/agentry-${version}.tgz" "oci://ghcr.io/${{ github.repository }}/charts" 2>&1 | tee "$RUNNER_TEMP/chart/push.log"
          digest=$(grep -m1 -o 'sha256:[0-9a-f]\{64\}' "$RUNNER_TEMP/chart/push.log")
          [ -n "$digest" ] || { echo "helm push printed no digest"; exit 1; }
          cosign sign --yes "ghcr.io/${{ github.repository }}/charts/agentry@${digest}"
