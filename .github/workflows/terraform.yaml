# WG-K deploy IaC gate (PLAN §13.7): fmt + validate every module/env, lint the
# Helm chart, and (gated on OIDC) plan on PR / apply on merge with a manual
# approval for prod. Plan/apply require the GitHub Actions OIDC deploy role from
# global/accounts (§13.1); they no-op until AWS_DEPLOY_ROLE_ARN is configured.
name: terraform
on:
  push:
    branches: [main]
    paths: ["deploy/terraform/**", "deploy/helm/**", ".github/workflows/terraform.yaml"]
  pull_request:
    paths: ["deploy/terraform/**", "deploy/helm/**", ".github/workflows/terraform.yaml"]

permissions:
  contents: read

env:
  TF_VERSION: "1.9.5"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt -check
        run: terraform fmt -check -recursive deploy/terraform

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/network
          - modules/ecs-service
          - modules/rds
          - modules/elasticache
          - modules/efs
          - modules/s3-suite
          - modules/cloudfront
          - modules/waf
          - modules/kms
          - modules/observability
          - envs/dev
          - envs/staging
          - envs/prod
          - global
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init + validate (${{ matrix.dir }})
        working-directory: deploy/terraform/${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: tflint (recursive)
        run: tflint --recursive --chdir deploy/terraform

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/agentry

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: azure/setup-helm@v4
      - name: scripts/acceptance/m7.sh
        run: ./scripts/acceptance/m7.sh

  # --------------------------------------------------------------------------
  # plan / apply — OIDC-gated (§13.1: no IAM users). These require the deploy
  # role ARN to be configured as the AWS_DEPLOY_ROLE_ARN repo/environment var.
  # Plan runs on PRs; apply runs on merge to main. prod apply is protected by
  # the `prod` GitHub Environment (add required reviewers there for the manual
  # approval called for in §13.7).
  # --------------------------------------------------------------------------
  plan:
    if: github.event_name == 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: terraform plan (${{ matrix.env }})
        working-directory: deploy/terraform/envs/${{ matrix.env }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color

  apply-nonprod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        env: [dev, staging]
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: terraform apply (${{ matrix.env }})
        working-directory: deploy/terraform/envs/${{ matrix.env }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

  apply-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: apply-nonprod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: prod # add required reviewers here for the manual approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: terraform apply (prod)
        working-directory: deploy/terraform/envs/prod
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
