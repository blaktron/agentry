# Release automation (release-please, signed releases and an SBOM).
# release-please watches conventional commits
# on main and maintains a standing "release PR" that bumps the version and
# rewrites CHANGELOG.md. Merging that PR tags vX.Y.Z and creates its GitHub
# release as a draft, with the changelog as its body. This workflow then calls
# release.yaml, which verifies, builds, signs and attaches the artifacts, and
# only then publishes the release. dev's prereleases (vX.Y.Z-dev.N) are not
# cut here.
#
# The release PR is the one pull request main takes that is not a promotion
# from dev: it carries only CHANGELOG.md and the manifest,
# which release-please reads from main. dev never needs them back, since
# next-dev-tag.sh reads the tags.
#
# The version (release-please-config.json):
#   - release-as pins the next release. A maintainer sets it whenever the
#     minor version moves (or for 1.0.0), and removes it again after that
#     release.
#   - "versioning": "always-bump-patch" makes every other release a patch
#     bump, whatever the commit types: a feat: or a feat!: does not move the
#     minor by itself, because only a maintainer moves it.
#   - "draft" with "force-tag-creation": the tag exists at once, for
#     release.yaml to build from, and the release stays a draft until its
#     signed assets are attached.
#   - initial-version only matters before the first release.
# scripts/release/config-guard.sh refuses a 1.x manifest or release-as
# without the maintainers' AGENTRY_ALLOW_V1, and a release-as that is already
# released (which release-please would propose again).
#
# TOKEN NOTE: a tag or release created with the default GITHUB_TOKEN does NOT
# trigger other workflows (GitHub's recursion guard), and the repository holds
# no RELEASE_PLEASE_TOKEN. So the release job below calls release.yaml
# directly when a release was created, and nothing listens for tag pushes. The
# release PR opened with GITHUB_TOKEN gets pull_request runs that wait for
# approval; it is gated by dispatching ci and branch-model on its branch. A
# RELEASE_PLEASE_TOKEN a maintainer might add is still used first: its PR's
# runs would start by themselves, and its tags start nothing that is not
# already called here.
name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tags a release PR that has just merged and creates its draft release.
  github-release:
    if: github.repository == 'blaktron/agentry'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    # Two pushes to main a moment apart must not both tag the merged release
    # PR before it is labelled tagged (two drafts for one version).
    concurrency:
      group: release-please-github-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write   # labels the merged PR "autorelease: tagged"
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: No 1.x release without AGENTRY_ALLOW_V1
        env:
          AGENTRY_ALLOW_V1: ${{ vars.AGENTRY_ALLOW_V1 }}
        run: ./scripts/release/config-guard.sh release
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Releases are cut from main (the release line); dev is the integration
          # branch and may become the repository's default, which this action
          # would otherwise target.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  release:
    needs: github-release
    if: needs.github-release.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.github-release.outputs.tag_name }}

  # Opens or updates the standing release PR, after any release above exists:
  # release-please will not propose a new version while a merged release PR is
  # untagged.
  release-pr:
    needs: github-release
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The version the release PR may propose
        env:
          AGENTRY_ALLOW_V1: ${{ vars.AGENTRY_ALLOW_V1 }}
        run: ./scripts/release/config-guard.sh pull-request
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
