# Release automation (§18.2 M8 OSS hygiene: "release-please, signed releases
# + SBOM"). release-please watches conventional commits on main and maintains
# a standing "release PR" that bumps the version and rewrites CHANGELOG.md.
# Merging that PR creates the vX.Y.Z tag + GitHub release; the tag then drives
# release.yaml, which builds, signs, and attaches artifacts.
#
# The first release is 0.1.0, not 1.0.0: release-please-config.json sets
# initial-version, because with no release tag yet it would otherwise start
# at 1.0.0 (the operator's decision of 2026-09-23, agentry#31: not ready for
# 1.0). bump-minor-pre-major keeps later bumps in 0.x until 1.0 is chosen.
#
# TOKEN NOTE (the one operational gotcha): a tag pushed with the default
# GITHUB_TOKEN does NOT trigger other workflows (GitHub's recursion guard), so
# release.yaml would not fire. Provide a fine-grained PAT or GitHub App token
# as the `RELEASE_PLEASE_TOKEN` secret (contents: write, pull-requests: write,
# workflows: write) so the tag push triggers release.yaml. Without it, the
# release PR + CHANGELOG still work; cut assets by pushing the tag manually
# (`git push origin vX.Y.Z`) or via `gh release`.
name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Self-hosted like every other workflow: GitHub-hosted minutes are
    # exhausted, so on ubuntu-latest the job never scheduled (agentry#220).
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # Falls back to GITHUB_TOKEN when the PAT is absent: the release PR
          # and tag are still created, but see the TOKEN NOTE above — the tag
          # will not auto-trigger release.yaml under the default token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Releases are cut from main (production); dev is the integration
          # branch and may become the repository's default, which this action
          # would otherwise target (agentry-notes#156).
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
