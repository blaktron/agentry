# Release: build, sign, and publish artifacts with provenance (§18.2 M8 OSS
# hygiene). We hold ourselves to the standard we ask of publishers — signed
# artifacts, an SBOM, and a scanned dependency tree.
#
# Triggered by the vX.Y.Z tag that release-please.yaml creates when its
# release PR merges (or a manually pushed tag). release-please owns CHANGELOG
# .md and the release notes; the publish step below appends the verification
# instructions and attaches the signed assets rather than replacing them.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release
  id-token: write   # keyless signing (OIDC)
  packages: write   # container image

jobs:
  verify:
    # Never release something that would not pass CI.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentry
          POSTGRES_PASSWORD: agentry
          POSTGRES_DB: agentry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentry" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      AGENTRY_TEST_DATABASE_URL: postgres://agentry:agentry@localhost:5432/agentry_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - run: make check
      - name: attack-corpus gate must be green to release
        run: go test -timeout 20m ./internal/scan -run TestAttackCorpusGate -count=1
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (reproducible flags)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/blaktron/agentry/internal/version.Version=${VERSION}"
          mkdir -p dist
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          # The CLI ships from github.com/blaktron/agentry-cli (DEV-050);
          # this job builds the server binary only.
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/agentryd-${GOOS}-${GOARCH}${EXT}" ./cmd/agentryd

      - name: Checksums
        run: cd dist && sha256sum * > "SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  sbom-and-sign:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
      - run: mkdir -p dist && find dist-all -type f -exec mv {} dist/ \;

      - name: SBOM (syft, Apache-2.0 toolchain per §14.4)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/agentry-sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless, OIDC identity)
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-*-*.txt
          cosign sign-blob --yes --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem SHA256SUMS.txt
          cosign sign-blob --yes --output-signature agentry-sbom.spdx.json.sig \
            --output-certificate agentry-sbom.spdx.json.pem agentry-sbom.spdx.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # release-please already created this release with the changelog as
          # its body; append the verification block instead of overwriting it.
          append_body: true
          body: |
            ---
            Verify the checksums before trusting these binaries:

            ```
            cosign verify-blob \
              --certificate SHA256SUMS.txt.pem \
              --signature SHA256SUMS.txt.sig \
              --certificate-identity-regexp '.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
            ```

            An SPDX SBOM (`agentry-sbom.spdx.json`) ships with every release.

  # One image per release: agentryd (every role, git included). The site's
  # image is built and released from its own repository (DEV-091); the
  # chart references only this one.
  image:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: agentryd, file: deploy/compose/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
