# A tag per ruleset version, so old rulesets can be read back for lineage
# tracing. Every scan run names the ruleset_releases row that judged it, and
# the row keeps the bundle's semver and digest but not the bundle. The first main commit that carries a
# new version in rules/bundle.yaml is tagged ruleset/v<version>, so the bundle
# (and the Go stages of its day) can be read back and the row's digest
# checked against it (pkg/ruleset/README.md). A tag that exists is left where
# it is. workflow_dispatch on main tags a version a missed run left untagged.
# The tag is made through the API with the job's token, which starts no
# other workflow; nothing listens for these tags.
name: ruleset-tag
on:
  push:
    branches: [main]
    paths: [rules/bundle.yaml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ruleset-tag
  cancel-in-progress: false
jobs:
  tag:
    if: github.repository == 'blaktron/agentry' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: tag ruleset/v<version> unless it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ver=$(sed -nE 's/^version: *"?([^"]+)"? *$/\1/p' rules/bundle.yaml)
          if [ -z "$ver" ]; then echo "::error::no version in rules/bundle.yaml"; exit 1; fi
          tag="ruleset/v$ver"
          api="https://api.github.com/repos/$REPO/git"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$api/ref/tags/$tag")
          case "$code" in
            200) echo "$tag exists; left where it is"; exit 0 ;;
            404) ;;
            *) echo "::error::looking up $tag: HTTP $code"; exit 1 ;;
          esac
          body=$(jq -n --arg ref "refs/tags/$tag" --arg sha "$GITHUB_SHA" '{ref: $ref, sha: $sha}')
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$api/refs" -d "$body"
          echo "tagged $tag at $GITHUB_SHA"
