# CI gate: lint, generated-code drift, ruleset-copy drift, tests (real
# Postgres), build, dependency hygiene (govulncheck + osv-scanner + lockfile
# integrity + image scan), OpenAPI breaking-change check, TS client smoke.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a new push to a PR cancels the superseded run (self-hosted
# capacity is a handful of runners, not a cloud).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentry
          POSTGRES_PASSWORD: agentry
          POSTGRES_DB: agentry_test
        ports: ["5432"]  # ephemeral host port: several runners per host (agentry#125)
        options: >-
          --health-cmd "pg_isready -U agentry" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Point the tests at the service's mapped port
        run: echo "AGENTRY_TEST_DATABASE_URL=postgres://agentry:agentry@localhost:${{ job.services.postgres.ports['5432'] }}/agentry_test?sslmode=disable" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: Install web deps
        run: cd web && npm ci
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      # The rule bundle exists twice — canonical /rules and the embeddable
      # copy under internal/scan/ruleset/rules, because go:embed cannot reach
      # outside a package directory. DEV-011 claimed CI enforced that they
      # match; nothing did, so a rule could ship to the CLI and not the server.
      # `make check` runs this too; it is called out here so a drift failure
      # names itself in the job log rather than hiding inside a long target.
      - name: ruleset copy in sync
        run: make sync-rules-check
      - name: make check
        run: make check
      - name: web check (types + unit)
        run: make web-check
      - name: acceptance M0
        run: ./scripts/acceptance/m0.sh

  # Browser smoke (DEV-031): real Chromium over the load-bearing pages and a
  # same-origin form post. Exists because curl-level coverage shipped a
  # browser-only outage — every form post 403'd under real browser semantics
  # (Referrer-Policy ⇒ Origin: null) while every scripted check stayed green.
  e2e-browser:
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentry
          POSTGRES_PASSWORD: agentry
          POSTGRES_DB: agentry_test
        ports: ["5432"]  # ephemeral host port: several runners per host (agentry#125)
        options: >-
          --health-cmd "pg_isready -U agentry" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Point the tests at the service's mapped port
        run: echo "AGENTRY_TEST_DATABASE_URL=postgres://agentry:agentry@localhost:${{ job.services.postgres.ports['5432'] }}/agentry_test?sslmode=disable" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web deps
        run: cd web && npm ci
      - name: Install chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: browser smoke
        run: ./scripts/acceptance/e2e-browser.sh

  govulncheck:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Dependency hygiene of the product itself (§17.5, T-13). A registry that
  # gates other people's supply chains and does not audit its own is making a
  # claim it has not earned.
  deps:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Both lockfiles must exist and be internally consistent BEFORE the
      # vulnerability scan reads them: osv-scanner reports nothing at all for
      # a lockfile it cannot parse, which looks exactly like a clean result.
      - name: lockfile presence and integrity
        run: |
          set -euo pipefail
          test -f go.sum               || { echo "go.sum is missing"; exit 1; }
          test -f web/package-lock.json || { echo "web/package-lock.json is missing"; exit 1; }
          # `go mod verify` checks the module cache against go.sum hashes;
          # `go mod tidy -diff` fails when go.mod/go.sum do not match the code.
          go mod verify
          go mod tidy -diff
          jq -e '.lockfileVersion >= 2' web/package-lock.json > /dev/null \
            || { echo "web/package-lock.json is not lockfileVersion >= 2"; exit 1; }
      - name: npm lockfile matches package.json
        run: cd web && npm ci --ignore-scripts --dry-run
      # The osv-scanner release binary (v2.5.1, the latest release) is built
      # with Go 1.26 and cannot load this go 1.27 module for call analysis,
      # so the action degrades to a lockfile-only scan and re-reports
      # GO-2026-5932 (the standing x/crypto/openpgp deprecation advisory —
      # this repo imports only x/crypto/argon2). Compile the scanner with
      # the runner's Go 1.27 toolchain instead, which restores call
      # analysis — the same mechanism `make deps-audit` uses locally.
      - name: osv-scanner (go.mod + web/package-lock.json)
        run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@latest scan --lockfile=go.mod --lockfile=web/package-lock.json

  # Third-party verification of the attestations this code signs
  # (agentry#26, DEV-035): cosign — which shares no code with pkg/attest —
  # must verify both the publish and the ruleset envelope over a fixture
  # blob. "Format-compatible" is a claim on the trust page; this is its test.
  attest-interop:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - run: make attest-interop

  # Container image scan. The ECR-side scan (§13) covers what is deployed;
  # this catches a base-image CVE at PR time instead of at push time.
  # Non-blocking on purpose: a fresh base-image CVE with no fix available must
  # not stop unrelated work, and §13 is where the deployment gate lives.
  image-scan:
    runs-on: [self-hosted, linux, x64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t agentry:ci -f deploy/compose/Dockerfile .
      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentry:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  oasdiff:
    # Breaking-change gate on the OpenAPI contract (D-09). Additive-only in v1.
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: oasdiff breaking
        run: |
          # Diff against the PR's merge-base, not the tip of main: a path that
          # main gained after this branch was cut is not a removal by this PR
          # (agentry#138).
          base=$(git merge-base "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}" 2>/dev/null || echo "origin/${{ github.base_ref }}")
          git show "$base:schemas/openapi.yaml" > /tmp/base-openapi.yaml || cp schemas/openapi.yaml /tmp/base-openapi.yaml
          # A committed schemas/oasdiff-allow.txt names deliberate breaking
          # changes to ignore — the one-time DEV-088 exception. The file is
          # deleted by the PR after the one that lands them, so the gate is
          # fully additive again; its presence on main is itself a finding.
          ignore=""
          if [ -f schemas/oasdiff-allow.txt ]; then ignore="--err-ignore schemas/oasdiff-allow.txt"; echo "::warning::oasdiff allow file present (DEV-088 one-time exception)"; fi
          go run github.com/oasdiff/oasdiff@latest breaking /tmp/base-openapi.yaml schemas/openapi.yaml --fail-on ERR $ignore
