# CI gate for the core (the headless registry): lint, generated-code drift,
# ruleset-copy drift, tests (real Postgres), build, the smoke and core-UI
# acceptance scripts,
# dependency hygiene (govulncheck + osv-scanner + lockfile integrity + image
# scan), OpenAPI breaking-change check, the prose gate over the markdown, and
# gitleaks over the commits each event brings. Every job carries the fork
# guard (below), every checkout drops its token, and every action is pinned
# to a commit SHA.
name: ci
on:
  push:
    # dev is the integration branch; main takes only promotions from it.
    branches: [main, dev]
  pull_request:
  # A dispatch runs every job a push runs on that head (oasdiff alone is
  # pull_request-only).
  workflow_dispatch:

permissions:
  contents: read

# The CI tools' versions, in one place: no step installs anything unpinned,
# and scripts/pins-check.sh (the daily pins workflow) reads them to report
# newer releases. GITLEAKS_SHA256 is the checksum of
# gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release's own
# gitleaks_${GITLEAKS_VERSION}_checksums.txt.
env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SQLC_VERSION: v1.31.1
  OSV_SCANNER_VERSION: v2.7.0
  OASDIFF_VERSION: v1.34.1

# One run per ref: a new push to a PR cancels the superseded run (self-hosted
# capacity is a handful of runners, not a cloud).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job carries the fork guard
#   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
# This repository is public, and every job here runs on a persistent self-hosted
# runner whose containers share one module cache with each other. A pull
# request from a fork would otherwise execute its own `run:` steps there. The
# guard lives in the file, where a diff shows it; the repository setting
# "Require approval for all external contributors" stays on as
# belt-and-braces. A fork's pull request shows these
# jobs as skipped; a maintainer who wants it built pushes its commits to a
# branch here.
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    # The job's backstop, sized from the Makefile's TEST_TIMEOUT (25m);
    # change both or neither. `make check` is internal/api's time plus at
    # most 0.6 min. Everything outside `make check` (container init, checkout,
    # lint, the acceptance scripts) took at most 5.1 min on a green run on the
    # slower runners. So 25 + 0.6 + 5.1 ≈ 31, and 35 lets a package timeout
    # print its diagnosis before the job is cut. The worst green job took
    # 18.7 min, well below. A wedged runner then costs 35 minutes, not
    # GitHub's default 360.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentry
          POSTGRES_PASSWORD: agentry
          POSTGRES_DB: agentry_test
        ports: ["5432"]  # ephemeral host port: several runners per host
        options: >-
          --health-cmd "pg_isready -U agentry" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Point the tests at the service's mapped port
        run: echo "AGENTRY_TEST_DATABASE_URL=postgres://agentry:agentry@localhost:${{ job.services.postgres.ports['5432'] }}/agentry_test?sslmode=disable" >> "$GITHUB_ENV"
      # The fork-guard check parses the workflows with PyYAML; setup-python
      # brings a clean interpreter, so PyYAML is installed rather than assumed.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.3
      - name: no fork-reachable job on a self-hosted runner
        run: make workflows-check
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The runners share one persistent host module cache; restoring
          # the Actions cache over it is slow and, with several jobs
          # extracting into the same directory, leaves partial modules that
          # break `go mod verify` for everyone.
          cache: false
      - name: Install sqlc
        run: go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # The runner keeps its own lint cache between jobs; the action's
          # default would also save it to GitHub's Actions cache and restore
          # it over the directory the container already holds.
          skip-cache: true
      # The rule bundle exists twice — canonical /rules and the embeddable
      # copy under pkg/ruleset/rules, because go:embed cannot reach outside a
      # package directory. Without the check a rule could ship to the CLI and
      # not the server.
      # `make check` runs this too; it is called out here so a drift failure
      # names itself in the job log rather than hiding inside a long target.
      # A front end's app, image, brand, terraform, downloads tooling and pages,
      # and the directory (its services, blueprints, templates and scripts),
      # are not part of this repository: nothing of them may come back.
      - name: site files stay out
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(web/|deploy/compose/Dockerfile\.web$|deploy/terraform/|deploy/compose/downloads/|deploy/compose/authentik/|scripts/dev/authentik-|scripts/directory-csp\.py$|scripts/acceptance/directory-|scripts/release/build-downloads\.sh$|docs/agentry/|docs/index\.md$|docs/extra\.css$|docs/ops/deployment\.md$)'; then
            echo "site files above do not belong in this repository"; exit 1
          fi
      # Every Dockerfile builds with go.mod's Go to the patch, so a go line
      # bump has to move the builder tag with it: a floating tag is
      # whatever a host cached, and the Go images' GOTOOLCHAIN=local keeps it.
      - name: Dockerfiles build with go.mod's Go
        run: |
          set -euo pipefail
          want=$(awk '$1 == "go" {print $2; exit}' go.mod)
          mapfile -d '' files < <(git ls-files -z -- ':(glob)**/Dockerfile*')
          [ "${#files[@]}" -gt 0 ] || exit 0
          # Every FROM of a golang image, whatever its registry or flags.
          from=$(grep -niHE '^\s*FROM\s+(--\S+\s+)*(\S*/)?golang(:|@|\s|$)' "${files[@]}" || [ $? -eq 1 ])
          bad=$(printf '%s' "$from" | grep -viE "golang:${want//./\\.}([-@[:space:]]|$)" || [ $? -eq 1 ])
          if [ -n "$bad" ]; then
            echo "$bad"; echo "these build with another Go than go.mod's go $want"; exit 1
          fi
      - name: ruleset copy in sync
        run: make sync-rules-check
      - name: make check
        run: make check
      # No acceptance line may print OK for a -run filter that matched
      # nothing, and every test named as evidence for a security invariant
      # exists under that name.
      - name: acceptance helper refuses an empty match
        run: ./scripts/acceptance/lib-selftest.sh
      - name: security invariant test names exist
        run: ./scripts/acceptance/invariant-test-names.sh
      - name: acceptance smoke
        run: ./scripts/acceptance/smoke.sh
      # The server's own browser surface, driven with curl.
      - name: acceptance core UI
        run: ./scripts/acceptance/ui.sh
      - name: edge request budgets
        run: ./scripts/acceptance/edge.sh

  # The prose gate: the honest-posture sentences are still where they
  # belong, and no never-word has appeared outside an allowlisted span. Stdlib
  # python3 and bash — this repository's CI carries no Node. The job sets
  # UNSLOP_SKIP=1 because the advisory battery is read by a person in the copy
  # loop rather than in a job log, and a runner should not fetch and execute
  # third-party code for output that never blocks. It runs by hand —
  # `make prose-check`, or with UNSLOP_DIR pointing at a local clone.
  prose-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    env:
      UNSLOP_SKIP: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The runner image is Ubuntu-based and ships python3; the scripts are
      # stdlib-only and need 3.9 or newer. This pins the version when the tool
      # cache has it and is allowed to fail, so a runner without it falls back
      # to the image's own python3 rather than turning the job red on setup.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        continue-on-error: true
        with:
          python-version: "3.12"
      - run: python3 --version
      - name: posture sentences and never list
        run: scripts/prose/check.sh
      - name: the gate fails when it should
        run: scripts/prose/check.sh --self-test

  govulncheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The runners share one persistent host module cache; restoring
          # the Actions cache over it is slow and, with several jobs
          # extracting into the same directory, leaves partial modules that
          # break `go mod verify` for everyone.
          cache: false
      - run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  # Dependency hygiene of the product itself. A registry that
  # gates other people's supply chains and does not audit its own is making a
  # claim it has not earned.
  deps:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The runners share one persistent host module cache; restoring
          # the Actions cache over it is slow and, with several jobs
          # extracting into the same directory, leaves partial modules that
          # break `go mod verify` for everyone.
          cache: false
      # Both lockfiles must exist and be internally consistent BEFORE the
      # vulnerability scan reads them: osv-scanner reports nothing at all for
      # a lockfile it cannot parse, which looks exactly like a clean result.
      - name: lockfile presence and integrity
        run: |
          set -euo pipefail
          test -f go.sum || { echo "go.sum is missing"; exit 1; }
          # `go mod verify` checks the module cache against go.sum hashes;
          # `go mod tidy -diff` fails when go.mod/go.sum do not match the code.
          go mod verify
          go mod tidy -diff
      # The osv-scanner release binary (v2.5.1, when this was written) is built
      # with Go 1.26 and cannot load this go 1.27 module for call analysis,
      # so the action degrades to a lockfile-only scan and re-reports
      # GO-2026-5932 (the standing x/crypto/openpgp deprecation advisory —
      # this repo imports only x/crypto/argon2). Compile the scanner with
      # the runner's Go 1.27 toolchain instead, which restores call
      # analysis — the same mechanism `make deps-audit` uses locally.
      - name: osv-scanner (go.mod)
        run: go run "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}" scan --lockfile=go.mod

  # Third-party verification of the attestations this code signs
  # cosign — which shares no code with pkg/attest —
  # must verify both the publish and the ruleset envelope over a fixture
  # blob. "Format-compatible" is a claim on the trust page; this is its test.
  attest-interop:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The runners share one persistent host module cache; restoring
          # the Actions cache over it is slow and, with several jobs
          # extracting into the same directory, leaves partial modules that
          # break `go mod verify` for everyone.
          cache: false
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - run: make attest-interop

  # Container image scan. The registry-side scan covers what is deployed;
  # this catches a base-image CVE at PR time instead of at push time.
  # Non-blocking on purpose: a fresh base-image CVE with no fix available must
  # not stop unrelated work; the deployment gate lives elsewhere.
  image-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # --pull: the builder is pinned to go.mod's Go, but the runtime base
      # still floats, and a stale one would be scanned in place of the
      # current one.
      - name: build image
        run: docker build --pull -t agentry:ci -f deploy/compose/Dockerfile .
      - name: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentry:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  # The headless helm chart: lint, a template render with the required
  # values, and the assertion that nothing web-shaped renders (the hosted
  # site is its own deployment).
  helm:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: helm lint + template (scripts/acceptance/helm.sh)
        run: ./scripts/acceptance/helm.sh
      - name: no web object in the rendered chart
        run: |
          set -euo pipefail
          out=$(helm template acc deploy/helm/agentry \
            --set secret.databaseUrl='postgres://u:p@db:5432/agentry?sslmode=require' \
            --set secret.sealingKey='c2VhbGluZ2tleXNlYWxpbmdrZXlzZWFsaW5na2V5MDA=' \
            --set config.storage.s3Bucket='agentry-releases' \
            --set config.signing.kmsKeyARN='arn:aws:kms:us-east-1:111122223333:key/x')
          if echo "$out" | grep -nE 'component: web|name: [a-z0-9-]+-web$|Dockerfile\.web|/web:'; then
            echo "the chart still renders a web object"; exit 1
          fi
          echo "rendered $(echo "$out" | grep -c '^kind: ') objects, none web-shaped"

  oasdiff:
    # Breaking-change gate on the OpenAPI contract. Additive-only in v1.
    # Pull requests only, so the guard is the fork half alone.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # Shared persistent module cache on the self-hosted runners; the
          # runner image ships no Go of its own.
          cache: false
      - name: oasdiff breaking
        # The refs arrive through env:, never interpolated into the script.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Diff against the PR's merge-base, not the tip of main: a path that
          # main gained after this branch was cut is not a removal by this PR.
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA" 2>/dev/null || echo "origin/$BASE_REF")
          git show "$base:schemas/openapi.yaml" > /tmp/base-openapi.yaml || cp schemas/openapi.yaml /tmp/base-openapi.yaml
          # A committed schemas/oasdiff-allow.txt names deliberate breaking
          # changes to ignore, a one-time exception. The file is deleted by
          # the PR after the one that lands them, so the gate is fully
          # additive again; its presence on main is itself a finding.
          ignore=""
          if [ -f schemas/oasdiff-allow.txt ]; then ignore="--err-ignore schemas/oasdiff-allow.txt"; echo "::warning::oasdiff allow file present (one-time exception)"; fi
          go run "github.com/oasdiff/oasdiff@${OASDIFF_VERSION}" breaking /tmp/base-openapi.yaml schemas/openapi.yaml --fail-on ERR $ignore

  # Secret scanning: gitleaks over the commits this event
  # brings — a pull request's own range, or a push's before..after — with the
  # repository's .gitleaks.toml, failing on any hit (a dispatched run: the
  # ref's commits over main). The binary is the release
  # tarball at the pinned version, checked against the pinned checksum before
  # it runs (the runner image's copy is not relied on). --redact: a hit names
  # the file, line and rule, never the value.
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks at the pinned version, checksum-verified
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan the commits this event brings
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A dispatched run: what the ref brings
            # over main, as its pull request would.
            range="origin/main..$PUSH_AFTER"
          elif [ -n "$PUSH_BEFORE" ] && ! grep -qE '^0+$' <<<"$PUSH_BEFORE" && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # A push with no usable "before" (a new branch, a force-push over
            # a commit this clone does not have): the whole history.
            range="$PUSH_AFTER"
          fi
          echo "scanning $range"
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --config .gitleaks.toml \
            --redact --no-banner --exit-code 1 --log-opts="$range"
