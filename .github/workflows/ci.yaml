# CI gate for the core (DEV-091: the headless registry — the site has its
# own repository and CI): lint, generated-code drift, ruleset-copy drift,
# tests (real Postgres), build, the M0 and core-UI acceptance scripts,
# dependency hygiene (govulncheck + osv-scanner + lockfile integrity + image
# scan), OpenAPI breaking-change check, and the prose gate over the markdown.
name: ci
on:
  push:
    # dev is the integration branch; main is production (WORKFLOW.md
    # "Branches", 2026-09-22).
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# One run per ref: a new push to a PR cancels the superseded run (self-hosted
# capacity is a handful of runners, not a cloud).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentry
          POSTGRES_PASSWORD: agentry
          POSTGRES_DB: agentry_test
        ports: ["5432"]  # ephemeral host port: several runners per host (agentry#125)
        options: >-
          --health-cmd "pg_isready -U agentry" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Point the tests at the service's mapped port
        run: echo "AGENTRY_TEST_DATABASE_URL=postgres://agentry:agentry@localhost:${{ job.services.postgres.ports['5432'] }}/agentry_test?sslmode=disable" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runners share one persistent host module cache (agentry#154);
          # restoring the Actions cache over it is slow and, with several jobs
          # extracting into the same directory, leaves partial modules that
          # break `go mod verify` for everyone (agentry#225).
          cache: false
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      # The rule bundle exists twice — canonical /rules and the embeddable
      # copy under internal/scan/ruleset/rules, because go:embed cannot reach
      # outside a package directory. DEV-011 claimed CI enforced that they
      # match; nothing did, so a rule could ship to the CLI and not the server.
      # `make check` runs this too; it is called out here so a drift failure
      # names itself in the job log rather than hiding inside a long target.
      # The site left this repository at the cut-over (DEV-091, agentry#206):
      # nothing of it may come back — its app, image, brand, terraform,
      # downloads tooling and pages live in blaktron/agentry-web.
      - name: site files stay out
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(web/|deploy/compose/Dockerfile\.web$|deploy/terraform/|deploy/compose/downloads/|deploy/compose/authentik/branding\.css$|scripts/dev/authentik-brand\.sh$|scripts/release/build-downloads\.sh$|docs/agentry/|docs/index\.md$|docs/extra\.css$|docs/ops/deployment\.md$)'; then
            echo "site files above belong to blaktron/agentry-web"; exit 1
          fi
      - name: ruleset copy in sync
        run: make sync-rules-check
      - name: make check
        run: make check
      - name: acceptance M0
        run: ./scripts/acceptance/m0.sh
      # The server's own browser surface, driven with curl (DEV-091).
      - name: acceptance core UI
        run: ./scripts/acceptance/ui.sh

  # The prose gate (plan front-end-voice-and-warmth §7, agentry#258): the
  # honest-posture sentences of §4.6 are still where they belong, and no
  # never-word of §4.4 has appeared outside an allowlisted span. Stdlib
  # python3 and bash — this repository's CI carries no Node. The job sets
  # UNSLOP_SKIP=1 because the advisory battery is read by a person in the copy
  # loop rather than in a job log, and a runner should not fetch and execute
  # third-party code for output that never blocks. It runs by hand —
  # `make prose-check`, or with UNSLOP_DIR pointing at a local clone.
  prose-check:
    runs-on: [self-hosted, linux, x64]
    env:
      UNSLOP_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      # The runner image is Ubuntu-based and ships python3; the scripts are
      # stdlib-only and need 3.9 or newer. This pins the version when the tool
      # cache has it and is allowed to fail, so a runner without it falls back
      # to the image's own python3 rather than turning the job red on setup.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
      - run: python3 --version
      - name: posture sentences and never list
        run: scripts/prose/check.sh
      - name: the gate fails when it should
        run: scripts/prose/check.sh --self-test

  govulncheck:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runners share one persistent host module cache (agentry#154);
          # restoring the Actions cache over it is slow and, with several jobs
          # extracting into the same directory, leaves partial modules that
          # break `go mod verify` for everyone (agentry#225).
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Dependency hygiene of the product itself (§17.5, T-13). A registry that
  # gates other people's supply chains and does not audit its own is making a
  # claim it has not earned.
  deps:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runners share one persistent host module cache (agentry#154);
          # restoring the Actions cache over it is slow and, with several jobs
          # extracting into the same directory, leaves partial modules that
          # break `go mod verify` for everyone (agentry#225).
          cache: false
      # Both lockfiles must exist and be internally consistent BEFORE the
      # vulnerability scan reads them: osv-scanner reports nothing at all for
      # a lockfile it cannot parse, which looks exactly like a clean result.
      - name: lockfile presence and integrity
        run: |
          set -euo pipefail
          test -f go.sum || { echo "go.sum is missing"; exit 1; }
          # `go mod verify` checks the module cache against go.sum hashes;
          # `go mod tidy -diff` fails when go.mod/go.sum do not match the code.
          go mod verify
          go mod tidy -diff
      # The osv-scanner release binary (v2.5.1, the latest release) is built
      # with Go 1.26 and cannot load this go 1.27 module for call analysis,
      # so the action degrades to a lockfile-only scan and re-reports
      # GO-2026-5932 (the standing x/crypto/openpgp deprecation advisory —
      # this repo imports only x/crypto/argon2). Compile the scanner with
      # the runner's Go 1.27 toolchain instead, which restores call
      # analysis — the same mechanism `make deps-audit` uses locally.
      - name: osv-scanner (go.mod)
        run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@latest scan --lockfile=go.mod

  # Third-party verification of the attestations this code signs
  # (agentry#26, DEV-035): cosign — which shares no code with pkg/attest —
  # must verify both the publish and the ruleset envelope over a fixture
  # blob. "Format-compatible" is a claim on the trust page; this is its test.
  attest-interop:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runners share one persistent host module cache (agentry#154);
          # restoring the Actions cache over it is slow and, with several jobs
          # extracting into the same directory, leaves partial modules that
          # break `go mod verify` for everyone (agentry#225).
          cache: false
      - uses: sigstore/cosign-installer@v3
      - run: make attest-interop

  # Container image scan. The ECR-side scan (§13) covers what is deployed;
  # this catches a base-image CVE at PR time instead of at push time.
  # Non-blocking on purpose: a fresh base-image CVE with no fix available must
  # not stop unrelated work, and §13 is where the deployment gate lives.
  image-scan:
    runs-on: [self-hosted, linux, x64]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t agentry:ci -f deploy/compose/Dockerfile .
      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentry:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  # The headless helm chart: lint, a template render with the required
  # values, and the assertion that nothing web-shaped renders (the site is
  # its own deployment since the cut-over, DEV-091). This lived in
  # terraform.yaml until #218 deleted that workflow with the terraform
  # roots; agentry#229 brings it back here.
  helm:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint + template (scripts/acceptance/m7.sh)
        run: ./scripts/acceptance/m7.sh
      - name: no web object in the rendered chart
        run: |
          set -euo pipefail
          out=$(helm template acc deploy/helm/agentry \
            --set secret.databaseUrl='postgres://u:p@db:5432/agentry?sslmode=require' \
            --set secret.sealingKey='c2VhbGluZ2tleXNlYWxpbmdrZXlzZWFsaW5na2V5MDA=' \
            --set config.storage.s3Bucket='agentry-releases' \
            --set config.signing.kmsKeyARN='arn:aws:kms:us-east-1:111122223333:key/x')
          if echo "$out" | grep -nE 'component: web|name: [a-z0-9-]+-web$|Dockerfile\.web|/web:'; then
            echo "the chart still renders a web object"; exit 1
          fi
          echo "rendered $(echo "$out" | grep -c '^kind: ') objects, none web-shaped"

  oasdiff:
    # Breaking-change gate on the OpenAPI contract (D-09). Additive-only in v1.
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Shared persistent module cache on the self-hosted runners
          # (agentry#225); the rebuilt runner image ships no Go of its own.
          cache: false
      - name: oasdiff breaking
        run: |
          # Diff against the PR's merge-base, not the tip of main: a path that
          # main gained after this branch was cut is not a removal by this PR
          # (agentry#138).
          base=$(git merge-base "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}" 2>/dev/null || echo "origin/${{ github.base_ref }}")
          git show "$base:schemas/openapi.yaml" > /tmp/base-openapi.yaml || cp schemas/openapi.yaml /tmp/base-openapi.yaml
          # A committed schemas/oasdiff-allow.txt names deliberate breaking
          # changes to ignore — the one-time DEV-088 exception. The file is
          # deleted by the PR after the one that lands them, so the gate is
          # fully additive again; its presence on main is itself a finding.
          ignore=""
          if [ -f schemas/oasdiff-allow.txt ]; then ignore="--err-ignore schemas/oasdiff-allow.txt"; echo "::warning::oasdiff allow file present (DEV-088 one-time exception)"; fi
          go run github.com/oasdiff/oasdiff@latest breaking /tmp/base-openapi.yaml schemas/openapi.yaml --fail-on ERR $ignore
