schemaVersion: "2"
name: issue-digest
namespace: acme
modes: [autonomous]
version: 1.0.0
summary: "Summarizes the open issues of one repository"
license: MIT
capabilities:
  mcpServers:
    - npm: github-mcp-server-js
      version: 0.1.7
      tools: [list_issues]
      egress: [api.github.com]
      env:
        GITHUB_PERMISSION: read-only
        LOGS_DIR: f7ef114b9c1a75ec175c9ed6bfb65ecb227fc477
publish:
  include: [agent.yaml, AGENT.md]
