schemaVersion: "2"
name: code-check
namespace: acme
modes: [autonomous]
version: 1.0.0
summary: "Checks code with a scanner served as a subcommand"
license: MIT
capabilities:
  mcpServers:
    - pypi: semgrep
      version: 1.182.0
      egress: [semgrep.dev]
      args: [mcp]
    - npm: github-mcp-server-js
      version: 0.1.7
      tools: [list_issues]
      secrets: [GITHUB_TOKEN]
      egress: [api.github.com]
      args: [--stdio, --read-only, --toolsets=repos,issues, --log-file=/var/lib/agentry/cache/code-check/server.log, --token-budget=120000, --since=2026-09-14T00:00:00Z, --api-url=https://api.github.com/graphql]
publish:
  include: [agent.yaml, AGENT.md]
