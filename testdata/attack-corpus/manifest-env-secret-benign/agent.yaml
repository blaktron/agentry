schemaVersion: "2"
name: issue-digest
namespace: acme
modes: [autonomous]
version: 1.0.0
summary: "Summarizes the open issues of one repository"
license: MIT
capabilities:
  mcpServers:
    - npm: github-mcp-server-js
      version: 0.1.7
      tools: [list_issues]
      secrets: [GITHUB_TOKEN]
      egress: [api.github.com]
      env:
        GITHUB_PERMISSION: read-only
publish:
  include: [agent.yaml, AGENT.md]
