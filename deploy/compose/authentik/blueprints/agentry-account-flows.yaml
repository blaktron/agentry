# Account flows for the directory service: self-enrollment, password recovery, and the
# abuse controls on both. Applied automatically by authentik's blueprint
# discovery (mounted at /blueprints/custom); idempotent — every entry is
# keyed by a stable identifier, so re-applying updates in place.
#
# Why one file (DEV-062, DEV-063): enrollment and recovery must enforce the
# SAME password rules, so the policy and the two password prompt fields are
# shared objects referenced by both flows. Splitting them across files would
# mean either duplicating the rules (drift) or a cross-file !Find whose
# success depends on the order authentik happens to discover files in.
#
# Enrollment:  captcha (5) → prompt (10) → user write, inactive (20)
#              → email confirmation, activates (30) → authenticator setup (40)
#              → login (100)
# Recovery:    identification (10) → email link (20) → authenticator (25)
#              → new password (30) → user write (40) → login (100)
#
# The two mails are the core's own templates (agentry#518), mounted at
# /templates from deploy/compose/authentik/templates: authentik's stock ones
# embed its logo and end "Powered by authentik".
#
# The registry links an IdP identity to an account by VERIFIED email (T-12)
# and the provider asserts `email_verified: true` (DEV-061). That assertion
# is only honest because a self-enrolled account is written INACTIVE and
# nothing but the emailed confirmation link activates it.
version: 1
metadata:
  name: Agentry - Account flows (enrollment, recovery)
  labels:
    blueprints.goauthentik.io/description: >
      Self-service sign-up with email confirmation, password recovery, and
      the CAPTCHA + per-IP rate limit that protect both.
entries:
  # ==========================================================================
  # Shared: password fields and the one password strength rule
  # ==========================================================================
  # Used by BOTH the enrollment form and the password-reset form, so a
  # password set during recovery is held to the same bar as one chosen at
  # sign-up. That is the whole reason these live outside either flow.
  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers:
      name: agentry-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: "At least 12 characters"
      placeholder_expression: false
      order: 100
  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers:
      name: agentry-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: "Same again"
      placeholder_expression: false
      order: 101

  # A static 12-character minimum plus zxcvbn, so "Password1234" fails and a
  # long passphrase passes. No HIBP lookup: it needs egress from the
  # container, and an outage there would block sign-ups and resets outright.
  - model: authentik_policies_password.passwordpolicy
    id: password-policy
    identifiers:
      name: agentry-password-policy
    attrs:
      password_field: password
      check_static_rules: true
      length_min: 12
      amount_digits: 0
      amount_uppercase: 0
      amount_lowercase: 0
      amount_symbols: 0
      check_zxcvbn: true
      zxcvbn_score_threshold: 2
      check_have_i_been_pwned: false
      error_message: "Use at least 12 characters, and something harder to guess."

  # ==========================================================================
  # Abuse controls
  # ==========================================================================
  # CAPTCHA on sign-up. Defaults are Cloudflare's published Turnstile TEST
  # keys, which always pass — that keeps the dev stack working out of the box
  # and still exercises the real siteverify call. A real deployment MUST set
  # AUTHENTIK_CAPTCHA_SITE_KEY and AUTHENTIK_CAPTCHA_SECRET_KEY (compose
  # passes both through); with the test keys in place this stage stops no one.
  # Turnstile returns no score, so score checking is off rather than
  # configured to a threshold it will never report.
  - model: authentik_stages_captcha.captchastage
    id: stage-captcha
    identifiers:
      name: agentry-captcha
    attrs:
      public_key: !Env [AUTHENTIK_CAPTCHA_SITE_KEY, "1x00000000000000000000AA"]
      private_key: !Env [AUTHENTIK_CAPTCHA_SECRET_KEY, "1x0000000000000000000000000000000AA"]
      js_url: !Env [AUTHENTIK_CAPTCHA_JS_URL, "https://challenges.cloudflare.com/turnstile/v0/api.js"]
      api_url: !Env [AUTHENTIK_CAPTCHA_API_URL, "https://challenges.cloudflare.com/turnstile/v0/siteverify"]
      interactive: true
      error_on_invalid_score: false
      score_min_threshold: 0.0
      score_max_threshold: 1.0

  # Per-IP rate limit across both account flows. The CAPTCHA raises the cost
  # of a single attempt; this caps how much work one address can make the
  # system do at all, which is what stops a solver farm or a leaked-key
  # bypass from running all night.
  #
  # It counts SIDE EFFECTS, not page loads: accounts actually created plus
  # mails actually sent, from this client IP, in the last hour, read from
  # authentik's own event log. That choice is deliberate and was arrived at
  # by measurement, not preference:
  #
  #   * A policy bound to a flow is evaluated once when the flow plan is
  #     created, not per submission — so a counter keyed on POSTs never
  #     increments at all (verified: it silently did nothing).
  #   * Counting flow starts instead does work, but it punishes refreshing
  #     the sign-up page, and it needs a durable counter — which this
  #     deployment cannot provide, because authentik's cache backend
  #     (django_postgres_cache) ignores the per-entry timeout passed to
  #     incr()/touch() and expires everything at the global 300s default.
  #     A "20 per hour" limit written that way is really 20 per 5 minutes.
  #
  # The event log has none of those problems: it is durable, exactly
  # hour-accurate, and counts the things worth limiting. A real person costs
  # 2 (one account, one confirmation mail) to sign up and 1 to reset a
  # password, so the budget below is generous for a shared office address
  # and still ends bulk account creation.
  #
  # Recovery additionally has authentik's own per-user control on the email
  # stage (recovery_max_attempts / recovery_cache_timeout, set below); this
  # policy is the per-IP half, which is what stops one source mailing a
  # thousand different victims.
  #
  # Fails OPEN on an unexpected error: a broken counter must not become an
  # outage on the only route into the product.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-rate-limit
    identifiers:
      name: agentry-account-flow-rate-limit
    attrs:
      execution_logging: true
      # The per-IP budget is AUTHENTIK_ACCOUNT_FLOW_MAX_PER_HOUR (default 10),
      # formatted into the expression at apply time (agentry#53). A value
      # that is not an integer falls back to 10 rather than breaking the
      # policy — the except branch below fails open on purpose (DEV-063).
      expression: !Format
        - |
          try:
              MAX_PER_HOUR = int("%s")
          except ValueError:
              MAX_PER_HOUR = 10
          try:
              from datetime import timedelta

              from django.db.models import Q
              from django.utils.timezone import now

              from authentik.events.models import Event, EventAction
              from authentik.root.middleware import ClientIPMiddleware

              http = request.http_request
              if http is None:
                  return True
              client_ip = ClientIPMiddleware.get_client_ip(http)
              recent = (
                  Event.objects.filter(
                      client_ip=client_ip,
                      created__gte=now() - timedelta(hours=1),
                  )
                  .filter(
                      Q(action=EventAction.EMAIL_SENT)
                      | Q(action=EventAction.MODEL_CREATED, context__model__model_name="user")
                  )
                  .count()
              )
              if recent >= MAX_PER_HOUR:
                  ak_logger.info(
                      "agentry: account flow rate limit hit", ip=client_ip, recent=recent
                  )
                  ak_message("Too many attempts from this network. Please try again later.")
                  return False
          except Exception as exc:
              ak_logger.warning("agentry: rate limit check failed, allowing", exc=str(exc))
          return True
        - !Env [AUTHENTIK_ACCOUNT_FLOW_MAX_PER_HOUR, "10"]

  # ==========================================================================
  # Enrollment
  # ==========================================================================
  - model: authentik_flows.flow
    id: flow-enrollment
    identifiers:
      slug: agentry-enrollment
    attrs:
      name: Agentry enrollment
      title: !Format ["Create your %s account", !Env [AGENTRY_BRAND_NAME, "Agentry"]]
      designation: enrollment
      authentication: require_unauthenticated
      denied_action: message_continue
      layout: stacked

  - model: authentik_stages_prompt.prompt
    id: field-username
    identifiers:
      name: agentry-enrollment-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: "your registry handle: lowercase letters, digits, hyphens"
      placeholder_expression: false
      order: 0
  - model: authentik_stages_prompt.prompt
    id: field-name
    identifiers:
      name: agentry-enrollment-name
    attrs:
      field_key: name
      label: Display name
      type: text
      required: true
      placeholder: "your name on the registry"
      placeholder_expression: false
      order: 1
  - model: authentik_stages_prompt.prompt
    id: field-email
    identifiers:
      name: agentry-enrollment-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: "where the confirmation link goes"
      placeholder_expression: false
      order: 2

  # The username becomes the registry handle (DEV-142, agentry#517): the
  # first sign-in seeds the handle from preferred_username, which is this
  # field. A username the registry could not take as it is would be mapped
  # to something else without the person knowing, so the form refuses it
  # here (agentry#590, agentry-web#417). HANDLE is the core's reHandle
  # (internal/api/handlers_auth.go) and RESERVED is pathHandles plus
  # firstPartyHandles (internal/api/handles.go), byte for byte:
  # TestEnrollmentUsernamePolicyMatchesHandleRules fails when they drift.
  # A handle someone already holds in the registry is not checked: no
  # endpoint answers that without an account.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-enrollment-username
    identifiers:
      name: agentry-enrollment-username-is-a-handle
    attrs:
      execution_logging: false
      expression: |
        import re

        HANDLE = r"^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
        RESERVED = {"about", "admin", "advisories", "agent-template", "agentry", "api", "auth", "build", "contact", "cookies", "dashboard", "docs", "download", "downloads", "healthz", "img", "invitations", "login", "logout", "metrics", "new", "orgs", "pricing", "privacy", "readyz", "review", "runs", "scim", "search", "secureagentry", "settings", "signup", "sso", "staff", "static", "tags", "terms", "trust", "ui"}

        username = str((request.context.get("prompt_data") or {}).get("username") or "")
        if not re.fullmatch(HANDLE, username):
            ak_message("A username is 1 to 39 lowercase letters, digits and hyphens, and starts and ends with a letter or digit. It becomes your registry handle.")
            return False
        if username in RESERVED:
            ak_message("That username is reserved. Choose another; it becomes your registry handle.")
            return False
        return True

  # The promo code (plan promo-codes.md §5.1, agentry#759): optional, and
  # present only where the deployment sells subscriptions and sets
  # AGENTRY_DIRECTORY_PROMO_FIELD=true in the directory's environment (the
  # SecureAgentry overlay and chart do). Any non-empty value turns it on and
  # unset or empty leaves it off: a blueprint cannot compare strings, so
  # "false" would count as on, and !ParseJSON will not take !Env's value
  # (agentry#759's probe). Off, the field is a hidden input the form never
  # shows. Its value is written to the account's attributes at the
  # enrolment write, so it survives a confirmation link opened on another
  # device, and it reaches the registry as the `agentry` scope's
  # agentry_promo_code claim. The registry forwards it to its extensions only
  # when that sign-in makes the account; whether the code exists is the billing
  # extension's to decide then, and nothing here asks.
  - model: authentik_stages_prompt.prompt
    id: field-promo-code
    identifiers:
      name: agentry-enrollment-promo-code
    attrs:
      field_key: attributes.agentry_promo_code
      label: Promo code (optional)
      type: !If [!Condition [AND, !Env [AGENTRY_DIRECTORY_PROMO_FIELD, ""]], text, hidden]
      required: false
      placeholder: ""
      placeholder_expression: false
      # A promo link opens this flow as /if/flow/agentry-enrollment/?promo=CODE
      # and the field starts filled in: the page's executor calls carry the
      # page's own query as `query`. Only while the field is on: a hidden
      # field keeps its initial value whatever is posted, so off, the value
      # stays empty and no link can put a code in it.
      initial_value_expression: !If [!Condition [AND, !Env [AGENTRY_DIRECTORY_PROMO_FIELD, ""]], true, false]
      initial_value: !If
        - !Condition [AND, !Env [AGENTRY_DIRECTORY_PROMO_FIELD, ""]]
        - |
          from urllib.parse import parse_qs
          http = getattr(request, "http_request", None) or request
          query = parse_qs(http.GET.get("query", "")) if http is not None else {}
          return (query.get("promo") or [""])[0][:32]
        - ""
      sub_text: "If you were given a code, enter it here. It is applied when you first sign in."
      order: 102
  # A code is held to the registry's grammar on the form (letters, digits and
  # hyphens, 4 to 32, starting with a letter or digit), so a typo of shape is
  # caught before the account exists. Empty passes: the field is optional.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-enrollment-promo-code
    identifiers:
      name: agentry-enrollment-promo-code-grammar
    attrs:
      execution_logging: false
      expression: |
        import re

        # The serializer reads the dotted field key as a nested source, so at
        # validation the value sits under attributes (agentry#759's probe);
        # the flat key is read too, as the enrolment write names it.
        data = request.context.get("prompt_data") or {}
        code = data.get("attributes.agentry_promo_code")
        if code is None:
            code = (data.get("attributes") or {}).get("agentry_promo_code")
        code = str(code or "").strip()
        if code == "":
            return True
        if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]{3,31}", code):
            ak_message("A promo code is 4 to 32 letters, digits and hyphens. Leave the field empty if you have none.")
            return False
        return True

  - model: authentik_stages_prompt.promptstage
    id: stage-enrollment-prompt
    identifiers:
      name: agentry-enrollment-prompt
    attrs:
      fields:
        - !KeyOf field-username
        - !KeyOf field-name
        - !KeyOf field-email
        - !KeyOf field-password
        - !KeyOf field-password-repeat
        - !KeyOf field-promo-code
      validation_policies:
        - !KeyOf password-policy
        - !KeyOf policy-enrollment-username
        - !KeyOf policy-enrollment-promo-code

  - model: authentik_stages_user_write.userwritestage
    id: stage-enrollment-user-write
    identifiers:
      name: agentry-enrollment-user-write
    attrs:
      create_users_as_inactive: true
      user_creation_mode: always_create
      user_type: internal
      user_path_template: users/self-enrolled

  - model: authentik_stages_email.emailstage
    id: stage-enrollment-email
    identifiers:
      name: agentry-enrollment-email-confirmation
    attrs:
      use_global_settings: true
      template: agentry/account_confirmation.html
      subject: !Format ["Confirm your %s account", !Env [AGENTRY_BRAND_NAME, "Agentry"]]
      activate_user_on_success: true
      token_expiry: minutes=30

  - model: authentik_stages_user_login.userloginstage
    id: stage-enrollment-login
    identifiers:
      name: agentry-enrollment-login
    attrs:
      # No authentik_device cookie (agentry#460): see the sign-in's login
      # stage below.
      remember_device: seconds=0
      remember_me_offset: seconds=0

  # Authenticator (TOTP) setup inside enrollment (agentry#53, DEV-062):
  # every new account leaves the flow with an authenticator, which is what
  # the registry's public-publish gate reads back through the amr claim
  # (DEV-080). Binding order 40: after the address is confirmed, before
  # the session is created.
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    id: stage-totp-setup
    identifiers:
      name: agentry-authenticator-totp-setup
    attrs:
      friendly_name: !Format ["%s authenticator", !Env [AGENTRY_BRAND_NAME, "Agentry"]]
      digits: 6

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-captcha
      order: 5
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-enrollment-prompt
      order: 10
  - model: authentik_flows.flowstagebinding
    id: binding-enrollment-write
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-enrollment-user-write
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-enrollment-email
      order: 30
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-totp-setup
      order: 40
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-enrollment-login
      order: 100

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-rate-limit
      target: !KeyOf flow-enrollment
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # ==========================================================================
  # Password recovery
  # ==========================================================================
  - model: authentik_flows.flow
    id: flow-recovery
    identifiers:
      slug: agentry-recovery
    attrs:
      name: Agentry recovery
      title: !Format ["Reset your %s password", !Env [AGENTRY_BRAND_NAME, "Agentry"]]
      designation: recovery
      authentication: require_unauthenticated
      denied_action: message_continue
      layout: stacked

  # pretend_user_exists is the anti-enumeration setting: an unknown address
  # gets the same "check your email" answer a real one does, so this form
  # cannot be used to discover who has an account.
  - model: authentik_stages_identification.identificationstage
    id: stage-recovery-identification
    identifiers:
      name: agentry-recovery-identification
    attrs:
      user_fields:
        - email
        - username
      case_insensitive_matching: true
      pretend_user_exists: true
      show_matched_user: false

  # activate_user_on_success is deliberately FALSE here, unlike the
  # enrollment stage. Recovery proves control of the mailbox, but an account
  # can also be inactive because an operator deactivated it — and a
  # deactivated user must not be able to reactivate themselves by requesting
  # a password reset. Only enrollment confirmation activates an account.
  - model: authentik_stages_email.emailstage
    id: stage-recovery-email
    identifiers:
      name: agentry-recovery-email
    attrs:
      use_global_settings: true
      template: agentry/password_reset.html
      subject: !Format ["Reset your %s password", !Env [AGENTRY_BRAND_NAME, "Agentry"]]
      activate_user_on_success: false
      token_expiry: minutes=30
      recovery_max_attempts: 5
      recovery_cache_timeout: minutes=30

  - model: authentik_stages_prompt.promptstage
    id: stage-recovery-prompt
    identifiers:
      name: agentry-recovery-prompt
    attrs:
      fields:
        - !KeyOf field-password
        - !KeyOf field-password-repeat
      validation_policies:
        - !KeyOf password-policy

  - model: authentik_stages_user_write.userwritestage
    id: stage-recovery-user-write
    identifiers:
      name: agentry-recovery-user-write
    attrs:
      user_creation_mode: never_create

  - model: authentik_stages_user_login.userloginstage
    id: stage-recovery-login
    identifiers:
      name: agentry-recovery-login
    attrs:
      # No authentik_device cookie (agentry#460): see the sign-in's login
      # stage below.
      remember_device: seconds=0
      remember_me_offset: seconds=0

  # When the user returns by clicking the emailed link, the flow plan is
  # restored and the identification stage has already been answered — this
  # policy skips re-asking. Mirrors authentik's own recovery example.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-skip-if-restored
    identifiers:
      name: agentry-recovery-skip-if-restored
    attrs:
      expression: |
        return bool(request.context.get('is_restored', True))

  - model: authentik_flows.flowstagebinding
    id: binding-recovery-identification
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-identification
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-email
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry
  # Recovery proves the authenticator before the password may change
  # (agentry#53): a user with one presents it; a user without one is sent
  # through the same TOTP setup stage enrollment uses (not_configured_action:
  # configure), so nobody leaves recovery without an authenticator either.
  # Lost-authenticator recovery is an operator action in authentik's admin
  # UI by design — email alone must not reset both factors.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: stage-recovery-mfa
    identifiers:
      name: agentry-recovery-authenticator-validate
    attrs:
      device_classes: [totp, webauthn, static]
      not_configured_action: configure
      configuration_stages:
        - !KeyOf stage-totp-setup
      last_auth_threshold: seconds=0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-mfa
      order: 25
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-prompt
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    id: binding-recovery-write
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-user-write
      order: 40
    attrs:
      # When the stage is reached, not when the flow is planned: the
      # has-password policy below reads the new password (agentry#706).
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-login
      order: 100
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-skip-if-restored
      target: !KeyOf binding-recovery-identification
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-rate-limit
      target: !KeyOf flow-recovery
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # ==========================================================================
  # Surface both on the login page
  # ==========================================================================
  # The shipped identification stage renders a "Sign up" link when it has an
  # enrollment flow and a "Forgot password?" link when it has a recovery one.
  # user_fields is restated because authentik validates the whole stage on
  # update and rejects "no user fields and no sources"; these are the shipped
  # defaults, so nothing about sign-in changes.
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - email
        - username
      enrollment_flow: !KeyOf flow-enrollment
      recovery_flow: !KeyOf flow-recovery

  # ==========================================================================
  # Cleanup: objects superseded by the shared ones above (DEV-063)
  # ==========================================================================
  # These were created by the first version of this blueprint, when the
  # password field and policy lived inside the enrollment flow. They are
  # unreferenced now that both flows share one set. No-ops on a fresh
  # install; removable once every deployment has applied this once.
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: agentry-enrollment-password
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: agentry-enrollment-password-repeat
  - model: authentik_policies_password.passwordpolicy
    state: absent
    identifiers:
      name: agentry-enrollment-password-policy

  # ==========================================================================
  # Remembered browsers (agentry#671, DEV-163)
  # ==========================================================================
  # "Remember this device for 30 days" is offered on the sign-in's code page
  # and honoured by skipping that page. The record is the registry's (DEV-123):
  # it mints one on the OIDC callback and answers whether a browser holds a
  # live one. The directory's part is the four entries below plus the flow
  # page's template (templates/if/flow.html), which draws the unticked box on
  # the code page and, when it is ticked, sets the short-lived intent cookie
  # `agentry_remember_intent` on this host.
  #
  # The environment carries the two values the skip needs, read when the
  # policy runs rather than formatted in here, so the secret never lands in
  # the directory's database or its admin console:
  #   AGENTRY_IDP_TRUST_CHECK_TOKEN  the registry's auth.idpTrustCheckToken
  #   AGENTRY_REGISTRY_INTERNAL_URL  the registry as this container reaches it
  # With either unset the policy asks for the code, always. Never run the
  # directory with AUTHENTIK_DEBUG where the secret matters: its debug HTTP
  # session logs outgoing requests, this one's headers included.
  #
  # Two traps, each pinned by a test (TestDirectoryRememberBlueprint):
  # - The stock MFA binding already carries authentik's passwordless-WebAuthn
  #   policy, in engine mode `any`. Under `any` a second policy answering
  #   "skip" changes nothing, because the stock one passes. So the binding
  #   is restated here in mode `all`: the stage runs only when the sign-in
  #   was not passwordless WebAuthn and the browser is not remembered, and
  #   is skipped when either holds, which is the meaning both policies
  #   intend.
  # - A policy that raises counts as failed, and a failed binding policy
  #   SKIPS its stage. Only `failure_result: true` on our binding turns an
  #   exception into "ask for the code". Without it this fails open.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-remembered-browser-skip
    identifiers:
      name: agentry-remembered-browser-skip
    attrs:
      execution_logging: false
      expression: |
        # Skip the code only when the registry says this browser's cookie is
        # a live remembered browser of the person signing in. Anything else,
        # including no answer, asks for the code.
        import os
        secret = os.environ.get("AGENTRY_IDP_TRUST_CHECK_TOKEN", "")
        base = os.environ.get("AGENTRY_REGISTRY_INTERNAL_URL", "")
        if not secret or not base:
            return True
        cookie = request.http_request.COOKIES.get("agentry_trusted_device") if request.http_request else None
        user = request.context.get("pending_user")
        if not cookie or user is None:
            return True
        try:
            answer = requests.post(
                base.rstrip("/") + "/internal/directory/trusted-device",
                json={"token": cookie, "sub": user.uid},
                headers={"Authorization": "Bearer " + secret},
                timeout=2,
                allow_redirects=False,
            )
            if answer.status_code == 200 and answer.json().get("trusted") is True:
                ak_logger.info("agentry: a remembered browser, the code is not asked")
                return False
        except Exception as exc:
            ak_logger.warning("agentry: the registry's check did not answer, the code is asked", error=type(exc).__name__)
        return True
  - model: authentik_policies_expression.expressionpolicy
    id: policy-remember-intent
    identifiers:
      name: agentry-remember-intent
    attrs:
      execution_logging: false
      expression: |
        # Carry a ticked "Remember this device" into the sign-in's record,
        # only when this flow validated a second factor. It always passes:
        # it exists for its side effect, not to gate the login stage.
        plan = context.get("flow_plan")
        if plan is None:
            return True
        args = plan.context.get("auth_method_args") or {}
        # On https only the __Host- name counts: a sibling host under the
        # same parent domain can set the plain one, never the prefixed one.
        req = request.http_request
        name = "__Host-agentry_remember_intent" if req is not None and req.is_secure() else "agentry_remember_intent"
        ticked = req is not None and req.COOKIES.get(name) == "1"
        if ticked and "mfa_devices" in args:
            args["agentry_remember_device"] = True
            plan.context["auth_method_args"] = args
        return True
  # The claim. The login event is where authentik keeps this sign-in's
  # auth_method_args, and the same event gives the token its amr and its
  # auth_time; the registry mints only when all three agree (agentry#670).
  - model: authentik_providers_oauth2.scopemapping
    id: scope-agentry
    identifiers:
      name: agentry-remember-device
    attrs:
      scope_name: agentry
      description: Whether this sign-in asked to remember the browser, the account's directory id, and the promo code given at sign-up
      expression: |
        from authentik.events.signals import get_login_event
        event = get_login_event(token.session) if token is not None and getattr(token, "session", None) else None
        args = (event.context.get("auth_method_args") or {}) if event else {}
        claims = {"agentry_remember_device": args.get("agentry_remember_device") is True}
        # The directory's own id for the account (agentry#727): the registry
        # reads the account by it rather than by an address, which the
        # directory does not keep unique.
        account = request.user if request is not None else None
        if account is not None and getattr(account, "pk", None):
            claims["agentry_directory_id"] = account.pk
            # The promo code typed at sign-up (agentry#759), when there was
            # one. The registry reads it only on the sign-in that makes the
            # account, so it is harmless on every later token.
            code = str((account.attributes or {}).get("agentry_promo_code") or "").strip()
            if code:
                claims["agentry_promo_code"] = code
        return claims
  # The shipped sign-in flow's two bindings, restated by their shipped
  # identifiers so this updates them in place. Both policies must run when
  # the stage is reached, not when the plan is made: the cookie arrives with
  # the executor's requests, and the factor is validated after the plan.
  - model: authentik_flows.flowstagebinding
    id: binding-signin-mfa
    identifiers:
      order: 30
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
    attrs:
      policy_engine_mode: all
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      order: 20
      target: !KeyOf binding-signin-mfa
      policy: !KeyOf policy-remembered-browser-skip
    attrs:
      enabled: true
      negate: false
      failure_result: true
      timeout: 5
  # authentik's own "known device" cookie is off on every login stage
  # (agentry#460; operator decision 2026-09-25, "do not create unrecoverable
  # tokens"). A User Login stage's `remember_device` defaults to days=30 and
  # writes `authentik_device`, a JWT the directory keeps no record of: it
  # cannot be listed or revoked, and rotating AUTHENTIK_SECRET_KEY does not
  # end it (its key derives from the installation's identifier and the
  # stage). The remembered browser above is the one device credential. The
  # shipped stages are restated by name, like the identification stage;
  # authentik's default blueprints name them with no attributes, so a
  # re-apply of those does not undo this.
  #
  # `remember_me_offset` stays at its default of zero, and must: above zero
  # the stage shows authentik's own "Remember me" box next to ours, and a
  # login that carries that explicit choice never writes the device cookie
  # whatever `remember_device` says, so the two settings interact silently.
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: default-authentication-login
    attrs:
      remember_device: seconds=0
      remember_me_offset: seconds=0
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: default-source-authentication-login
    attrs:
      remember_device: seconds=0
      remember_me_offset: seconds=0
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: default-source-enrollment-login
    attrs:
      remember_device: seconds=0
      remember_me_offset: seconds=0
  - model: authentik_flows.flowstagebinding
    id: binding-signin-login
    identifiers:
      order: 100
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      order: 10
      target: !KeyOf binding-signin-login
      policy: !KeyOf policy-remember-intent
    attrs:
      enabled: true
      negate: false
      failure_result: true
      timeout: 5

  # ==========================================================================
  # Seamless integration (agentry#164): every flow ends back in Agentry and
  # the directory never shows its own panels
  # ==========================================================================
  # The return paths are read from the container environment so the same
  # file serves every deployment (DEV-091): AGENTRY_PUBLIC_WEB_URL is where
  # sign-out lands (the site's home, or the server's own /ui/ page when
  # nothing fronts it) and AGENTRY_ACCOUNT_URL is where a password change or
  # an authenticator enrolment returns (the site's Settings → Authentication,
  # or the server's /ui/account/directory). compose defaults both to the
  # server's own pages; a site's overlay points them at itself. `?next=`
  # cannot do this job: authentik only honours a same-host `next`, and the
  # app lives elsewhere.
  #
  # Two mechanisms carry them, and the difference matters (agentry#441):
  #
  # - Sign-out keeps a redirect STAGE. The provider's end-session endpoint
  #   appends its own session-end stage after the flow's, so the flow never
  #   reaches the executor's flow-done path; the redirect stage is what sends
  #   the browser home, and the plan it leaves behind sits in the anonymous
  #   post-logout session, where the next sign-in's flow deletes it.
  # - The stage-configuration flows (password change, authenticator app,
  #   security key) must NOT end on a redirect stage. A redirect stage hands
  #   the browser a redirect challenge that is never answered, so the flow's
  #   plan stays parked in the still-signed-in directory session — and
  #   authentik's end-session endpoint answers an empty 200 to a session that
  #   holds a plan, which blanked sign-out after every authenticator
  #   enrolment. Instead, an expression policy on each flow's first stage
  #   sets the plan context's `redirect`, which the executor honours as an
  #   absolute URL when the flow finishes — and finishing clears the plan.
  - model: authentik_stages_redirect.redirectstage
    id: stage-redirect-site
    identifiers:
      name: agentry-redirect-site
    attrs:
      mode: static
      target_static: !Env AGENTRY_PUBLIC_WEB_URL
      keep_context: false
  - model: authentik_policies_expression.expressionpolicy
    id: policy-return-to-settings
    identifiers:
      name: agentry-return-to-settings
    attrs:
      # AGENTRY_ACCOUNT_URL and the flash are formatted in at apply time, like
      # the rate limit's budget above — into Python source, so the value is
      # the deployment's own (a quote or a backslash in it breaks the policy,
      # and a broken policy skips the stage: the flow turns up empty). The
      # policy always passes: it exists for its side effect on the plan, not
      # to gate the stage it is bound to.
      expression: !Format
        - |
          context["flow_plan"].context["redirect"] = "%s?ok=%s"
          return True
        - !Env AGENTRY_ACCOUNT_URL
        - "Saved%20in%20the%20directory."
  # The redirect stage those flows ended on until agentry#441. Deleting it
  # drops its bindings with it on a deployment that applied the earlier
  # version; a no-op on a fresh install, removable once every deployment
  # has applied this once (like the cleanup entries above).
  - model: authentik_stages_redirect.redirectstage
    state: absent
    identifiers:
      name: agentry-redirect-settings

  # Sign-out: the provider's invalidation flow ends the directory session
  # and sends the browser straight back to the site — no "you've logged
  # out, log back in" page. The bootstrap script points the provider (and
  # the brand below) at it.
  - model: authentik_stages_user_logout.userlogoutstage
    id: stage-logout
    identifiers:
      name: agentry-logout
  - model: authentik_flows.flow
    id: flow-invalidation
    identifiers:
      slug: agentry-invalidation
    attrs:
      name: Agentry sign-out
      title: Signing you out
      designation: invalidation
      authentication: none
      denied_action: message_continue
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-invalidation
      stage: !KeyOf stage-logout
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-invalidation
      stage: !KeyOf stage-redirect-site
      order: 20

  # Password change: the same two password fields and the same strength
  # rule as enrollment and recovery, then straight back to Settings (the
  # return-to-settings policy on the first stage).
  - model: authentik_stages_prompt.promptstage
    id: stage-password-change-prompt
    identifiers:
      name: agentry-password-change-prompt
    attrs:
      fields:
        - !KeyOf field-password
        - !KeyOf field-password-repeat
      validation_policies:
        - !KeyOf password-policy
  - model: authentik_stages_user_write.userwritestage
    id: stage-password-change-write
    identifiers:
      name: agentry-password-change-write
    attrs:
      user_creation_mode: never_create
  - model: authentik_flows.flow
    id: flow-password-change
    identifiers:
      slug: agentry-password-change
    attrs:
      name: Agentry password change
      title: !Format ["Change your %s password", !Env [AGENTRY_BRAND_NAME, "Agentry"]]
      designation: stage_configuration
      authentication: require_authenticated
      denied_action: message_continue
  - model: authentik_flows.flowstagebinding
    id: binding-password-change-prompt
    identifiers:
      target: !KeyOf flow-password-change
      stage: !KeyOf stage-password-change-prompt
      order: 10
  - model: authentik_flows.flowstagebinding
    id: binding-password-change-write
    identifiers:
      target: !KeyOf flow-password-change
      stage: !KeyOf stage-password-change-write
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-return-to-settings
      target: !KeyOf binding-password-change-prompt
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # Authenticator app: the enrollment TOTP stage, bound again as a
  # configuration flow that returns to Settings the same way.
  - model: authentik_flows.flow
    id: flow-totp-setup
    identifiers:
      slug: agentry-totp-setup
    attrs:
      name: Agentry authenticator app
      title: Add an authenticator app
      designation: stage_configuration
      authentication: require_authenticated
      denied_action: message_continue
  - model: authentik_flows.flowstagebinding
    id: binding-totp-setup
    identifiers:
      target: !KeyOf flow-totp-setup
      stage: !KeyOf stage-totp-setup
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-return-to-settings
      target: !KeyOf binding-totp-setup
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # Security key / passkey, likewise.
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    id: stage-webauthn-setup
    identifiers:
      name: agentry-authenticator-webauthn-setup
    attrs:
      friendly_name: !Format ["%s security key", !Env [AGENTRY_BRAND_NAME, "Agentry"]]
  - model: authentik_flows.flow
    id: flow-webauthn-setup
    identifiers:
      slug: agentry-webauthn-setup
    attrs:
      name: Agentry security key
      title: Add a security key or passkey
      designation: stage_configuration
      authentication: require_authenticated
      denied_action: message_continue
  - model: authentik_flows.flowstagebinding
    id: binding-webauthn-setup
    identifiers:
      target: !KeyOf flow-webauthn-setup
      stage: !KeyOf stage-webauthn-setup
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-return-to-settings
      target: !KeyOf binding-webauthn-setup
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # The directory's own user-settings flow is closed to everyone
  # (agentry#490). The provider asserts `email_verified: true` for whatever
  # address the directory holds and the registry links accounts by it
  # (T-12), so a person who could set their own address could sign in as
  # whoever owns it. authentik's shipped `default-user-settings-flow` has an
  # email field, and the only thing refusing a change is its validation
  # policy reading the system setting `default_user_change_email` (false on
  # a fresh 2026.8 install) or a group's `goauthentik.io/user/can-change-email`
  # attribute: one toggle in the admin console reopens it. Blueprints may
  # not write the system settings, and unsetting the brand's settings flow
  # (below) only hides the panel; the flow still runs at
  # /if/flow/default-user-settings-flow/. A flow-level policy that always
  # denies makes the refusal a property of this file. Nothing in Agentry
  # opens that flow: display name and handle are the registry's, and an
  # operator still edits a directory user in the admin console.
  #
  # The flow entry repeats authentik's own attributes, so whichever
  # blueprint applies first creates the same flow; authentik's default
  # blueprint adds its stages, this file only the binding.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-no-user-settings
    identifiers:
      name: agentry-no-user-settings
    attrs:
      expression: |
        ak_message("Account details are changed in your account settings, not here.")
        return False
  - model: authentik_flows.flow
    id: flow-default-user-settings
    identifiers:
      slug: default-user-settings-flow
    attrs:
      name: User settings
      title: Update your info
      designation: stage_configuration
      authentication: require_authenticated
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-no-user-settings
      target: !KeyOf flow-default-user-settings
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # The brand: no user-settings flow (the directory's own settings panel is
  # not offered anywhere), sign-out and recovery go through the flows
  # above. default_application (the last piece: where a flow that ends
  # without a return lands) is set by scripts/dev/authentik-bootstrap.sh,
  # which owns the application object.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      flow_user_settings: null
      flow_invalidation: !KeyOf flow-invalidation
      flow_recovery: !KeyOf flow-recovery

  # ==========================================================================
  # Whether an account has a password (agentry#706)
  # ==========================================================================
  # The site's Settings offers "Add a password" to an account that has none,
  # and authentik's API has no such field. The directory therefore keeps the
  # answer on the account, attributes.agentry_has_password, which the
  # registry reads with the view-user right it already holds. (Reading it
  # through the property-mapping test endpoint was tried and refused: for a
  # token that is not a superuser that endpoint needs the global right to
  # add property mappings, which run code in the directory.)
  #
  # One policy, on every binding that writes a password and on sign-in. When
  # the flow is about to write a password, it adds the attribute to that same
  # write. Otherwise it records the account's real state: an account a
  # social provider created holds the empty string, which Django calls
  # usable, so "has a password" is non-empty and usable. The sign-in half
  # also gives every account that predates this its answer. It always
  # passes: it exists for its side effect. That matters where a binding
  # runs in engine mode `any`, as the sign-in's login step does: a policy
  # meant to skip that step must not be added beside this one without
  # changing the mode. The site's social flows bind it on their own login
  # steps by this name.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-record-has-password
    identifiers:
      name: agentry-record-has-password
    attrs:
      execution_logging: false
      expression: |
        plan = context.get("flow_plan")
        if plan is None:
            return True
        prompt = plan.context.get("prompt_data") or {}
        if prompt.get("password"):
            prompt["attributes.agentry_has_password"] = True
            plan.context["prompt_data"] = prompt
            return True
        user = plan.context.get("pending_user")
        if user is None or not getattr(user, "pk", None):
            return True
        # Read the account again: the copy in the plan was loaded at
        # identification, and saving it would undo any other attribute
        # changed since.
        from authentik.core.models import User
        fresh = User.objects.filter(pk=user.pk).first()
        if fresh is None:
            return True
        has = bool(fresh.password) and fresh.has_usable_password()
        if fresh.attributes.get("agentry_has_password") is not has:
            fresh.attributes["agentry_has_password"] = has
            fresh.save(update_fields=["attributes"])
            user.attributes["agentry_has_password"] = has
        return True
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-record-has-password
      target: !KeyOf binding-enrollment-write
      order: 50
    attrs:
      enabled: true
      negate: false
      failure_result: true
      timeout: 5
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-record-has-password
      target: !KeyOf binding-recovery-write
      order: 50
    attrs:
      enabled: true
      negate: false
      failure_result: true
      timeout: 5
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-record-has-password
      target: !KeyOf binding-password-change-write
      order: 50
    attrs:
      enabled: true
      negate: false
      failure_result: true
      timeout: 5
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-record-has-password
      target: !KeyOf binding-signin-login
      order: 50
    attrs:
      enabled: true
      negate: false
      failure_result: true
      timeout: 5
