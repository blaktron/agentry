# Agentry dev/self-host stack (M0, §2.4 "Dev / small self-host" shape).
# `docker compose -f deploy/compose/docker-compose.yaml up` gives postgres,
# minio (S3-compatible archive store), and mailpit (SMTP catcher).
# agentryd itself runs on the host in dev (`make dev`) or as the `server`
# service below for a full self-host trial.
#
# Credentials. The Postgres and MinIO passwords default to development
# values and are read from .env (AGENTRY_PG_PASSWORD, AGENTRY_MINIO_SECRET)
# everywhere they appear — the services, the DSN agentryd uses, authentik's
# database, the bucket bootstrap — so a self-hoster sets them once without
# editing this tracked file, and rotating after an exposure is a .env edit
# (agentry#30). Changing them on a stack that already has data: postgres
# and minio keep the OLD value in their volumes; run ALTER USER / `mc admin
# user` first, or start from fresh volumes.
#
# Port publishing. Docker inserts its own ACCEPT rules ahead of the host
# firewall (firewalld/ufw zones do not apply to published ports), so a
# `"5432:5432"` line on a host with a public address is Postgres on the
# internet with the dev password below. Every service except the edge is
# therefore published on AGENTRY_BIND (default 127.0.0.1): reachable from
# the host itself — which is where the acceptance scripts and `agentry`
# run — and from nothing else. Set AGENTRY_BIND in .env to a private
# address (a Tailscale IP, say) to reach the direct ports from another
# machine; the edge on 80/443 is the intended public surface and stays on
# AGENTRY_EDGE_BIND (default all interfaces). Behind a Cloudflare Tunnel
# the connector dials the edge over the compose network, so the edge can
# be bound the same way (docs/self-hosting.md, "Cloudflare Tunnel").

# Logs. Every service keeps Docker's json-file driver, rotated (three files
# of 10 MB per container), so a stack without the log stack does not keep
# logs forever; `docker logs` is the reader. The log stack (agentry-logging)
# replaces this block per service with the syslog driver from its own
# overlay — docs/self-hosting.md, "Logs".
x-logging: &rotated
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *rotated
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentry
      POSTGRES_PASSWORD: ${AGENTRY_PG_PASSWORD:-agentry}
      POSTGRES_DB: agentry_dev
    ports:
      - "${AGENTRY_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentry -d agentry_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    logging: *rotated
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agentry
      MINIO_ROOT_PASSWORD: ${AGENTRY_MINIO_SECRET:-agentry-dev-secret}
    ports:
      - "${AGENTRY_BIND:-127.0.0.1}:9000:9000"
      - "${AGENTRY_BIND:-127.0.0.1}:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    logging: *rotated
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${AGENTRY_BIND:-127.0.0.1}:1025:1025"   # SMTP
      - "${AGENTRY_BIND:-127.0.0.1}:8025:8025"   # web UI

  # ── Directory service (DEV-057) ──────────────────────────────────────────
  # Authentik owns accounts, passwords, and MFA; the registry consumes it as
  # an OIDC provider (social provider id `authentik`) and keeps sessions,
  # PATs, and RBAC native. Bootstrap the OAuth2 provider + application with
  # scripts/dev/authentik-bootstrap.sh (idempotent, uses the bootstrap
  # token). The edge serves it as auth.* and on :8443.
  redis:
    logging: *rotated
    profiles: ["server"]
    image: redis:7-alpine
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: authentik wants its own database in the shared postgres.
  authentik-db-init:
    logging: *rotated
    profiles: ["server"]
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${AGENTRY_PG_PASSWORD:-agentry}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - psql -h postgres -U agentry -d agentry_dev -tc "SELECT 1 FROM pg_database WHERE datname='authentik'" | grep -q 1 ||
        psql -h postgres -U agentry -d agentry_dev -c "CREATE DATABASE authentik"

  authentik-server:
    logging: *rotated
    profiles: ["server"]
    # Pinned by tag AND digest (2026.8.0, released 2026-08-18). Bump both
    # together; the digest is what makes the pin a supply-chain fact.
    # Upgrades must pass through every YYYY.M release line in order (the
    # image refuses skips before migrating) — see docs/self-hosting.md,
    # "Upgrading the directory service".
    image: ghcr.io/goauthentik/server:2026.8.0@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5
    restart: unless-stopped
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?generate once (openssl rand -base64 48) and set in .env}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: agentry
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AGENTRY_PG_PASSWORD:-agentry}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      # Where the directory's flows return (agentry#164, DEV-091), read by
      # the account-flows blueprint's redirect stages via !Env: sign-out to
      # AGENTRY_PUBLIC_WEB_URL, password/authenticator changes to
      # AGENTRY_ACCOUNT_URL. Both default to the server's own /ui/ pages; a
      # site in front sets them to its own (its compose overlay does).
      AGENTRY_PUBLIC_WEB_URL: ${AGENTRY_PUBLIC_WEB_URL:-${AGENTRY_PUBLIC_URL:-http://localhost:8080}/ui/}
      AGENTRY_ACCOUNT_URL: ${AGENTRY_ACCOUNT_URL:-${AGENTRY_PUBLIC_URL:-http://localhost:8080}/ui/account/directory}
      # What the flows call this deployment (titles, mail subjects).
      AGENTRY_BRAND_NAME: ${AGENTRY_BRAND_NAME:-Agentry}
      # Per-IP budget for the enrollment/recovery flows (emails sent +
      # accounts created per hour, agentry#53); formatted into the
      # account-flows blueprint's rate-limit policy at apply time.
      AUTHENTIK_ACCOUNT_FLOW_MAX_PER_HOUR: ${AUTHENTIK_ACCOUNT_FLOW_MAX_PER_HOUR:-10}
      # First boot creates akadmin with this password, and an API token
      # (intent api) with this value — what the bootstrap script uses.
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      # Recovery/verification mail lands in the same mailpit as the registry's.
      # Defaults land in mailpit; set the AUTHENTIK_EMAIL_* values in .env
      # for a real provider (Postmark: host smtp.postmarkapp.com, port 587,
      # the server token as both username and password, USE_TLS for
      # STARTTLS).
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL_HOST:-mailpit}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL_PORT:-1025}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL_USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL_PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL_USE_TLS:-false}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL_FROM:-authentik@agentry.localhost}
      # Sign-up CAPTCHA (DEV-063). Defaults are Cloudflare's published
      # Turnstile TEST keys, which always pass — fine for dev, useless as a
      # control. Set real keys in .env for anything with public sign-up.
      AUTHENTIK_CAPTCHA_SITE_KEY: ${AUTHENTIK_CAPTCHA_SITE_KEY:-1x00000000000000000000AA}
      AUTHENTIK_CAPTCHA_SECRET_KEY: ${AUTHENTIK_CAPTCHA_SECRET_KEY:-1x0000000000000000000000000000000AA}
      AUTHENTIK_CAPTCHA_JS_URL: ${AUTHENTIK_CAPTCHA_JS_URL:-https://challenges.cloudflare.com/turnstile/v0/api.js}
      AUTHENTIK_CAPTCHA_API_URL: ${AUTHENTIK_CAPTCHA_API_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      # Declarative configuration, applied on boot and re-applied when the
      # files change (idempotent): the enrollment flow (DEV-062) lives here.
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authentik-db-init:
        condition: service_completed_successfully

  authentik-worker:
    logging: *rotated
    profiles: ["server"]
    # Pinned by tag AND digest (2026.8.0, released 2026-08-18). Bump both
    # together; the digest is what makes the pin a supply-chain fact.
    image: ghcr.io/goauthentik/server:2026.8.0@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      # Declarative configuration, applied on boot and re-applied when the
      # files change (idempotent): the enrollment flow (DEV-062) lives here.
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authentik-db-init:
        condition: service_completed_successfully

  # One-shot: minio starts with no buckets, and the S3 blob store does not
  # create its bucket on demand (write-once semantics assume it exists, as in
  # SaaS where terraform owns it). Idempotent: `mb --ignore-existing`.
  minio-init:
    logging: *rotated
    profiles: ["server"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 agentry "${AGENTRY_MINIO_SECRET:-agentry-dev-secret}" &&
        mc mb --ignore-existing local/agentry-dev

  # Optional: containerized agentryd (self-host trial). Build locally:
  #   docker compose -f deploy/compose/docker-compose.yaml --profile server up
  server:
    logging: *rotated
    profiles: ["server"]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    environment:
      AGENTRY_DATABASE_URL: postgres://agentry:${AGENTRY_PG_PASSWORD:-agentry}@postgres:5432/agentry_dev?sslmode=disable
      AGENTRY_HTTP_ADDR: ":8080"
      # Optional AI Review model (S5, the judge): typesafe (TypeSafe AI's Jev,
      # key required), or any OpenAI- or Anthropic-compatible endpoint. Leave
      # unset and dev falls back to the static heuristic judge; self-host
      # without one routes versions to human review.
      AGENTRY_JUDGE_TYPE: ${AGENTRY_JUDGE_TYPE:-}
      AGENTRY_JUDGE_BASE_URL: ${AGENTRY_JUDGE_BASE_URL:-}
      AGENTRY_JUDGE_API_KEY: ${AGENTRY_JUDGE_API_KEY:-}
      AGENTRY_JUDGE_MODEL: ${AGENTRY_JUDGE_MODEL:-}
      # bedrock needs a region (and AWS credentials on the host/task);
      # classifier needs AGENTRY_JUDGE_BASE_URL = the classify endpoint.
      # typesafe (TypeSafe AI's Jev, hosted only) needs AGENTRY_JUDGE_API_KEY;
      # AGENTRY_JUDGE_MODEL is a pinned version id (default jev-1.13.0, an
      # alias such as jev-latest is refused) and AGENTRY_JUDGE_BASE_URL
      # defaults to https://api.typesafe.ai.
      AGENTRY_JUDGE_REGION: ${AGENTRY_JUDGE_REGION:-}
      # External scanner tools (§8.3, agentry#40). gitleaks ships in the
      AGENTRY_SCAN_GITLEAKS_BIN: ${AGENTRY_SCAN_GITLEAKS_BIN:-/usr/bin/gitleaks}
      # Real SMTP against mailpit: every message the server sends lands in the
      # web UI on :8025 instead of the log, so the notification paths (§8.7)
      # can actually be read end to end in dev. No TLS, no auth — mailpit
      # accepts plaintext on 1025, which is why startTLS is off here and must
      # never be off against a real relay.
      AGENTRY_NOTIFY_KIND: smtp
      # Defaults land in mailpit; set the AGENTRY_SMTP_* values in .env for
      # a real provider.
      AGENTRY_SMTP_HOST: ${AGENTRY_SMTP_HOST:-mailpit}
      AGENTRY_SMTP_PORT: ${AGENTRY_SMTP_PORT:-1025}
      AGENTRY_SMTP_USER: ${AGENTRY_SMTP_USER:-}
      AGENTRY_SMTP_PASS: ${AGENTRY_SMTP_PASS:-}
      AGENTRY_SMTP_STARTTLS: ${AGENTRY_SMTP_STARTTLS:-false}
      AGENTRY_SMTP_FROM: ${AGENTRY_SMTP_FROM:-Agentry <no-reply@agentry.localhost>}
      # Override with AGENTRY_PUBLIC_URL when the box is reached under another
      # name — clone/install/download URLs all render live from this. Set it
      # in deploy/compose/.env (compose reads .env from the compose file's
      # own directory, NOT the cwd) or export it in the shell before `up`.
      AGENTRY_BASE_URL: ${AGENTRY_PUBLIC_URL:-http://localhost:8080}
      # DEV-091: a site fronting this server, how much of the server's own
      # /ui/ surface to serve, what it calls itself, and the directory's
      # end-session flow for sign-out. All optional; empty = the server on
      # its own.
      AGENTRY_WEB_URL: ${AGENTRY_WEB_URL:-}
      AGENTRY_UI_MODE: ${AGENTRY_UI_MODE:-full}
      AGENTRY_BRAND_NAME: ${AGENTRY_BRAND_NAME:-}
      AGENTRY_IDP_LOGOUT_URL: ${AGENTRY_IDP_LOGOUT_URL:-}
      # Behind the `edge` service the server sees exactly one proxy hop:
      # set AGENTRY_TRUSTED_PROXIES=1 in .env when the edge is the entry
      # point, and AGENTRY_COOKIE_SECURE=true once it serves a certificate
      # browsers accept (docs/self-hosting.md "Running behind a proxy").
      AGENTRY_TRUSTED_PROXIES: ${AGENTRY_TRUSTED_PROXIES:-0}
      AGENTRY_AUTH_COOKIE_SECURE: ${AGENTRY_COOKIE_SECURE:-false}
      # The edge SETS X-Request-Id on every request it forwards (its config
      # does, and so must a site's edge config in front of this server);
      # with AGENTRY_PROXY_REQUEST_ID=true beside AGENTRY_TRUSTED_PROXIES=1
      # the server honours it, so one id names a request on both hops
      # (docs/logging.md). Off, the server mints its own.
      AGENTRY_PROXY_REQUEST_ID: ${AGENTRY_PROXY_REQUEST_ID:-false}
      # The log contract's knobs (docs/logging.md): the minimum level, and
      # the audit archive stream — `log` mirrors every audit event as an
      # event=audit.<action> line beside the row, which is what the log
      # stack's agentry-audit index is fed from; `file` and `none` as in
      # docs/self-hosting.md "Audit archive and retention".
      AGENTRY_LOG_LEVEL: ${AGENTRY_LOG_LEVEL:-info}
      AGENTRY_AUDIT_STREAM_KIND: ${AGENTRY_AUDIT_STREAM_KIND:-none}
      # Directory service (DEV-057): hand credentials to Authentik. When
      # AGENTRY_AUTH_EXTERNAL_ONLY=true the native register/password/TOTP
      # endpoints answer 410 and sign-in goes through the authentik provider.
      AGENTRY_AUTH_EXTERNAL_ONLY: ${AGENTRY_AUTH_EXTERNAL_ONLY:-false}
      AGENTRY_SOCIAL_AUTHENTIK_CLIENT_ID: ${AGENTRY_SOCIAL_AUTHENTIK_CLIENT_ID:-}
      AGENTRY_SOCIAL_AUTHENTIK_CLIENT_SECRET: ${AGENTRY_SOCIAL_AUTHENTIK_CLIENT_SECRET:-}
      AGENTRY_SOCIAL_AUTHENTIK_ISSUER: ${AGENTRY_SOCIAL_AUTHENTIK_ISSUER:-}
      # Account erasure reaches into the directory too (agentry#20): the
      # server deletes the sign-in account through authentik's API. The
      # bootstrap token works; a dedicated token with rights over users is
      # better. Empty leaves erasure registry-only (the privacy policy then
      # has to say so).
      AGENTRY_IDP_ADMIN_URL: ${AGENTRY_IDP_ADMIN_URL:-}
      AGENTRY_IDP_ADMIN_TOKEN: ${AGENTRY_IDP_ADMIN_TOKEN:-}
      # Directory group whose members are platform staff (agentry#51); the
      # groups blueprint creates it. Empty disables the sync.
      AGENTRY_IDP_STAFF_GROUP: ${AGENTRY_IDP_STAFF_GROUP:-agentry-platform-staff}
      # Archive store against minio (S3-compatible), exercising the same code
      # path SaaS uses rather than the local-FS one.
      AGENTRY_STORAGE_KIND: s3
      AGENTRY_STORAGE_S3_BUCKET: agentry-dev
      AGENTRY_STORAGE_S3_REGION: us-east-1
      AGENTRY_STORAGE_S3_ENDPOINT: http://minio:9000
      AGENTRY_STORAGE_S3_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: agentry
      AWS_SECRET_ACCESS_KEY: ${AGENTRY_MINIO_SECRET:-agentry-dev-secret}
      # Bare repos live on a named volume at a path the image pre-owns for
      # uid 65532 (see Dockerfile); the default .devdata/git would resolve
      # to an unwritable / in-container.
      AGENTRY_GIT_DATA_DIR: /data/git
      # SSH git transport (§6.1 Q7, agentry#70): listens in-container on
      # 2222; the host key is generated under /data/git on first start.
      # AGENTRY_GIT_SSH_PUBLIC_URL is what agent pages print as the clone
      # URL (e.g. ssh://git@registry.example.test:2222); leave it empty to
      # keep the transport reachable but unadvertised.
      AGENTRY_GIT_SSH_ADDR: ${AGENTRY_GIT_SSH_ADDR:-:2222}
      AGENTRY_GIT_SSH_PUBLIC_URL: ${AGENTRY_GIT_SSH_PUBLIC_URL:-}
      # Release signing (agentry#308). Unset, dev mode signs with a key it
      # mints at every start, and an attestation stops verifying at the
      # next restart. A stable key: AGENTRY_SIGNING_KIND=file, the key at
      # AGENTRY_SIGNING_KEY_FILE inside the container, and the host
      # directory that holds it in AGENTRY_SIGNING_KEY_DIR (mounted
      # read-only at /etc/agentry). Generate it as self-hosting.md says,
      # 0600, and back it up: every attestation it signed verifies only
      # against it.
      AGENTRY_SIGNING_KIND: ${AGENTRY_SIGNING_KIND:-none}
      AGENTRY_SIGNING_KEY_FILE: ${AGENTRY_SIGNING_KEY_FILE:-}
    ports:
      - "${AGENTRY_BIND:-127.0.0.1}:8080:8080"
      - "${AGENTRY_SSH_BIND:-0.0.0.0}:${AGENTRY_SSH_PORT:-2222}:2222"
    volumes:
      - gitdata:/data/git
      # The signing key's directory when one is configured; an unset
      # AGENTRY_SIGNING_KEY_DIR mounts the empty placeholder volume instead,
      # so the same file works with and without a key.
      - ${AGENTRY_SIGNING_KEY_DIR:-signing-placeholder}:/etc/agentry:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # The edge: TLS termination and the one public origin of the server —
  # API, git, the server's own /ui/ pages, the downloads directory — with
  # the directory service on auth.* (DEV-091: the headless stack; a site in
  # front is an overlay from its own repository, which replaces this
  # config with the full-site one). edge/nginx.conf explains why TLS is
  # load-bearing (browsers send no same-origin signal to a plain-http
  # hostname). Certificates come from AGENTRY_EDGE_CERT_DIR as edge.crt +
  # edge.key; on a Tailscale host `tailscale cert` issues a real one,
  # otherwise a self-signed pair bootstraps the stack. Once the edge is the
  # entry point, set AGENTRY_PUBLIC_URL to its https origin.
  edge:
    logging: *rotated
    profiles: ["server"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${AGENTRY_EDGE_BIND:-0.0.0.0}:80:80"
      - "${AGENTRY_EDGE_BIND:-0.0.0.0}:443:443"
      - "${AGENTRY_EDGE_BIND:-0.0.0.0}:8443:8443"   # the directory service, when no auth.* DNS name exists (dev)
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${AGENTRY_EDGE_CERT_DIR:-./edge/certs}:/etc/nginx/certs:ro
      - edgecache:/var/cache/nginx/edge
      # Downloadable binaries a self-hoster publishes for its users (the
      # hosted site's build script lives with the site). A host directory
      # when AGENTRY_DOWNLOADS_DIR names one; otherwise the empty named
      # volume below, so a fresh `up` never scaffolds a root-owned
      # directory into the checkout (agentry#218 removed deploy/compose/downloads).
      - ${AGENTRY_DOWNLOADS_DIR:-downloads}:/srv/downloads:ro
    depends_on:
      - server

  # Cloudflare Tunnel (profile `tunnel`): the outbound-only connector that
  # publishes the edge to the internet without opening a port. Remotely
  # managed — the public hostnames and their origin (https://edge:443, with
  # the origin server name set to the hostname) live in the Zero Trust
  # dashboard; this container only holds the connector token.
  #
  # The token is a credential. It comes from CLOUDFLARE_TUNNEL_TOKEN in the
  # git-ignored .env and reaches cloudflared as the TUNNEL_TOKEN environment
  # variable — never as a command-line argument, so it is not in `ps`, the
  # container's inspect output, or this file. Pinned by tag AND digest.
  cloudflared:
    logging: *rotated
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env (Zero Trust → Networks → Tunnels)}
      TUNNEL_METRICS: 127.0.0.1:2000
    # Nothing to write, nothing to escalate to, no capabilities needed.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      - edge

volumes:
  pgdata:
  miniodata:
  gitdata:
  edgecache:
  redisdata:
  # Mounted at /etc/agentry when no signing key directory is configured.
  signing-placeholder:
  authentik-media:
  authentik-templates:
  downloads:
