# Agentry dev/self-host stack (M0, §2.4 "Dev / small self-host" shape).
# `docker compose -f deploy/compose/docker-compose.yaml up` gives postgres,
# minio (S3-compatible archive store), and mailpit (SMTP catcher).
# agentryd itself runs on the host in dev (`make dev`) or as the `server`
# service below for a full self-host trial.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentry
      POSTGRES_PASSWORD: agentry
      POSTGRES_DB: agentry_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentry -d agentry_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agentry
      MINIO_ROOT_PASSWORD: agentry-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  # One-shot: minio starts with no buckets, and the S3 blob store does not
  # create its bucket on demand (write-once semantics assume it exists, as in
  # SaaS where terraform owns it). Idempotent: `mb --ignore-existing`.
  minio-init:
    profiles: ["server"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 agentry agentry-dev-secret &&
        mc mb --ignore-existing local/agentry-dev

  # Optional: containerized agentryd (self-host trial). Build locally:
  #   docker compose -f deploy/compose/docker-compose.yaml --profile server up
  server:
    profiles: ["server"]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    environment:
      AGENTRY_DATABASE_URL: postgres://agentry:agentry@postgres:5432/agentry_dev?sslmode=disable
      AGENTRY_HTTP_ADDR: ":8080"
      # Real SMTP against mailpit: every message the server sends lands in the
      # web UI on :8025 instead of the log, so the notification paths (§8.7)
      # can actually be read end to end in dev. No TLS, no auth — mailpit
      # accepts plaintext on 1025, which is why startTLS is off here and must
      # never be off against a real relay.
      AGENTRY_NOTIFY_KIND: smtp
      AGENTRY_SMTP_HOST: mailpit
      AGENTRY_SMTP_PORT: "1025"
      AGENTRY_SMTP_STARTTLS: "false"
      AGENTRY_SMTP_FROM: Agentry <no-reply@agentry.localhost>
      # Override with AGENTRY_PUBLIC_URL when the box is reached under another
      # name — clone/install/download URLs all render live from this. Set it
      # in deploy/compose/.env (compose reads .env from the compose file's
      # own directory, NOT the cwd) or export it in the shell before `up`.
      AGENTRY_BASE_URL: ${AGENTRY_PUBLIC_URL:-http://localhost:8080}
      # Archive store against minio (S3-compatible), exercising the same code
      # path SaaS uses rather than the local-FS one.
      AGENTRY_STORAGE_KIND: s3
      AGENTRY_STORAGE_S3_BUCKET: agentry-dev
      AGENTRY_STORAGE_S3_REGION: us-east-1
      AGENTRY_STORAGE_S3_ENDPOINT: http://minio:9000
      AGENTRY_STORAGE_S3_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: agentry
      AWS_SECRET_ACCESS_KEY: agentry-dev-secret
      # Bare repos live on a named volume at a path the image pre-owns for
      # uid 65532 (see Dockerfile); the default .devdata/git would resolve
      # to an unwritable / in-container.
      AGENTRY_GIT_DATA_DIR: /data/git
    ports:
      - "8080:8080"
    volumes:
      - gitdata:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Optional: the Next.js web app (§10).
  web:
    profiles: ["server"]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.web
    environment:
      AGENTRY_API_BASE: http://server:8080
      # The docs and developers sites are separate deployments; the nav/footer
      # link to them by URL. In production these are docs./developers.
      # secureagentry.net; override per-deployment via .env in this directory.
      AGENTRY_SITE_URL: ${AGENTRY_PUBLIC_WEB_URL:-http://localhost:3000}
      AGENTRY_DOCS_URL: ${AGENTRY_DOCS_PUBLIC_URL:-http://localhost:8000}
      AGENTRY_DEVELOPERS_URL: ${AGENTRY_DEVELOPERS_PUBLIC_URL:-http://localhost:8001}
    ports:
      - "3000:3000"
    depends_on:
      - server

  # Separate deployment: the wiki-style documentation site
  # (docs.secureagentry.net). The site machinery lives in the agentry-docs
  # repo; its build clones THIS repo for the docs/ content. While the repos
  # are private, GITHUB_TOKEN (deploy/compose/.env) authenticates both the
  # compose build context fetch and, as a BuildKit secret, the inner clone.
  # For local hacking on the sites, point AGENTRY_DOCS_CONTEXT at a checkout
  # (e.g. ../../../agentry-docs).
  docs:
    profiles: ["server"]
    restart: unless-stopped
    build:
      context: ${AGENTRY_DOCS_CONTEXT:-https://x-access-token:${GITHUB_TOKEN:?set GITHUB_TOKEN in deploy/compose/.env}@github.com/blaktron/agentry-docs.git#main}
      dockerfile: docs-site/Dockerfile
      args:
        SITE_URL: ${AGENTRY_DOCS_PUBLIC_URL:-http://localhost:8000}
        AGENTRY_REF: ${AGENTRY_CONTENT_REF:-main}
      secrets:
        - gh_token
    ports:
      - "8000:80"

  # Separate deployment: the developers / API-reference site
  # (developers.secureagentry.net) — Redoc over this repo's OpenAPI spec,
  # built from the agentry-docs repo the same way.
  developers:
    profiles: ["server"]
    restart: unless-stopped
    build:
      context: ${AGENTRY_DOCS_CONTEXT:-https://x-access-token:${GITHUB_TOKEN:?set GITHUB_TOKEN in deploy/compose/.env}@github.com/blaktron/agentry-docs.git#main}
      dockerfile: developers-site/Dockerfile
      args:
        AGENTRY_REF: ${AGENTRY_CONTENT_REF:-main}
      secrets:
        - gh_token
    ports:
      - "8001:80"

secrets:
  # Read token for the private blaktron repos, consumed by the site builds'
  # inner clone of this repo. Set in deploy/compose/.env.
  gh_token:
    environment: GITHUB_TOKEN

volumes:
  pgdata:
  miniodata:
  gitdata:
