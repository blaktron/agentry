# The Agentry edge: one nginx in front of the compose stack (dev and
# small self-host). Browsers, the CLI, and git talk to this and nothing
# else. It terminates TLS, splits one public origin into the web tier and
# the server (api + git — the same split deploy/helm's ingress makes), and
# caches the immutable static assets, which is the CDN half of its job.
#
# TLS here is load-bearing, not a nicety. Browsers send Fetch Metadata
# (Sec-Fetch-Site) only to potentially-trustworthy origins — https://, or
# localhost — and under this app's `Referrer-Policy: no-referrer` they
# serialize the Origin of a form post as the string `null` (Fetch, "append
# a request `Origin` header"). Over plain http on any real hostname the
# browser therefore gives web/lib/forms.ts sameOrigin() nothing at all to
# check and every form post is refused. Verified in Chrome 2026-08-31
# against http://agentry:3000: `Origin: null`, no Sec-Fetch-* headers.
# Behind this edge on 443 both headers arrive and the guard works.
#
# Upstreams are held in variables so nginx resolves them through docker's
# embedded DNS at request time: the edge starts before its backends and
# follows a recreated container's new address without a reload.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log   /var/log/nginx/access.log;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  resolver 127.0.0.11 valid=30s ipv6=off;

  # The client's address. Behind a Cloudflare Tunnel the TCP peer is the
  # cloudflared container and the visitor is in CF-Connecting-IP, which
  # Cloudflare sets and cloudflared forwards. The realip module swaps
  # $remote_addr for that header ONLY when the peer is inside docker's
  # default address pools — i.e. a container of this stack — so a request
  # that reaches the edge from the internet directly keeps its real peer
  # and any CF-Connecting-IP it carries is ignored (it cannot pick its own
  # rate-limit bucket). Without this every visitor through the tunnel
  # resolved to cloudflared's address: one shared per-IP budget for the
  # whole internet, and the tunnel in every audit row (agentry#14).
  set_real_ip_from 172.16.0.0/12;
  real_ip_header   CF-Connecting-IP;
  real_ip_recursive off;

  # Forwarded headers. The web tier keys its same-origin check and its
  # redirect origin off X-Forwarded-Host / X-Forwarded-Proto ($http_host
  # keeps a non-default port, which Origin also carries). X-Forwarded-For
  # is REPLACED with the address resolved above, never appended to: this
  # edge is the one hop agentryd trusts (AGENTRY_TRUSTED_PROXIES=1), and a
  # single entry it wrote is the only shape that is both correct through
  # the tunnel and unforgeable from a direct connection. A location that
  # sets its own proxy_set_header would drop all of these, so none does.
  proxy_http_version 1.1;
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header Connection        "";
  proxy_connect_timeout 5s;
  proxy_read_timeout    120s;

  # Per-visitor request limits on the routes that do work for strangers
  # (agentry#18). $binary_remote_addr is the address resolved above, so a
  # visitor through the tunnel gets their own bucket. agentryd keeps its
  # own §19 limits behind these; this layer exists for the web tier, which
  # has none, and for the unauthenticated Builder packer in particular.
  # 429 with Retry-After; burst absorbs a page's worth of clicks.
  limit_req_zone $binary_remote_addr zone=edge_forms:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=edge_auth:10m  rate=30r/m;
  limit_req_zone $binary_remote_addr zone=edge_git:10m   rate=120r/m;
  # Per-IP concurrency on git (§6.2 at the edge, agentry#55): a client may
  # hold at most this many simultaneous smart-HTTP requests. Pushes are
  # long, so the cap is generous; it stops one address from monopolising
  # agentryd's per-repo/global semaphores, not normal use.
  limit_conn_zone $binary_remote_addr zone=edge_git_conn:10m;
  limit_conn_status 429;
  limit_req_status 429;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  # Cache zone. Next's /_next/static/* files are content-hashed and served
  # immutable, so holding them here is safe for as long as we like; the
  # docs sites are static builds and get a short TTL. HTML from the web
  # tier is server-rendered per session and is never cached.
  proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:16m max_size=2g inactive=30d use_temp_path=off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Plain http exists only to redirect, plus an unencrypted health probe
  # for load balancers that want one.
  server {
    listen 80 default_server;
    server_name _;
    set $api http://server:8080;
    location = /healthz { proxy_pass $api; }
    location / { return 301 https://$host$request_uri; }
  }

  # The registry origin: web app + api + git on one host (§9 same-origin).
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;

    set $api http://server:8080;
    set $web http://web:3000;

    # API, SCIM, well-known, health → agentryd. Uploads are streamed
    # through (agentryd enforces its own 12 MiB cap on cli-upload
    # archives); responses are not buffered so pipeline progress polling
    # and any future SSE stream reach the client as they are written.
    location ^~ /api/v1/auth/ {
      limit_req zone=edge_auth burst=30 nodelay;
      client_max_body_size 16m;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass $api;
    }
    # README image proxy (agentry#64): immutable per signed URL, so the
    # edge keeps it for a day and one upstream fetch serves every viewer.
    location ^~ /api/v1/img/ {
      proxy_cache edge;
      proxy_cache_valid 200 1d;
      proxy_cache_valid 404 415 502 5m;
      proxy_cache_lock on;
      proxy_ignore_headers Set-Cookie;
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass $api;
    }
    location /api/ {
      client_max_body_size 16m;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass $api;
    }
    location /scim/        { proxy_pass $api; }
    # The server's own browser surface (DEV-091): the device authorize page
    # the CLI and the desktop app open, and — when no site fronts the
    # server — sign-in, the account and the operator pages.
    location ^~ /ui/       { proxy_pass $api; }
    location /.well-known/ { proxy_pass $api; }
    location = /healthz    { proxy_pass $api; }

    # Git smart HTTP: /<ns>/<name>.git/… → agentryd's git role. A push is a
    # chunked, possibly large, possibly slow request body: no size cap, no
    # request buffering, a long read timeout, and no gzip on the wire.
    location ~ ^/[^/]+/[^/]+\.git(/|$) {
      limit_req zone=edge_git burst=60 nodelay;
      limit_conn edge_git_conn 8;
      client_max_body_size 0;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 600s;
      gzip off;
      proxy_pass $api;
    }

    # Immutable static assets: the CDN part. Cache-Control from Next is
    # passed through unchanged (public, max-age=1y, immutable).
    location /_next/static/ {
      proxy_cache edge;
      proxy_cache_valid 200 30d;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      proxy_ignore_headers Set-Cookie;
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass $web;
    }

    # Binaries the /download page links to: a host directory, served as
    # files. No listing; the page is the index, and manifest.json is what it
    # renders from. Short cache so a re-publish shows within minutes.
    location /downloads/ {
      alias /srv/downloads/;
      autoindex off;
      default_type application/octet-stream;
      add_header Cache-Control "public, max-age=300";
      add_header X-Content-Type-Options nosniff;
    }

    # Everything else is the server-rendered web app, uncached.
    # The Builder's exits and the account forms: a handful per minute per
    # visitor is generous for a person and ends a loop.
    location ^~ /build/download { limit_req zone=edge_forms burst=10 nodelay; proxy_pass $web; }
    location ^~ /build/submit   { limit_req zone=edge_forms burst=10 nodelay; proxy_pass $web; }
    location ^~ /login          { limit_req zone=edge_auth  burst=30 nodelay; proxy_pass $web; }
    location ^~ /signup         { limit_req zone=edge_auth  burst=30 nodelay; proxy_pass $web; }
    location / { proxy_pass $web; }
  }

  # The site behind the directory's hostname: auth.<site> → <site>
  # (agentry#164 sends people back there).
  map $host $agentry_web_host {
    ~^auth\.(?<site>.+)$ $site;
    default              $host;
  }

  # The directory service (DEV-057): Authentik, reached as auth.* when DNS
  # provides the name (prod) and on dedicated port 8443 when it does not
  # (dev — the only server on that port answers every host). Its UI uses a
  # websocket, so this location restates the full forwarded-header set: a
  # location-level proxy_set_header discards every inherited one.
  server {
    listen 443 ssl;
    listen 8443 ssl;
    http2 on;
    server_name auth.*;
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    set $authentik http://authentik-server:9000;
    # Nobody browses the directory itself (agentry#164): its root and its
    # user panel (settings included) go back to the site. Flows (/if/flow),
    # the OIDC endpoints (/application/o), the API and the admin console
    # stay reachable.
    location = / { return 302 https://$agentry_web_host/; }
    location ^~ /if/user { return 302 https://$agentry_web_host/settings; }
    location / {
      client_max_body_size 32m;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $http_connection;
      proxy_pass $authentik;
    }
  }

  # The docs and developers sites keep their own hostnames (docs.* and
  # developers.*, as in production). They are static builds: cached briefly
  # so a rebuild shows up within minutes.
  server {
    listen 443 ssl;
    http2 on;
    server_name docs.*;
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    set $docs http://docs:80;
    location / {
      proxy_cache edge;
      proxy_cache_valid 200 10m;
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass $docs;
    }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name developers.*;
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    set $developers http://developers:80;
    location / {
      proxy_cache edge;
      proxy_cache_valid 200 10m;
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass $developers;
    }
  }
}
