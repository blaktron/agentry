# The edge: one nginx in front of the compose stack (dev and small
# self-host). Browsers, the CLI and git talk to this and nothing else. It
# terminates TLS and is the one public origin of the server — the API, git,
# the server's own /ui/ pages and the downloads directory — with the
# directory service on auth.*. This is the headless stack (DEV-091): a site
# in front is an overlay from its own repository, which mounts its own
# full-site config in place of this file (web routes, static-asset cache,
# docs hosts).
#
# TLS here is load-bearing, not a nicety. Browsers send Fetch Metadata
# (Sec-Fetch-Site) only to potentially-trustworthy origins — https://, or
# localhost — and under `Referrer-Policy: no-referrer` they serialize the
# Origin of a form post as the string `null`. Over plain http on any real
# hostname the browser therefore gives a same-origin check nothing at all
# and every form post is refused (verified in Chrome 2026-08-31). Behind
# this edge on 443 both headers arrive and the /ui/ forms' guard works.
#
# Upstreams are held in variables so nginx resolves them through docker's
# embedded DNS at request time: the edge starts before its backends and
# follows a recreated container's new address without a reload.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log   /var/log/nginx/access.log;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  resolver 127.0.0.11 valid=30s ipv6=off;

  # The client's address. Behind a Cloudflare Tunnel the TCP peer is the
  # cloudflared container and the visitor is in CF-Connecting-IP, which
  # Cloudflare sets and cloudflared forwards. The realip module swaps
  # $remote_addr for that header ONLY when the peer is inside docker's
  # default address pools — i.e. a container of this stack — so a request
  # that reaches the edge from the internet directly keeps its real peer
  # and any CF-Connecting-IP it carries is ignored (agentry#14).
  set_real_ip_from 172.16.0.0/12;
  real_ip_header   CF-Connecting-IP;
  real_ip_recursive off;

  # Forwarded headers. X-Forwarded-For is REPLACED with the address
  # resolved above, never appended to: this edge is the one hop agentryd
  # trusts (AGENTRY_TRUSTED_PROXIES=1), and a single entry it wrote is the
  # only shape that is both correct through the tunnel and unforgeable
  # from a direct connection. A location that sets its own
  # proxy_set_header would drop all of these, so none does.
  proxy_http_version 1.1;
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header Connection        "";
  proxy_connect_timeout 5s;
  proxy_read_timeout    120s;

  # Per-visitor request limits on the routes that do work for strangers
  # (agentry#18): sign-in and the /ui/ forms. agentryd keeps its own §19
  # limits behind these. 429 with Retry-After; burst absorbs a page's
  # worth of clicks.
  limit_req_zone $binary_remote_addr zone=edge_forms:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=edge_auth:10m  rate=30r/m;
  limit_req_zone $binary_remote_addr zone=edge_git:10m   rate=120r/m;
  # Per-IP concurrency on git (§6.2 at the edge, agentry#55).
  limit_conn_zone $binary_remote_addr zone=edge_git_conn:10m;
  limit_conn_status 429;
  limit_req_status 429;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  # Cache zone: the README image proxy's signed URLs are immutable, so the
  # edge keeps them for a day.
  proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:16m max_size=2g inactive=30d use_temp_path=off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Plain http exists only to redirect, plus an unencrypted health probe
  # for load balancers that want one.
  server {
    listen 80 default_server;
    server_name _;
    set $api http://server:8080;
    location = /healthz { proxy_pass $api; }
    location / { return 301 https://$host$request_uri; }
  }

  # The registry origin: api + git + /ui/ on one host (§9 same-origin).
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;

    set $api http://server:8080;

    # Sign-in and registration are rate-limited per visitor; uploads are
    # streamed through (agentryd enforces its own 12 MiB cap on cli-upload
    # archives); responses are not buffered so pipeline progress polling
    # and any future SSE stream reach the client as they are written.
    location ^~ /api/v1/auth/ {
      limit_req zone=edge_auth burst=30 nodelay;
      client_max_body_size 16m;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass $api;
    }
    # README image proxy (agentry#64): immutable per signed URL, so the
    # edge keeps it for a day and one upstream fetch serves every viewer.
    location ^~ /api/v1/img/ {
      proxy_cache edge;
      proxy_cache_valid 200 1d;
      proxy_cache_valid 404 415 502 5m;
      proxy_cache_lock on;
      proxy_ignore_headers Set-Cookie;
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass $api;
    }
    location /api/ {
      client_max_body_size 16m;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass $api;
    }

    # Git smart HTTP: /<ns>/<name>.git/… → agentryd's git role. A push is a
    # chunked, possibly large, possibly slow request body: no size cap, no
    # request buffering, a long read timeout, and no gzip on the wire.
    location ~ ^/[^/]+/[^/]+\.git(/|$) {
      limit_req zone=edge_git burst=60 nodelay;
      limit_conn edge_git_conn 8;
      client_max_body_size 0;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 600s;
      gzip off;
      proxy_pass $api;
    }

    # Binaries a self-hoster may publish for its users: a host directory,
    # served as files. No listing; manifest.json is the index.
    location /downloads/ {
      alias /srv/downloads/;
      autoindex off;
      default_type application/octet-stream;
      add_header Cache-Control "public, max-age=300";
      add_header X-Content-Type-Options nosniff;
    }

    # The server's own browser surface (DEV-091): sign-in and the forms get
    # the same per-visitor budget as the API's auth routes.
    location ^~ /ui/login { limit_req zone=edge_auth  burst=30 nodelay; proxy_pass $api; }
    location = /          { return 302 /ui/; }
    # Everything else — /ui/, /sso/, /scim/, /.well-known/, /healthz, /readyz —
    # is the server's, uncached.
    location / { proxy_pass $api; }
  }

  # The registry behind the directory's hostname: auth.<host> → <host>.
  map $host $agentry_site_host {
    ~^auth\.(?<site>.+)$ $site;
    default              $host;
  }

  # The directory service (DEV-057): Authentik, reached as auth.* when DNS
  # provides the name (prod) and on dedicated port 8443 when it does not
  # (dev — the only server on that port answers every host). Its UI uses a
  # websocket, so this location restates the full forwarded-header set: a
  # location-level proxy_set_header discards every inherited one.
  server {
    listen 443 ssl;
    listen 8443 ssl;
    http2 on;
    server_name auth.*;
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    set $authentik http://authentik-server:9000;
    # Nobody browses the directory itself (agentry#164): its root and its
    # user panel (settings included) go back to the registry's own pages.
    # Flows (/if/flow), the OIDC endpoints (/application/o), the API and
    # the admin console stay reachable.
    location = / { return 302 https://$agentry_site_host/ui/; }
    location ^~ /if/user { return 302 https://$agentry_site_host/ui/account/directory; }
    location / {
      client_max_body_size 32m;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $http_connection;
      proxy_pass $authentik;
    }
  }
}
