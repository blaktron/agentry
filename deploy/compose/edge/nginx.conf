# The Agentry edge: one nginx in front of the compose stack (dev and
# small self-host). Browsers, the CLI, and git talk to this and nothing
# else. It terminates TLS, splits one public origin into the web tier and
# the server (api + git — the same split deploy/helm's ingress makes), and
# caches the immutable static assets, which is the CDN half of its job.
#
# TLS here is load-bearing, not a nicety. Browsers send Fetch Metadata
# (Sec-Fetch-Site) only to potentially-trustworthy origins — https://, or
# localhost — and under this app's `Referrer-Policy: no-referrer` they
# serialize the Origin of a form post as the string `null` (Fetch, "append
# a request `Origin` header"). Over plain http on any real hostname the
# browser therefore gives web/lib/forms.ts sameOrigin() nothing at all to
# check and every form post is refused. Verified in Chrome 2026-08-31
# against http://agentry:3000: `Origin: null`, no Sec-Fetch-* headers.
# Behind this edge on 443 both headers arrive and the guard works.
#
# Upstreams are held in variables so nginx resolves them through docker's
# embedded DNS at request time: the edge starts before its backends and
# follows a recreated container's new address without a reload.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log   /var/log/nginx/access.log;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Forwarded headers. The web tier keys its same-origin check and its
  # redirect origin off X-Forwarded-Host / X-Forwarded-Proto ($http_host
  # keeps a non-default port, which Origin also carries); agentryd trusts
  # exactly AGENTRY_TRUSTED_PROXIES hops of X-Forwarded-For — 1 when this
  # edge is the entry point. A location that sets its own proxy_set_header
  # would drop all of these, so none does.
  proxy_http_version 1.1;
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header Connection        "";
  proxy_connect_timeout 5s;
  proxy_read_timeout    120s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  # Cache zone. Next's /_next/static/* files are content-hashed and served
  # immutable, so holding them here is safe for as long as we like; the
  # docs sites are static builds and get a short TTL. HTML from the web
  # tier is server-rendered per session and is never cached.
  proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:16m max_size=2g inactive=30d use_temp_path=off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Plain http exists only to redirect, plus an unencrypted health probe
  # for load balancers that want one.
  server {
    listen 80 default_server;
    server_name _;
    set $api http://server:8080;
    location = /healthz { proxy_pass $api; }
    location / { return 301 https://$host$request_uri; }
  }

  # The registry origin: web app + api + git on one host (§9 same-origin).
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;

    set $api http://server:8080;
    set $web http://web:3000;

    # API, SCIM, well-known, health → agentryd. Uploads are streamed
    # through (agentryd enforces its own 12 MiB cap on cli-upload
    # archives); responses are not buffered so pipeline progress polling
    # and any future SSE stream reach the client as they are written.
    location /api/ {
      client_max_body_size 16m;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass $api;
    }
    location /scim/        { proxy_pass $api; }
    location /.well-known/ { proxy_pass $api; }
    location = /healthz    { proxy_pass $api; }

    # Git smart HTTP: /<ns>/<name>.git/… → agentryd's git role. A push is a
    # chunked, possibly large, possibly slow request body: no size cap, no
    # request buffering, a long read timeout, and no gzip on the wire.
    location ~ ^/[^/]+/[^/]+\.git(/|$) {
      client_max_body_size 0;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 600s;
      gzip off;
      proxy_pass $api;
    }

    # Immutable static assets: the CDN part. Cache-Control from Next is
    # passed through unchanged (public, max-age=1y, immutable).
    location /_next/static/ {
      proxy_cache edge;
      proxy_cache_valid 200 30d;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      proxy_ignore_headers Set-Cookie;
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass $web;
    }

    # Binaries the /download page links to: a host directory, served as
    # files. No listing; the page is the index, and manifest.json is what it
    # renders from. Short cache so a re-publish shows within minutes.
    location /downloads/ {
      alias /srv/downloads/;
      autoindex off;
      default_type application/octet-stream;
      add_header Cache-Control "public, max-age=300";
      add_header X-Content-Type-Options nosniff;
    }

    # Everything else is the server-rendered web app, uncached.
    location / { proxy_pass $web; }
  }

  # The directory service (DEV-057): Authentik, reached as auth.* when DNS
  # provides the name (prod) and on dedicated port 8443 when it does not
  # (dev — the only server on that port answers every host). Its UI uses a
  # websocket, so this location restates the full forwarded-header set: a
  # location-level proxy_set_header discards every inherited one.
  server {
    listen 443 ssl;
    listen 8443 ssl;
    http2 on;
    server_name auth.*;
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    set $authentik http://authentik-server:9000;
    location / {
      client_max_body_size 32m;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $http_connection;
      proxy_pass $authentik;
    }
  }

  # The docs and developers sites keep their own hostnames (docs.* and
  # developers.*, as in production). They are static builds: cached briefly
  # so a rebuild shows up within minutes.
  server {
    listen 443 ssl;
    http2 on;
    server_name docs.*;
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    set $docs http://docs:80;
    location / {
      proxy_cache edge;
      proxy_cache_valid 200 10m;
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass $docs;
    }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name developers.*;
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    set $developers http://developers:80;
    location / {
      proxy_cache edge;
      proxy_cache_valid 200 10m;
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass $developers;
    }
  }
}
