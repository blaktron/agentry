apiVersion: v2
name: agentry
description: |
  Agentry self-host HA: the same agentryd binary split into api,
  git (shared RWX volume), and worker roles — the headless registry with its
  own /ui/ pages. Postgres and object storage are operator-supplied
  (see values.yaml); a site in front is a separate chart.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - agentry
  - agent-registry
  - security
home: https://agentry.example
sources:
  - https://github.com/blaktron/agentry
maintainers:
  - name: agentry
