# Agentry self-host HA values (PLAN §2.4 "Self-host HA").
#
# OPERATOR-SUPPLIED DEPENDENCIES (NOT bundled by this chart, by design — D-03/
# §14.1 feature parity but services stay external):
#   * PostgreSQL 16 — set secret.databaseUrl (or existingSecret key
#     AGENTRY_DATABASE_URL). agentryd runs migrations on start when
#     config.migrateOnStart=true.
#   * Object storage — S3 or any S3-compatible store (MinIO, Ceph). Set
#     config.storage.s3Bucket / s3Region and provide credentials via
#     serviceAccount IRSA (recommended on EKS) or extraEnv (AWS_ACCESS_KEY_ID,
#     AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3 for non-AWS stores).
#   * Redis (optional, D-06) — nothing the chart runs requires it, and
#     nothing in the core reads secret.redisUrl today: setting it only
#     reports features.redis on GET /api/v1/meta. The state a replica set
#     must share — sessions, the queue, and the SAML replay and request
#     sets — is in Postgres, so every api replica shares it as it is
#     (agentry#414). What stays per process is the rate-limit buckets, so N
#     replicas allow N times the budget behind the edge's own.

nameOverride: ""
fullnameOverride: ""

image:
  agentryd:
    repository: ghcr.io/blaktron/agentry/agentryd
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  pullSecrets: []

# Rendered into a ConfigMap as agentry.yaml and mounted at /etc/agentry.
config:
  env: prod
  devMode: false
  logLevel: info
  baseURL: https://agentry.example
  migrateOnStart: true
  http:
    addr: ":8080"
    # Reverse-proxy hops in front of agentryd, for per-IP rate limits and
    # audit records. 0 = ignore X-Forwarded-For entirely (the safe default:
    # the header is client-supplied). Behind an nginx ingress set 1; behind
    # CDN → ingress set 2. Setting this HIGHER than the real hop count lets
    # callers pick their own rate-limit bucket, so it must match exactly.
    trustedProxies: 0
    # true only when the hop in front SETS X-Request-Id on every request
    # (an nginx ingress with `proxy_set_header X-Request-Id $request_id`
    # does; an ALB does not): the server then honours it and one id names a
    # request on both hops (docs/logging.md). A hop that merely forwards the
    # header would let a client choose its id, so this is never inferred
    # from the hop count.
    proxyRequestID: false
  auth:
    cookieSecure: true
    sessionTTL: 24h
    patMaxTTL: 8760h
    # Directory service (DEV-057, agentry#51). externalOnly hands passwords,
    # MFA, recovery and sign-up to the IdP configured under social.authentik;
    # idpAdminURL (+ secret.idpAdminToken) lets account erasure reach it;
    # idpStaffGroup names the directory group whose members are platform
    # staff (granted and revoked at sign-in from the `groups` claim).
    externalOnly: false
    idpAdminURL: ""
    idpStaffGroup: ""
  social:
    # The deployment's own directory as an OIDC provider. clientSecret is a
    # secret: secret.authentikClientSecret / existingSecret key
    # AGENTRY_SOCIAL_AUTHENTIK_CLIENT_SECRET.
    authentik:
      clientId: ""
      issuer: "" # https://auth.example.com/application/o/agentry/
  idp:
    # Where sign-out sends the browser (the server's own /ui/ sign-out, and a
    # site's; DEV-082, DEV-091): the provider's end-session endpoint behind
    # authentik's cancel view, which drops a parked flow plan first
    # (agentry#441).
    logoutUrl: "" # https://auth.example.com/flows/-/cancel/?next=/application/o/agentry/end-session/
  # DEV-091: a site fronting this server (its origin; empty = the server's
  # own /ui/ pages), how much of /ui/ to serve (full | authorize | off), and
  # what the server calls itself.
  web:
    url: ""
  ui:
    mode: full
  brand:
    name: ""
  storage:
    kind: s3 # s3 | local
    s3Bucket: ""
    s3Region: ""
    s3Prefix: "" # optional key prefix, letting one bucket host several envs
    s3Endpoint: "" # set for MinIO/Ceph; empty uses AWS
    s3UsePathStyle: false # MinIO needs true; AWS does not
  git:
    dataDir: /data/git
    # The SSH git transport (DEV-087): the address the git role listens on,
    # e.g. ":2222"; empty (the default) leaves it off. The host key is
    # generated under dataDir on first start, so replicas sharing the RWX
    # volume share one host key. When set, the git Service exposes it as
    # port 22 and sshPublicUrl is what clone URLs advertise.
    sshAddr: ""
    sshPublicUrl: "" # e.g. ssh://git@git.agentry.example:22
  signing:
    kind: kms # kms | file (prod must not be none)
    kmsKeyARN: ""
    kmsRegion: "" # empty uses the pod's ambient region
    # kind=file: the PEM key's path in the pod; signingKey.existingSecret
    # below is mounted at its directory, which must not be under /etc/agentry
    # (the read-only config mount: a mount nested in it cannot be created).
    keyFile: /etc/agentry-signing/signing-key.pem
    # §8.8 rotation is done with OVERLAPPING validity windows, so the key
    # discovery document must be able to list more than one key. notBefore/
    # notAfter (RFC3339) bound the ACTIVE key; additionalKeys publishes
    # verification-only keys alongside it — the outgoing key stays listed,
    # with a notAfter, until every attestation it signed has aged out.
    notBefore: ""
    notAfter: ""
    additionalKeys: []
    # - keyId: "previous-key-id"
    #   publicKeyPem: |
    #     -----BEGIN PUBLIC KEY-----
    #     ...
    #     -----END PUBLIC KEY-----
    #   notAfter: "2026-12-31T00:00:00Z"
  judge:
    provider: bedrock # bedrock | anthropic | openai | typesafe | classifier | none (typesafe: apiKey required, model a pinned id such as jev-1.13.0)
    model: ""
    region: ""
  telemetry:
    # OTLP/HTTP endpoint (an OTel collector or ADOT sidecar). Empty disables
    # OTLP export; /metrics stays served either way, so a cluster with a
    # Prometheus scrape needs nothing here.
    otlpEndpoint: ""
  notify:
    # log | smtp. log records what WOULD have been sent — a fresh install
    # never silently fails to deliver.
    kind: log
  smtp:
    # Point at SES's SMTP endpoint on AWS, or any relay. The password is a
    # secret: set it via secret.smtpPassword / existingSecret, never here.
    host: ""
    port: 587
    from: "" # e.g. "Agentry <no-reply@agentry.example>"
    startTLS: true
    username: ""
  # §19 quotas. Omit to take the shipped defaults; anything set here is what
  # the entitlements resolver hands out (§14.2).
  limits: {}
  # authedPerHour: 5000
  # webhookDeliveriesPerSecond: 5
  # gitPushesPerHour: 60
  # sshKeyOffersPerMin: 60
  # agentsPerOrgNamespace: 500

# The attestation signing key for config.signing.kind=file: the Secret and
# the key in it holding the PEM, projected read-only to config.signing.keyFile
# (0400, readable through podSecurityContext.fsGroup). Every role mounts it,
# because the server constructs the signer at start in every role that has a
# database (agentry#479 is the seam that will let the api and git roles start
# without the private key).
signingKey:
  existingSecret: ""
  key: signing-key.pem

# Object-store credentials for config.storage.kind=s3 on a cluster without
# workload identity: a Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY,
# injected into the api and worker pods only — the git role never touches the
# store. Prefer this over extraEnv, which reaches every role.
objectStoreCredentials:
  existingSecret: ""

# The database's CA, for a DSN that verifies the server: the Secret and the
# key in it, projected read-only to /etc/agentry-db-ca/ca.crt in every role;
# then AGENTRY_DATABASE_URL can carry
# sslmode=verify-full&sslrootcert=/etc/agentry-db-ca/ca.crt.
databaseCA:
  existingSecret: ""
  key: ca.crt

# Sensitive values. In production prefer existingSecret (e.g. managed by
# external-secrets / sealed-secrets) over inlining here.
secret:
  create: true
  existingSecret: "" # if set, must provide keys: AGENTRY_DATABASE_URL, AGENTRY_AUTH_SEALING_KEY, and optionally AGENTRY_REDIS_URL / AGENTRY_SMTP_PASS / AGENTRY_SOCIAL_AUTHENTIK_CLIENT_SECRET / AGENTRY_IDP_ADMIN_TOKEN
  authentikClientSecret: "" # OIDC client secret for config.social.authentik
  idpAdminToken: "" # directory API token for account erasure (config.auth.idpAdminURL)
  databaseUrl: "" # postgres://user:pass@host:5432/agentry?sslmode=require
  redisUrl: "" # rediss://:pass@host:6379/0 (optional)
  sealingKey: "" # base64 32 bytes; required outside dev (§ config Validate)
  smtpPassword: "" # required when config.notify.kind=smtp and smtp.username is set

serviceAccount:
  create: true
  name: ""
  # On EKS, annotate with an IRSA role granting S3 + KMS (Sign for worker) access:
  # eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/agentry
  annotations: {}

# Extra env applied to all agentryd pods. For object-store credentials use
# objectStoreCredentials.existingSecret instead, which reaches the api and
# worker only; api.extraEnv, git.extraEnv and worker.extraEnv are per role.
extraEnv: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# --- Roles -----------------------------------------------------------------

api:
  replicaCount: 2
  port: 8080
  extraEnv: []
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 60
  nodeSelector: {}
  tolerations: []
  affinity: {}

git:
  replicaCount: 2
  port: 8080
  extraEnv: []
  # The rollout strategy. A ReadWriteOnce volume (no RWX class available) needs
  # replicaCount 1 and {type: Recreate}; the default RollingUpdate suits RWX.
  updateStrategy: {}
  # Shared RWX volume for the bare repos (§2.4 "git ×N (shared RWX volume)",
  # D-19). Requires a ReadWriteMany StorageClass (EFS CSI, Filestore, NFS, ...).
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: ["ReadWriteMany"]
    size: 20Gi
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicaCount: 2
  # Empty = run all queues in one deployment (self-host default). To mirror the
  # SaaS split (§13.3) set queues per an additional worker deployment.
  queues: ""
  extraEnv: []
  # An egress proxy for the worker's outbound calls (the object store, the
  # judge, webhooks): HTTPS_PROXY/HTTP_PROXY and NO_PROXY on the worker pods
  # only, rendered when httpsProxy is set. Pair with networkPolicy so the
  # proxy is the only way out. noProxy keeps in-cluster names direct; add
  # the pod and service CIDRs and the database's address if they must not
  # go through the proxy.
  proxy:
    httpsProxy: ""
    noProxy: "localhost,127.0.0.1,.svc,.cluster.local"
  # Default-deny egress for the worker pods, with the allows named here
  # (§13.3's no-egress worker, restated for Kubernetes). dns lets the pods
  # resolve through kube-system; namespace lets them reach Services in this
  # namespace (an egress proxy); egress is a list of {cidr, ports: [{port,
  # protocol}]} for the database and anything else reached by address.
  networkPolicy:
    enabled: false
    dns: true
    namespace: true
    egress: []
    # - cidr: 10.40.0.0/20
    #   ports: [{ port: 16751, protocol: TCP }]
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  # Workers touch untrusted content (§8.2). Keep the root FS read-only; the git
  # RWX volume is mounted read-only for gc coordination when mountGitData=true.
  mountGitData: true
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Ingress ---------------------------------------------------------------

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    registry: agentry.example   # the API and the server's /ui/ pages
    git: git.agentry.example
  tls: []
  # - secretName: agentry-tls
  #   hosts: [agentry.example, git.agentry.example]
