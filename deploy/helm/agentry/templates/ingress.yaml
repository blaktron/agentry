{{- if .Values.ingress.enabled }}
{{- $fullName := include "agentry.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "agentry.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # The registry host: the API, the server's own /ui/ pages, SCIM and
    # well-known all live on the api role (DEV-091: headless chart; a site
    # in front adds its own ingress rule ahead of this one).
    - host: {{ .Values.ingress.hosts.registry | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-api
                port:
                  number: 80
    - host: {{ .Values.ingress.hosts.git | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-git
                port:
                  number: 80
{{- end }}
