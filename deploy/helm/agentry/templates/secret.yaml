{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentry.secretName" . }}
  labels:
    {{- include "agentry.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Set these at install (or use secret.existingSecret / external-secrets).
  # Empty values render but agentryd's config.Validate rejects an empty sealing
  # key outside dev, so a broken install fails fast at boot rather than silently.
  AGENTRY_DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  AGENTRY_AUTH_SEALING_KEY: {{ .Values.secret.sealingKey | quote }}
  {{- if .Values.secret.knowledgeSealingKey }}
  AGENTRY_KNOWLEDGE_SEALING_KEY: {{ .Values.secret.knowledgeSealingKey | quote }}
  {{- end }}
  {{- if .Values.secret.redisUrl }}
  AGENTRY_REDIS_URL: {{ .Values.secret.redisUrl | quote }}
  {{- end }}
  {{- if .Values.secret.smtpPassword }}
  AGENTRY_SMTP_PASS: {{ .Values.secret.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.secret.oidcClientSecret }}
  AGENTRY_AUTH_OIDC_CLIENT_SECRET: {{ .Values.secret.oidcClientSecret | quote }}
  {{- end }}
{{- end }}
