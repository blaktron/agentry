{{- if .Values.serviceAccount.create }}
{{- range $role := splitList " " (include "agentry.serviceAccountRoles" $) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentry.serviceAccountName" (dict "ctx" $ "role" $role) }}
  labels:
    {{- include "agentry.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
