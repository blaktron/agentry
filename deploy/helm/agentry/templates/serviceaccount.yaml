{{- if .Values.serviceAccount.create }}
{{- $names := list }}
{{- range $role := splitList " " (include "agentry.serviceAccountRoles" $) }}
{{- $names = append $names (include "agentry.serviceAccountName" (dict "ctx" $ "role" $role)) }}
{{- end }}
{{- if ne (len (uniq $names)) (len $names) }}
{{- fail (printf "the roles' ServiceAccount names collide (%s): shorten the release name or fullnameOverride" (join ", " $names)) }}
{{- end }}
{{- range $role := splitList " " (include "agentry.serviceAccountRoles" $) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentry.serviceAccountName" (dict "ctx" $ "role" $role) }}
  labels:
    {{- include "agentry.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
