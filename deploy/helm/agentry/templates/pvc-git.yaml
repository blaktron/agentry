{{- if and .Values.git.persistence.enabled (not .Values.git.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agentry.fullname" . }}-git
  labels:
    {{- include "agentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
spec:
  accessModes:
    {{- toYaml .Values.git.persistence.accessModes | nindent 4 }}
  {{- if .Values.git.persistence.storageClass }}
  storageClassName: {{ .Values.git.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.git.persistence.size | quote }}
{{- end }}
