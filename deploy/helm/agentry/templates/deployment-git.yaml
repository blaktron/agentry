apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentry.fullname" . }}-git
  labels:
    {{- include "agentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
spec:
  replicas: {{ .Values.git.replicaCount }}
  {{- with .Values.git.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: git
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "agentry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: git
    spec:
      serviceAccountName: {{ include "agentry.serviceAccountName" (dict "ctx" . "role" "git") }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.git.persistence.initOwnership }}
      # The RWX volume's root is root-owned on NFS-like classes (see
      # values.yaml); hand the directory to the non-root git process once.
      initContainers:
        - name: volume-ownership
          image: {{ include "agentry.agentrydImage" . }}
          imagePullPolicy: {{ .Values.image.agentryd.pullPolicy }}
          command:
            - sh
            - -c
            - {{ printf "chown %v:%v %s" (.Values.podSecurityContext.runAsUser | default 65532) (.Values.podSecurityContext.fsGroup | default 65532) .Values.config.git.dataDir | quote }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: git-data
              mountPath: {{ .Values.config.git.dataDir }}
      {{- end }}
      containers:
        - name: git
          image: {{ include "agentry.agentrydImage" . }}
          imagePullPolicy: {{ .Values.image.agentryd.pullPolicy }}
          args: ["git"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "agentry.agentrydEnv" (dict "ctx" . "role" "git") | nindent 12 }}
            {{- with .Values.git.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.git.port }}
            {{- with (include "agentry.gitSSHPort" .) }}
            - name: ssh
              containerPort: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.git.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/agentry
              readOnly: true
            - name: scratch
              mountPath: /tmp
            {{- include "agentry.extraVolumeMounts" . | nindent 12 }}
            - name: git-data
              mountPath: {{ .Values.config.git.dataDir }}
      volumes:
        - name: config
          configMap:
            name: {{ include "agentry.fullname" . }}-config
        - name: scratch
          emptyDir: {}
        {{- include "agentry.extraVolumes" . | nindent 8 }}
        - name: git-data
        {{- if .Values.git.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.git.persistence.existingClaim }}
        {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "agentry.fullname" . }}-git
        {{- end }}
      {{- with .Values.git.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.git.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.git.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
