apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentry.fullname" . }}-git
  labels:
    {{- include "agentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
spec:
  type: ClusterIP
  selector:
    {{- include "agentry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: git
  ports:
    - name: http
      port: 80
      targetPort: http
    {{- if (include "agentry.gitSSHPort" .) }}
    - name: ssh
      port: 22
      targetPort: ssh
    {{- end }}
