# ADOT (AWS Distro for OpenTelemetry) collector config (PLAN §16, D-25).
# Runs as an ECS sidecar (see modules/ecs-service). agentryd/web export OTLP to
# localhost; the collector ships traces to X-Ray and RED/queue/scan/judge
# metrics to CloudWatch as EMF. Loaded verbatim into an SSM parameter and
# passed to the sidecar via AOT_CONFIG_CONTENT.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 30s
  resourcedetection:
    detectors: [env, ecs]
    timeout: 5s

exporters:
  awsxray:
    indexed_attributes:
      - actor.id
      - request.id
  awsemf:
    namespace: Agentry
    log_group_name: /agentry/metrics
    # ZeroAndSingleDimensionRollup, not NoDimensionRollup.
    #
    # agentryd emits QueueAgeSeconds with a `queue` attribute, ScanStageErrors
    # and ScanStageRuns with a `stage` one, and so on — the dashboards need
    # that breakdown. But the §16.3 page alarms in main.tf address those
    # metrics with NO dimensions, and under NoDimensionRollup awsemf publishes
    # each series ONLY under its full dimension set. The zero-dimension series
    # the alarms watch would never exist, and three page alarms would sit in
    # "insufficient data" forever while looking correctly configured.
    #
    # This option publishes the zero-dimension rollup alongside each
    # single-dimension one, so the alarms match without giving up the
    # per-queue and per-stage views. Alarm semantics are unchanged: Maximum
    # over the rollup is the max across queues, and Sum over the rollup is the
    # total across stages, which is what each alarm already assumed it was
    # reading.
    dimension_rollup_option: ZeroAndSingleDimensionRollup
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [awsemf]
  telemetry:
    logs:
      level: info
