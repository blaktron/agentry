# SecureAgentry documentation site (docs.secureagentry.net) — a SEPARATE
# deployment from the web app. Standard wiki format via MkDocs Material over
# the repository's Markdown docs.
#
# site_url is read from the SITE_URL env at build time (!ENV), so the same
# recipe produces the production canonical URLs or a local dev origin — the
# base URL is configurable, per requirement.
site_name: SecureAgentry Docs
site_description: Documentation for SecureAgentry — the secure registry for AI agents.
site_url: !ENV [SITE_URL, "https://docs.secureagentry.net"]
copyright: "© 2026 SecureAgentry"

# docs_dir is the repository's docs/ tree, mounted into the build.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting started: dev/getting-started.md
  - Self-hosting: self-hosting.md
  - API conventions: api-conventions.md
  - Trust & security: trust.md
  - Operations:
      - Deployment: ops/deployment.md
      - Runbooks: ops/runbooks.md
  - Contributing:
      - RFC template: rfcs/0000-template.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables
  - attr_list

plugins:
  - search
