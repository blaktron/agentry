  /agents/{ns}/{name}/versions:
    post:
      operationId: submitVersion
      tags: [versions]
      summary: Submit a version for publication (§7 state machine entry).
      description: >
        Two sources (§6.5): JSON {tag} submits an existing repo tag
        (git-tag source); multipart/form-data with an `archive` part
        (tar.zst) submits a client-built package (cli-upload source; the
        server re-validates, re-packs deterministically, and compares
        digests: client packing is never trusted).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag:
                  type: string
                  description: Existing repo tag vX.Y.Z.
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive:
                  type: string
                  format: binary
                digest:
                  type: string
                  description: Client-computed sha256 digest to cross-check.
      responses:
        "202":
          description: Version accepted into the pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listVersions
      tags: [versions]
      summary: Version history, newest first.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentVersion"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}:
    get:
      operationId: getVersionInfo
      tags: [versions]
      summary: One version with its state and archive identity.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/VersionString"
      responses:
        "200":
          description: Version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}/manifest:
