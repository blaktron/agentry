          description: Decision recorded.
        default:
          $ref: "#/components/responses/Problem"

  /findings/{id}/verdict:
    post:
      operationId: setFindingVerdict
      tags: [reviews]
      summary: Confirm or dismiss a finding (§8.5 dismissals).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict, reason]
              properties:
                verdict:
                  type: string
                  enum: [confirmed, dismissed_false_positive, dismissed_accepted_risk]
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: Verdict recorded.
        default:
          $ref: "#/components/responses/Problem"

  /knowledge/packs:
    get:
      operationId: listKnowledgePacks
      tags: [knowledge]
      summary: The caller's knowledge packs, by name (agentry#593).
      responses:
        "200":
          description: Packs, each with its scan state and report.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgePack"
        "503":
          description: The store is off (`knowledge-unconfigured`) — no knowledge sealing key and no extension wrapper.
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createKnowledgePack
      tags: [knowledge]
      summary: Create a knowledge pack, empty, with its data key as the caller's wrapper wrapped it.
      description: >-
        The client makes the pack's data key, has it wrapped
        (`POST /knowledge/keys/wrap`), and names it here; the registry
        checks that the wrapped key opens for the caller and keeps it
        beside the pack. The tree follows with
        `PUT /knowledge/packs/{packId}/tree`. A name is the pack's
        directory name: 1-64 lowercase letters, digits, `.`, `-` or `_`,
        starting with a letter or a digit, one per owner (409
        `knowledge-name-taken`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgePackRequest"
      responses:
        "201":
          description: The pack, in state `empty`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePack"
        default:
          $ref: "#/components/responses/Problem"

  /knowledge/packs/{packId}:
    parameters:
      - $ref: "#/components/parameters/KnowledgePackId"
    get:
      operationId: getKnowledgePack
      tags: [knowledge]
      summary: One of the caller's packs with its scan report; 404 to anyone else.
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePack"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteKnowledgePack
      tags: [knowledge]
      summary: Delete one of the caller's packs, its stored trees and its wrapped key.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /knowledge/packs/{packId}/tree:
    parameters:
      - $ref: "#/components/parameters/KnowledgePackId"
    put:
      operationId: uploadKnowledgeTree
      tags: [knowledge]
      summary: Upload a pack's sealed tree, which replaces the one before and is scanned.
      description: >-
        One PUT of the sealed tree (`pkg/packseal`: the pack's canonical
        tar sealed under its data key), at most a 10 MB pack; past that
        413 `upload-too-large`, a tree past the pack's caps 413
        `knowledge-too-large`, a tree that is not the digest its header
        names 422 `knowledge-digest-mismatch`, and a tree past the owner's
        allocation 413 `knowledge-allocation` with `bytes` and `max`. The
        registry opens it to check it before it keeps it, stores it
        sealed, and queues its scan: the pack is `scanning` until the scan
        ends and `ready` after, findings or not.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Stored; the pack is `scanning`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePack"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: downloadKnowledgeTree
      tags: [knowledge]
      summary: The pack's sealed tree, as stored; the client opens it with the unwrapped data key (409 `knowledge-scanning` while it is scanned).
      responses:
        "200":
          description: The sealed tree.
          headers:
            X-Agentry-Knowledge-Digest:
              schema:
                type: string
              description: "sha256:<hex>, the digest of the tree inside."
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /knowledge/packs/{packId}/export:
    parameters:
      - $ref: "#/components/parameters/KnowledgePackId"
    get:
      operationId: exportKnowledgePack
      tags: [knowledge]
      summary: The pack's tree, decrypted as it streams, to its owner alone.
      description: >-
        The canonical tar of the pack's `wiki/` and `sources/`, whose
        SHA-256 is the pack's digest; `Cache-Control: no-store`; 404 to
        anyone but the owner; 409 `knowledge-scanning` while the pack is
        scanned.
      responses:
        "200":
          description: The tree.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /knowledge/keys/wrap:
    post:
      operationId: wrapKnowledgeKey
      tags: [knowledge]
      summary: Wrap a pack's data key for the caller.
      description: >-
        The caller's wrapper seals the 32-byte data key; the answer is
        what a client keeps beside a sealed pack. On a core registry the
        wrapper is the deployment's knowledge sealing key; an extension
        may wrap to the account's own key instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeDataKey"
      responses:
        "200":
          description: The wrapped key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeWrappedKey"
        default:
          $ref: "#/components/responses/Problem"

  /knowledge/keys/unwrap:
    post:
      operationId: unwrapKnowledgeKey
      tags: [knowledge]
      summary: Unwrap a data key wrapped for the caller; refused for anyone else's.
      description: >-
        Answers the data key over TLS, never what wraps it. A wrapped key
        that does not open for the caller — wrapped for someone else,
        under a key since destroyed, or altered — is 404
        `knowledge-key-not-found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeWrappedKey"
      responses:
        "200":
          description: The data key.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDataKey"
        default:
          $ref: "#/components/responses/Problem"

  /knowledge/usage:
    get:
      operationId: getKnowledgeUsage
      tags: [knowledge]
      summary: What the caller keeps in the registry against their allocation.
      responses:
        "200":
          description: The meter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUsage"
        default:
          $ref: "#/components/responses/Problem"

  # An organization's shared knowledge (plan knowledge.md §4.7, D13, D26;
  # agentry#646): packs the organization owns, wrapped to its key, written
  # by its admins and read by its active members, membership checked at
  # every call. A caller who is not an active member — another
  # organization's member, platform staff — is answered 404 on every route,
  # as for another account's pack.
  /orgs/{org}/knowledge/packs:
    parameters:
      - $ref: "#/components/parameters/OrgHandle"
    get:
      operationId: listOrgKnowledgePacks
      tags: [knowledge]
      summary: The organization's shared packs, by name, for any active member.
      responses:
        "200":
          description: Packs, each with `shared`, `org` and `exportable`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgePack"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOrgKnowledgePack
      tags: [knowledge]
      summary: Create a shared pack, empty, with its data key wrapped for the organization (admins).
      description: >-
        As `POST /knowledge/packs`, with the data key wrapped by
        `POST /orgs/{org}/knowledge/keys/wrap`: the registry checks that
        it opens for the organization. The pack is not exportable by
        members until an admin marks it. Recorded in the organization's
        audit log (`org.knowledge_create`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgePackRequest"
      responses:
        "201":
          description: The pack, in state `empty`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePack"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/knowledge/packs/{packId}:
    parameters:
      - $ref: "#/components/parameters/OrgHandle"
      - $ref: "#/components/parameters/KnowledgePackId"
    get:
      operationId: getOrgKnowledgePack
      tags: [knowledge]
      summary: One of the organization's shared packs with its scan report.
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePack"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOrgKnowledgePack
      tags: [knowledge]
      summary: Mark a shared pack exportable by the organization's members, or not (admins).
      description: >-
        Recorded in the organization's audit log
        (`org.knowledge_update`, with `exportable`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgePackRequest"
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePack"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteOrgKnowledgePack
      tags: [knowledge]
      summary: Delete a shared pack, its stored trees and its wrapped key (admins).
      description: >-
        Recorded in the organization's audit log (`org.knowledge_delete`).
        A member's downloaded copy stays sealed under a data key only the
        organization's unwrap opens.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/knowledge/packs/{packId}/tree:
    parameters:
      - $ref: "#/components/parameters/OrgHandle"
      - $ref: "#/components/parameters/KnowledgePackId"
    put:
      operationId: uploadOrgKnowledgeTree
      tags: [knowledge]
      summary: Upload a shared pack's sealed tree, which replaces the one before and is scanned (admins).
      description: >-
        As `PUT /knowledge/packs/{packId}/tree`, counted against the
        allocation the organization's packs draw on.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Stored; the pack is `scanning`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePack"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: downloadOrgKnowledgeTree
      tags: [knowledge]
      summary: A shared pack's sealed tree, as stored, for any active member (409 `knowledge-scanning` while it is scanned).
      responses:
        "200":
          description: The sealed tree.
          headers:
            X-Agentry-Knowledge-Digest:
              schema:
                type: string
              description: "sha256:<hex>, the digest of the tree inside."
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/knowledge/packs/{packId}/export:
    parameters:
      - $ref: "#/components/parameters/OrgHandle"
      - $ref: "#/components/parameters/KnowledgePackId"
    get:
      operationId: exportOrgKnowledgePack
      tags: [knowledge]
      summary: A shared pack's tree, decrypted as it streams, to an admin, or to a member once the pack is marked exportable.
      description: >-
        As `GET /knowledge/packs/{packId}/export`. A member's export of a
        pack not marked exportable is 403 `knowledge-not-exportable`.
        Recorded in the organization's audit log (`org.knowledge_export`).
      responses:
        "200":
          description: The tree.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/knowledge/keys/wrap:
    parameters:
      - $ref: "#/components/parameters/OrgHandle"
    post:
      operationId: wrapOrgKnowledgeKey
      tags: [knowledge]
      summary: Wrap a data key for the organization (admins).
      description: >-
        The wrapper seals the 32-byte data key for the organization: on a
        core registry under the deployment's knowledge sealing key, on an
        extension's to the organization's own key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeDataKey"
      responses:
        "200":
          description: The wrapped key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeWrappedKey"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/knowledge/keys/unwrap:
    parameters:
      - $ref: "#/components/parameters/OrgHandle"
    post:
      operationId: unwrapOrgKnowledgeKey
      tags: [knowledge]
      summary: Unwrap a data key wrapped for the organization, for any active member; refused once they are not one.
      description: >-
        The one door to a shared pack's words on a member's machine: the
        client keeps the answer in memory and asks again next time, so a
        member who is removed keeps sealed bytes they can no longer open.
        A wrapped key that does not open for the organization is 404
        `knowledge-key-not-found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeWrappedKey"
      responses:
        "200":
          description: The data key.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDataKey"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/knowledge/usage:
    parameters:
      - $ref: "#/components/parameters/OrgHandle"
    get:
      operationId: getOrgKnowledgeUsage
      tags: [knowledge]
      summary: What the organization keeps in the registry against the allocation its packs draw on.
      responses:
        "200":
          description: The meter; `bytes` and `packs` are the organization's own packs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUsage"
        default:
          $ref: "#/components/responses/Problem"

  /platform/knowledge:
    get:
      operationId: listKnowledgePackSizes
      tags: [platform]
      summary: An account's or an organization's packs by name and size, for support (platform staff).
      description: >-
        Names, states and sizes only: never a byte of content, a digest,
        a scan report or a key.
      parameters:
        - name: owner
          in: query
          required: true
          schema:
            type: string
          description: The account's or the organization's handle.
      responses:
        "200":
          description: Packs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgePackSize"
        default:
          $ref: "#/components/responses/Problem"

  /platform/policy:
    get:
      operationId: getPlatformPolicy
      tags: [policies]
      summary: The read-only platform baseline policy (§8.6).
      security: []
      responses:
        "200":
          description: Baseline policy document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /platform/redteam/reports:
    get:
      operationId: listRedTeamReports
      tags: [platform]
      summary: Reports of the scheduled red-team job against the S3/S4 gate (§17.5; platform staff).
      description: >-
        Newest first. Each report is one run of the attack corpus's rewrites
        (paraphrase, encoding, unicode and obfuscation mutators) scanned with
        the rule bundle in service, and lists the rewrites an expected rule no
        longer caught. Report-only: nothing on the publish path reads these.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Reports, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RedTeamReport"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/policy:
    get:
      operationId: getOrgPolicy
      tags: [policies]
      summary: The org policy overlay (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Org policy document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setOrgPolicy
      tags: [policies]
      summary: Set the org policy overlay (admin; tighten-only, §8.6).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Effective (merged) policy after the update.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/connections:
    get:
      operationId: listSsoConnections
      tags: [sso]
      summary: List the org's SSO connections (admin, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Connections (secrets redacted).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SsoConnection"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/connections/{kind}:
    put:
      operationId: putSsoConnection
      description: >
        403 `feature-not-included` while the organization's subscription
        does not include single sign-on. An existing connection is left
        alone by a subscription change and works again the moment the
        subscription includes SSO.
      tags: [sso]
      summary: Create or update a SAML/OIDC connection (admin, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/SsoKind"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoConnectionInput"
      responses:
        "200":
          description: Connection stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoConnection"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSsoConnection
      tags: [sso]
      summary: Delete a connection (admin, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/SsoKind"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/connections/{kind}/test:
    post:
      operationId: testSsoConnection
      tags: [sso]
      summary: Probe a stored connection without signing in (admin, §12.4; agentry#50).
      description: >
        OIDC: runs discovery against the stored issuer and reports the
        endpoints it advertises. SAML: parses the stored IdP metadata and
        reports entity id, sign-on URLs and signing-certificate expiry.
        Neither contacts the IdP's sign-in flow or uses the client secret.
        A failed probe is a 200 with ok=false and the reason, so the admin
        page can show it inline.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/SsoKind"
      responses:
        "200":
          description: Probe outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoConnectionTest"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/sso/saml/metadata:
    get:
      operationId: getSamlMetadata
      tags: [sso]
      summary: SP SAML metadata for this org's connection (§12.4).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: SP metadata XML.
          content:
            application/samlmetadata+xml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/saml/acs:
    post:
      operationId: samlAcs
      tags: [sso]
      summary: "SAML Assertion Consumer Service: consume a signed assertion (§12.4)."
      description: >
        A `RelayState` form field holding a same-origin path puts this in
        browser mode: the session and CSRF cookies are set and the answer
        is a 303 to that path, and a failure is a 303 to the sign-in page
        carrying the reason, because a browser cannot read a problem
        document. Anything else in `RelayState` is ignored. Without one the
        answer is the JSON below. 404 while the organization's subscription
        does not include SSO.
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: SSO session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "303":
          description: Browser mode — the session is set and the browser returns to the path RelayState named, or to the sign-in page on a failure.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/saml/slo:
    get:
      operationId: samlSloRedirect
      tags: [sso]
      summary: "SAML Single Logout endpoint, HTTP-Redirect binding (§12.4)."
      description: >-
        Accepts a signed IdP-initiated LogoutRequest (revokes the sessions it
        names and answers the IdP with a LogoutResponse) or the IdP's
        LogoutResponse to an SP-initiated logout (validated, then the browser
        is sent home).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "303":
          description: Redirect to the IdP's SLO endpoint (LogoutResponse) or home.
        "200":
          description: Logged out; the IdP publishes no endpoint to answer to.
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: samlSloPost
      tags: [sso]
      summary: "SAML Single Logout endpoint, HTTP-POST binding (§12.4)."
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "303":
          description: Redirect to the IdP's SLO endpoint (LogoutResponse) or home.
        "200":
          description: Logged out; the IdP publishes no endpoint to answer to.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/oidc/start:
    get:
      operationId: oidcStart
      tags: [sso]
      summary: Begin the OIDC auth-code + PKCE flow (redirect to IdP, §12.4).
      description: >
        404 while the organization's subscription does not include SSO: the
        door is not there to be started. `next` puts the callback in
        browser mode.
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: next
          in: query
          description: >
            Where the browser returns after a successful sign-in. A
            same-origin path only (leading `/`, not `//`); anything else is
            ignored. It is sealed into the state the callback reads, so the
            identity provider's round trip cannot change it.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the IdP authorization endpoint.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [sso]
      summary: "OIDC redirect URI: exchange the code and establish a session (§12.4)."
      description: >
        When the start carried a `next`, this is browser mode: the session
        and CSRF cookies are set and the answer is a 303 to that path, and
        a failure is a 303 to the sign-in page carrying the reason.
        Otherwise the answer is the JSON below. 404 while the
        organization's subscription does not include SSO.
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: SSO session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "303":
          description: Browser mode — the session is set and the browser returns to the path `next` named, or to the sign-in page on a failure.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/scim/tokens:
    get:
      operationId: listScimTokens
      tags: [scim]
      summary: List active SCIM provisioning tokens (admin, §12.5).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: SCIM tokens (secret shown only at creation).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScimToken"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createScimToken
      description: >
        403 `feature-not-included` while the organization's subscription
        does not include directory provisioning. Tokens already issued are
        left alone by a subscription change and provision again the moment
        it includes SCIM.
      tags: [scim]
      summary: Mint a SCIM bearer token (admin, §12.5).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 730
      responses:
        "201":
          description: Token created; the token value is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimTokenCreated"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/scim/tokens/{tokenId}:
    delete:
      operationId: revokeScimToken
      tags: [scim]
      summary: Revoke a SCIM token (admin, §12.5).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhook endpoints (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Webhook endpoints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEndpoint"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Create a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookInput"
      responses:
        "201":
          description: Endpoint created; the signing secret is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointCreated"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks/{id}:
    get:
      operationId: getWebhook
      tags: [webhooks]
      summary: Get a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: Endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateWebhook
      tags: [webhooks]
      summary: Update a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                active:
                  type: boolean
      responses:
        "200":
          description: Updated endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks/{id}/ping:
    post:
      operationId: pingWebhook
      tags: [webhooks]
      summary: Send a test delivery to an endpoint (admin+, §9.2).
      description: >
        Enqueues a signed `ping` delivery through the ordinary webhook
        machinery (same signature header, same SSRF guard, same retry
        schedule), so the recorded attempt appears in
        `GET …/{id}/deliveries`. Honours `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "202":
          description: Test delivery enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: Recent delivery attempts for an endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit100"
      responses:
        "200":
          description: 'Deliveries (`Link` header with rel=next when more remain).'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/domain-claims:
    get:
      operationId: listDomainClaims
      tags: [domains]
      summary: List domain claims (admin+, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Domain claims.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainClaim"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDomainClaim
      tags: [domains]
      summary: Start a domain claim; returns the DNS TXT challenge (admin+, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        "201":
          description: Claim created with a verification challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainClaim"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/domain-claims/verify:
    post:
      operationId: verifyDomainClaim
      tags: [domains]
      summary: Check the DNS TXT record and mark verified (admin+, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainClaim"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/audit/exports:
    post:
      operationId: createAuditExport
      tags: [audit]
      summary: Start an async NDJSON audit export (admin+, §12.6).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: Optional action filter.
      responses:
        "202":
          description: Export job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExport"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/audit/exports/{id}:
    get:
      operationId: getAuditExport
      tags: [audit]
      summary: Poll an audit export's status and download reference (admin+, §12.6).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExport"
        default:
          $ref: "#/components/responses/Problem"

  /platform/audit:
    get:
      operationId: listPlatformAudit
      tags: [audit]
      summary: Audit events across every org (platform staff, §12.6).
      description: >
        The staff-wide slice of the audit log, newest first. Staff access to
        it is itself audited (§12.6), one event per call.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit200"
        - name: action
          in: query
          schema:
            type: string
        - name: org
          in: query
          description: Restrict to one org handle.
          schema:
            type: string
      responses:
        "200":
          description: 'Audit page (`Link` header with rel=next when more remain).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Problem"

  /platform/ruleset-releases:
    get:
      operationId: listRulesetReleases
      tags: [platform]
      summary: Ruleset releases, newest first (platform staff, §10.1 console).
      responses:
        "200":
          description: Registered releases; the first is what new scans run under.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RulesetRelease"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRulesetRelease
      tags: [platform]
      summary: Register a ruleset release (platform staff, §9.2).
      description: >
        Records the versioned scanner bundle a deployment is running, so scan
        runs can name it. Omitting the body registers the server's own
        embedded bundle (§8.3). Honours `Idempotency-Key`; re-registering the
        same semver returns the existing row.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                semver:
                  type: string
                  pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+].*)?$"
                bundleDigest:
                  type: string
                  description: "sha256:<hex> of the bundle."
                notes:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Release registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetRelease"
        "200":
          description: This semver was already registered; the existing row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetRelease"
        default:
          $ref: "#/components/responses/Problem"

  /platform/agents/{ns}/{name}/{action}:
    post:
      operationId: platformAgentAction
      tags: [platform]
      summary: Quarantine, block, or reinstate an agent (platform staff, §7).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [quarantine, block, reinstate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: Action applied.
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/abuse-reports:
    post:
      operationId: reportAbuse
      tags: [platform]
      summary: Report malicious or abusive content (authed, rate-limited §8.7).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, detail]
              properties:
                category:
                  type: string
                  enum: [malicious_content, hidden_instructions, credential_theft, typosquat, spam, license, other]
                detail:
                  type: string
                  minLength: 10
                  maxLength: 4000
                version:
                  type: string
      responses:
        "202":
          description: Report received and queued for triage.
        default:
          $ref: "#/components/responses/Problem"

  /platform/abuse-reports:
    get:
      operationId: listAbuseReports
      tags: [platform]
      summary: Abuse reports for triage (platform staff).
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [open, triaged, actioned, dismissed]
          description: Filter by triage state; defaults to open.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Reports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbuseReport"
        default:
          $ref: "#/components/responses/Problem"

  /platform/abuse-reports/{id}:
    post:
      operationId: triageAbuseReport
      tags: [platform]
      summary: Record a triage outcome for an abuse report (platform staff).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, resolution]
              properties:
                state:
                  type: string
                  enum: [triaged, actioned, dismissed]
                resolution:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: Triage recorded.
        default:
          $ref: "#/components/responses/Problem"

  /model-input/scan:
    post:
      operationId: scanModelInput
      tags: [model-input]
      summary: AI Review of text a model is about to read (agentry#608).
      description: >-
        Scans pushed text as model input: the deployment's judge is asked
        the model-input question set (injection, exfiltration, user
        deception, obfuscation), in 8 KiB chunks asked in parallel, and
        answers per chunk with scores. The text's score is the highest over
        its chunks and questions; 2 or more (the gate's medium) is
        `withheld`, and a chunk the judge could not answer (an error, a
        timeout, an answer out of shape) makes the text `not_scanned`,
        which a caller treats as withheld. Nothing of the text is kept or
        logged. `usage` counts the judge's requests and tokens for the
        record; it is never a price (AI Review is charged per operation,
        not per scan). Open to platform staff by session, and to a hosted
        job's credential in `X-Agentry-Job-Token` where an extension admits
        it; a token is refused whatever its scopes. 503
        `model-input-unavailable` when the deployment's judge is not
        TypeSafe's Jev.
      security:
        - session: []
        - jobToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInputScanRequest"
      responses:
        "200":
          description: The verdict, per chunk and for the whole text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelInputScan"
        default:
          $ref: "#/components/responses/Problem"
  /model-input/search:
    post:
      operationId: searchModelInput
      tags: [model-input]
      summary: Web search through the deployment's provider, every result scanned (agentry#608).
      description: >-
        Searches the web through the deployment's search provider with the
        registry's own key, then scans each result (its title, address and
        snippet) as model input, as `POST /model-input/scan` does. Only
        scanned results come back: a `withheld` or `not_scanned` result
        carries its origin (scheme and host), verdict and scores, never its
        title, its snippet or the rest of its address. The query goes to the search provider and is neither kept
        nor logged. Callers as for `POST /model-input/scan`. 503
        `web-search-unavailable` when no provider is configured, 503
        `model-input-unavailable` when there is no judge to scan the
        results, 502 `web-search-failed` when the provider did not answer.
      security:
        - session: []
        - jobToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSearchRequest"
      responses:
        "200":
          description: The scanned results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchResults"
        default:
          $ref: "#/components/responses/Problem"
  /mcp-servers/scan:
    get:
      operationId: getMcpServerScan
      tags: [mcp-servers]
      summary: The registry's last vulnerability check of one MCP server package version (agentry#177).
      security: []
      description: >-
        What S7 recorded for the exact package version: `safe` means no
        known advisories at `lastCheckedAt`, `vulnerable` lists them,
        `error` means the last lookup failed and the advisories are the last
        known. 404 when no manifest has ever declared this version. The
        runner asks here before installing a declared server.
      parameters:
        - name: ecosystem
          in: query
          required: true
          schema:
            type: string
            enum: [npm, pypi]
        - name: package
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The scan record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerScan"
        default:
          $ref: "#/components/responses/Problem"
  /advisories:
    get:
      operationId: listAdvisories
      tags: [platform]
      summary: Published advisories — for one agent, or the global feed (§8.7).
      description: >
        With `affecting`, the advisories against that agent (newest first),
        under the agent's own read rule: a private agent's advisories are
        its readers' (the owning user, the owning org's admins,
        and anyone holding a grant on the agent), and anyone else —
        anonymous or signed in — gets the 404 a missing name gets, so the
        agent's existence is not discoverable here (agentry#313).
        Without it, the global feed: every published advisory against a
        public agent, newest first, keyset-paged with `cursor`/`limit` and a
        `Link: rel="next"` header (§9.1). Each item carries `agent`
        (`ns/name`) so a feed reader can find the affected BriefAgent.
      security: []
      parameters:
        - name: affecting
          in: query
          required: false
          schema:
            type: string
          description: ns/name. Omit for the global feed.
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque keyset cursor from the previous page's Link header (feed mode).
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Page size (feed mode; clamped).
      responses:
        "200":
          description: Advisories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advisory"
        default:
          $ref: "#/components/responses/Problem"

  /advisories/{advisoryId}:
    get:
      operationId: getAdvisory
      tags: [platform]
      summary: One published advisory (permalink); public agents only.
      security: []
      parameters:
        - name: advisoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The advisory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advisory"
        default:
          $ref: "#/components/responses/Problem"


  /search:
    get:
      operationId: searchAgents
      tags: [search]
      summary: Full-text search over public agents with facets (§10.4).
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free-text query; empty lists by popularity.
        - name: mode
          in: query
          description: Only agents that support this run mode.
          schema:
            $ref: "#/components/schemas/AgentMode"
        - name: capability
          in: query
          description: >
            Capability the latest published version actually asks for, e.g.
            `network`, `filesystem`, `exec`, `secrets`, `dataAccess` (§5.4).
            A capability declared as `none`, null, or empty does not match:
            `network: {egress: none}` is not a network agent.
          schema:
            type: string
            maxLength: 64
        - name: license
          in: query
          description: SPDX identifier from the latest published manifest.
          schema:
            type: string
            maxLength: 64
        - name: verified
          in: query
          description: Only agents in an org namespace with a verified domain.
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, installs, newest]
            default: relevance
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Search results with facet counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        default:
          $ref: "#/components/responses/Problem"

  /tags/{tag}:
    get:
      operationId: listAgentsByTag
      tags: [search]
      summary: Public agents tagged with {tag} (§9.2).
      description: >
        Matches the tag list of each agent's latest published manifest
        (`manifest.tags`, V8). Blocked agents never appear.
      security: []
      parameters:
        - name: tag
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit100"
      responses:
        "200":
          description: 'Tagged agents (`Link` header with rel=next when more remain).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPage"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/readme:
    get:
      operationId: getAgentReadme
      tags: [agents]
      summary: The agent README rendered to sanitized HTML (§10.3, D-11).
      description: >
        Markdown is rendered server-side through a strict allowlist: no raw
        HTML, no user styles, no SVG, external links rewritten, and invisible
        or bidi Unicode replaced with visible placeholders.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - name: version
          in: query
          schema:
            type: string
          description: Version to render; defaults to the latest published.
      responses:
        "200":
          description: Sanitized HTML fragment.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"


components:
  parameters:
    VersionString:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+].*)?$"
    Namespace:
      name: ns
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    KnowledgePackId:
      name: packId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,63}[a-z0-9])?$"
    Handle:
      name: handle
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    OrgHandle:
      name: org
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    TeamSlug:
      name: team
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    SsoKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [saml, oidc]
    WebhookID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SocialProvider:
      name: provider
      in: path
      required: true
      description: >
        Social identity provider id (§12.1). google and microsoft use their
        built-in OIDC endpoints; openai and claude need an operator-set
        issuer; authentik is the deployment's own directory service
        (DEV-057) and also needs one; an unconfigured provider answers 404.
      schema:
        type: string
        enum: [google, github, microsoft, openai, claude, authentik]
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `Link` header.
      schema:
        type: string
        maxLength: 512
    Limit100:
      name: limit
      in: query
      description: Page size; values outside the range are clamped, not rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Limit200:
      name: limit
      in: query
      description: Page size; values outside the range are clamped, not rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 200

  schemas:
    Meta:
      type: object
      required: [version, apiVersion, features]
      properties:
        version:
          type: string
          description: agentryd semantic version (build-stamped).
          example: 0.1.0
        apiVersion:
          type: string
          description: API surface major.
          example: v1
        features:
          type: object
          description: >
            Self-host feature flags: `judge`, `signing`, `redis`, `s3`,
            `externalOnly` (accounts live in an external directory service;
            the native register/password/TOTP surface answers 410 — clients
            should not offer those forms) and `publicPublish2FA` (the server
            refuses a public publish from an account it holds no second-factor
            evidence for — an enrolled TOTP, or under `auth.requireIdpMFA` an
            IdP sign-in whose `amr` named a factor;
            false in dev mode and under `externalOnly` without
            `auth.requireIdpMFA` — a client states that requirement only
            when this is true), and `knowledge` (the store of knowledge
            packs is on: the registry has a knowledge sealing key or an
            extension that wraps keys, so `/knowledge/…` answers rather
            than 503).
          additionalProperties:
            type: boolean
        minCLIVersion:
          type: string
          description: Oldest supported agentry CLI version (§11 distribution note).
        brand:
          $ref: '#/components/schemas/BrandInfo'
        ui:
          $ref: '#/components/schemas/UIInfo'
        extensions:
          type: array
          description: >
            Names of the extensions this build mounts under `/api/v1/x/<name>/`
            (DEV-091, pkg/extension); absent on the core build.
          items:
            type: string

    BrandInfo:
      type: object
      required: [name]
      description: >
        What this deployment calls itself (config `brand.*`, DEV-091): the
        name for prompts and titles, and optional logo and support address.
      properties:
        name:
          type: string
          example: Agentry
        logoUrl:
          type: string
          format: uri
        supportEmail:
          type: string

    UIInfo:
      type: object
      required: [mode]
      description: >
        The server's own browser surface under `/ui/` (DEV-091). `mode` is
        `full` (device authorize, sign-in, account, review, staff, org
        admin), `authorize` (only the device-authorize page — a site fronts
        this server) or `off`. `authorizeUrl` is the absolute page a CLI or
        the desktop app opens for browser sign-in, when served.
      properties:
        mode:
          type: string
          enum: [full, authorize, off]
        authorizeUrl:
          type: string
          format: uri

    RegisterRequest:
      type: object
      required: [handle, email, password]
      properties:
        handle:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 256
        displayName:
          type: string
          maxLength: 120

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Handle or email.
        password:
          type: string
        totpCode:
          type: string
          description: Required when the account has TOTP enabled.
        rememberDevice:
          type: boolean
          description: >
            Remember this browser as a trusted device, so a later password
            sign-in from it skips the TOTP code. Defaults to false.


            What it does: on a sign-in that answered the code, issues an
            opaque httpOnly cookie recorded against the account, and later
            password sign-ins presenting it are not asked for the code. What
            it does not do: it is not a session, does not lengthen one, and
            carries no scope — the password is still required on every
            sign-in. It cannot be earned by a sign-in that skipped the code,
            so its lifetime is absolute rather than sliding, and it expires
            after auth.trustedDeviceTTL (30 days by default and by maximum).
            It has no effect on an account with no TOTP factor, where no code
            was answered, and on a deployment whose credentials are delegated
            to an external directory, where this endpoint answers 410.

    LoginResult:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Echo in X-Agentry-CSRF on cookie-authenticated mutations.

    SocialLoginResult:
      type: object
      description: >
        Outcome of a social-login callback: either a session (like password
        login) or a pending TOTP challenge to complete at
        POST /auth/2fa/totp/challenge.
      required: [totpRequired]
      properties:
        totpRequired:
          type: boolean
        challenge:
          type: string
          description: Single-use, five-minute challenge; present iff totpRequired.
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Echo in X-Agentry-CSRF on cookie-authenticated mutations.

    TotpSetupResult:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret:
          type: string
          description: Base32 TOTP secret (display once for authenticator apps).
        otpauthUrl:
          type: string

    UserDirectory:
      type: object
      required: [managed]
      properties:
        managed:
          description: True when a directory service owns credentials for this deployment.
          type: boolean
        accountUrl:
          description: >
            Deprecated and no longer set (agentry#164): the directory's own
            account page is not offered; every setting lives here.
          type: string
          deprecated: true
        passwordChangeUrl:
          type: string
        totpSetupUrl:
          type: string
        webauthnSetupUrl:
          type: string
        devices:
          description: >
            The caller's enrolled authenticators as the directory reports
            them; absent when the server has no directory admin access.
          type: array
          items:
            type: object
            required: [kind, name]
            properties:
              id:
                description: The directory's id for the device; pass it to DELETE /user/directory/devices/{kind}/{deviceId}.
                type: string
              kind:
                description: totp | webauthn | static | duo | sms | email | other
                type: string
              name:
                type: string
              createdAt:
                type: string
                format: date-time
        devicesError:
          description: Set when the device lookup was attempted and failed; the links still work.
          type: string
    User:
      type: object
      required: [id, handle, email, displayName, emailVerified, totpEnabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        email:
          type: string
        displayName:
          type: string
        emailVerified:
          type: boolean
        totpEnabled:
          type: boolean
        cookieAckAt:
          description: When this account acknowledged the cookie notice.
          type: string
          format: date-time
        platformStaff:
          type: boolean
        orgs:
          description: The caller's org memberships (present on GET /user only).
          type: array
          items:
            type: object
            required: [handle, role]
            properties:
              handle:
                type: string
              role:
                type: string
              state:
                $ref: "#/components/schemas/MembershipState"
        pendingOrg:
          $ref: "#/components/schemas/PendingOrg"
        createdAt:
          type: string
          format: date-time

    PendingOrg:
      type: object
      description: >
        The organization the caller is waiting to be approved by (present on
        GET /user only, and only while a pending membership exists): the
        domain folded them in at a sign-in, or the organization's IdP
        provisioned them. Every page and client can say it until an admin
        approves or declines them; until then they keep working on their
        own tier.
      required: [handle, displayName, via]
      properties:
        handle:
          type: string
        displayName:
          type: string
        via:
          type: string
          description: The door — `domain` (their verified address is at the organization's domain) or `scim`.
          enum: [domain, scim]

    PublicUser:
      type: object
      required: [handle, displayName]
      properties:
        handle:
          type: string
        displayName:
          type: string

    Pat:
      type: object
      required: [id, name, prefix, scopes, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First 12 characters, for display and lookup (§4.2 pats).
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ScopeGranted"
        orgHandle:
          type: string
          description: Set when org-bound (enforced SSO, §12.4).
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    PatCreated:
      allOf:
        - $ref: "#/components/schemas/Pat"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The full secret. Shown exactly once.

    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        expiresAt:
          type: string
          format: date-time
          description: >-
            Defaults to the max PAT lifetime (§12.3); a later value is refused
            with 422, not clamped.
        orgHandle:
          type: string
          description: >
            Bind the token to this org (§12.4). Requires the current session to
            be SSO-fresh for the org; org-bound tokens live at most 90 days (a
            later expiresAt is refused with 422) and are the only tokens accepted
            against an enforced-SSO org's resources.

    DesktopGrantRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          pattern: "^[A-Za-z0-9_-]{8,128}$"
          description: The desktop app's nonce; the exchange must present the same value.

    DesktopGrant:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: Single-use exchange code. Appears only in this response.
        expiresAt:
          type: string
          format: date-time

    DesktopExchangeRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
        state:
          type: string
          pattern: "^[A-Za-z0-9_-]{8,128}$"

    Scope:
      type: string
      description: |
        PAT scopes (§12.3). A token can do only what its scopes allow; a
        session acts with the account's full authority. `run:write` lets a
        token start, feed and cancel a hosted run of a BriefAgent and
        `run:read` lets it read a run, its log and its artefacts — both are
        consumed only by a registry that mounts the runs extension, and
        unlock nothing on one that does not. `knowledge:read` and
        `knowledge:write` read and write the account's knowledge packs.
        `secret:write` sets and deletes the account's hosted-run secrets and
        never lists or reads one; it is consumed only by a registry that
        mounts the vault extension.
      enum:
        - repo:read
        - repo:write
        - agent:publish
        - agent:read
        - org:admin
        - review:act
        - audit:read
        - user:profile
        - run:read
        - run:write
        - knowledge:read
        - knowledge:write
        - secret:write

    KnowledgePack:
      type: object
      description: >-
        A knowledge pack the caller keeps in the registry (plan
        knowledge.md §4.4): what may be read of it without its data key,
        and the key as the caller's wrapper wrapped it.
      required: [id, name, state, bytes, files, pages, digest, wrappedKey, shared, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          $ref: "#/components/schemas/KnowledgePackState"
        shared:
          type: boolean
          description: >-
            An organization's shared pack (agentry#646), read through
            `/orgs/{org}/knowledge/`; false for the caller's own.
        org:
          type: string
          description: The organization's handle, on a shared pack.
        exportable:
          type: boolean
          description: >-
            On a shared pack: whether its members may export it, which an
            admin marks (D26). Its admins export it either way; a
            person's own pack is theirs to export and carries no flag.
        bytes:
          type: integer
          format: int64
          description: The tree's files, in bytes, as the CLI counts them.
        files:
          type: integer
        pages:
          type: integer
          description: The wiki's pages, the index and the log aside.
        digest:
          type: string
          description: "sha256:<hex> of the tree; empty before an upload."
        wrappedKey:
          $ref: "#/components/schemas/KnowledgeWrappedKey"
        scan:
          $ref: "#/components/schemas/KnowledgeScanReport"
        scannedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KnowledgePackState:
      type: string
      enum: [empty, scanning, ready, failed]
      description: >-
        `empty` until a tree is uploaded; `scanning` from each upload until
        its scan ends, when the pack cannot be downloaded or exported (409
        `knowledge-scanning`); `ready` after it, findings or not; `failed`
        when the stored tree could not be read to scan.

    KnowledgePackSize:
      type: object
      required: [id, name, state, bytes, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          $ref: "#/components/schemas/KnowledgePackState"
        bytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateKnowledgePackRequest:
      type: object
      required: [exportable]
      properties:
        exportable:
          type: boolean

    CreateKnowledgePackRequest:
      type: object
      required: [name, wrappedKey]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        wrappedKey:
          $ref: "#/components/schemas/KnowledgeWrappedKey"

    KnowledgeWrappedKey:
      type: object
      description: >-
        A pack's data key as a wrapper sealed it: the wrapper's `kind`
        (`deployment` on a core registry), the `recipient` it is wrapped
        to (a key's id, never a key), and the sealed bytes.
      required: [kind, recipient, key]
      properties:
        kind:
          type: string
        recipient:
          type: string
        key:
          type: string
          format: byte

    KnowledgeDataKey:
      type: object
      required: [key]
      properties:
        key:
          type: string
          format: byte
          description: A pack's 32-byte data key.

    KnowledgeUsage:
      type: object
      required: [bytes, max, packs, used, pooled]
      properties:
        bytes:
          type: integer
          format: int64
          description: The bytes of every pack the caller keeps here.
        packs:
          type: integer
          description: The packs the caller keeps here.
        used:
          type: integer
          format: int64
          description: >-
            What counts against the allocation: `bytes`, or, when `pooled`,
            the pool's total — every pack of every owner who shares it (a
            paid organization's, and its members').
        max:
          type: integer
          format: int64
          description: The allocation; 0 is no cap.
        pooled:
          type: boolean
          description: The allocation is shared with other owners (agentry#612).

    KnowledgeScanReport:
      type: object
      description: >-
        What a pack's scan read and found (plan knowledge.md §4.4, D19): a
        record, never a gate (D27). The stages that read prose over every
        text file, then AI Review over `sources/` and then `wiki/` in
        chunks no larger than the judge declares it reads.
      required: [schema, stages, read, review, findings]
      properties:
        schema:
          type: string
        stages:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
              failed:
                type: boolean
                description: The stage did not finish (a timeout, a panic); its findings are not all there are.
        read:
          type: object
          required: [sources, wiki, bytes, notRead]
          properties:
            sources:
              type: integer
            wiki:
              type: integer
            bytes:
              type: integer
              format: int64
            notRead:
              type: array
              items:
                type: string
              description: Files not read as text — a source's original, whose extracted text beside it is read.
        review:
          type: object
          required: [configured, provider, sourceChunks, wikiChunks]
          properties:
            configured:
              type: boolean
            note:
              type: string
              description: '"AI Review not configured" on a registry whose judge provider is none.'
            provider:
              type: string
            model:
              type: string
            rubricHash:
              type: string
            chunkBytes:
              type: integer
            sourceChunks:
              type: integer
            wikiChunks:
              type: integer
            failed:
              type: integer
              description: Chunks the judge failed on; the review is incomplete when it is not 0.
            error:
              type: string
            usage:
              $ref: "#/components/schemas/JudgeUsage"
        findings:
          type: array
          items:
            type: object
            required: [scanner, severity, confidence, title, part]
            properties:
              scanner:
                type: string
              severity:
                type: string
                enum: [info, low, medium, high, critical]
              confidence:
                type: string
              title:
                type: string
              part:
                type: string
                enum: [sources, wiki]
              file:
                type: string
              line:
                type: integer
              chunk:
                type: integer
            description: >-
              A finding, by where it is: never the words there, since the
              report is kept in the clear beside a sealed tree.

    ScopeGranted:
      type: string
      description: |
        A scope as it appears on a token the registry reports back (the
        token list, a newly minted token, the desktop exchange). The set is
        the one `Scope` accepts and grows by addition, so it is declared
        extensible: a client keeps a value it does not know as the string
        it is rather than failing on it.
      x-extensible-enum:
        - repo:read
        - repo:write
        - agent:publish
        - agent:read
        - org:admin
        - review:act
        - audit:read
        - user:profile
        - run:read
        - run:write
        - knowledge:read
        - knowledge:write
        - secret:write

    OrgRole:
      type: string
      description: >
        An organization role, ordered admin > security_reviewer | member
        (§12.2 as amended by agentry#360). Admins manage the organization,
        its members, settings, SSO and SCIM, and hold the security
        reviewer's powers; security_reviewer is a platform-internal role
        that exists only inside a first-party organization; the owner role
        is retired and every owner became an admin. An organization always
        keeps one admin: demoting or removing the last one is 409 last-admin.
      enum: [admin, member, security_reviewer]

    OrgRoleAssignment:
      type: string
      description: >
        The role a PUT assigns. security_reviewer is refused outside a
        first-party organization, and owner — retired by agentry#360, kept
        here so an older client's request still parses — is refused with a
        422 that names the roles that exist.
      enum: [admin, member, security_reviewer, owner]

    CreateOrgRequest:
      type: object
      required: [handle, displayName]
      properties:
        handle:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
        displayName:
          type: string
          maxLength: 120
        domain:
          type: string
          maxLength: 253
          description: >
            The domain the organization is keyed on. Omitted, it is the
            domain of the creator's verified email address; `none` records
            no domain; the creator's own domain, spelled out, is accepted.
            Any other value is 422 — a further domain is claimed over DNS
            (`POST /orgs/{org}/domain-claims`). A domain no single
            organization owns (a public mail provider, a reserved name) is
            recorded as none whatever is sent. A domain that already
            belongs to an organization is `409 domain-claimed`.

    Org:
      type: object
      required: [id, handle, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        verifiedDomain:
          type: string
          description: >
            The first domain the organization verified over DNS. Kept for
            older clients; `verifiedDomains` carries them all.
        verifiedDomains:
          type: array
          description: Every domain the organization proved control of over DNS, oldest first.
          items:
            type: string
        domain:
          type: string
          description: >
            The domain the organization was created at (its creator's
            verified email domain), which routes people at that domain to
            its administrators. Absent when none was recorded.
        state:
          $ref: "#/components/schemas/OrgState"
        decommissionAt:
          type: string
          format: date-time
          description: >
            While `state` is `decommissioning`: when the hold ends and the
            organization's agents, repositories, blobs and invitations are
            erased, its handle and domain released.
        ssoRequired:
          type: boolean
          description: Present for org admins only.
        seats:
          allOf:
            - $ref: "#/components/schemas/Seats"
          description: Present for the organization's members only.
        logoUrl:
          type: string
          description: >
            Where the organization's logo is served, when it has one: a
            path on this registry, versioned by the logo's content so a
            replaced logo has a new URL. Absent when there is none.
        createdAt:
          type: string
          format: date-time

    OrgState:
      type: string
      description: >
        Where the organization is in its life. `active` is the ordinary
        state. `suspended` (platform staff) makes the organization and
        everything under it answer as absent — 404 to every caller, git
        included — until it is reinstated. `decommissioning` is the
        read-only hold an admin, platform staff or the hosted product's
        pending-payment sweep started: members still read every agent and
        export the audit log, nothing under the organization can be
        changed, pushed or submitted (409 org-decommissioning), and at
        `decommissionAt` the erasure runs; staff may reinstate it before
        then. `decommissioned` is the row after the erasure; its handle is
        released, so no path names it.
      enum: [active, suspended, decommissioning, decommissioned]

    DomainOrg:
      type: object
      description: >
        Which organization, if any, the caller's verified email domain
        belongs to — recorded at the organization's creation or verified
        over DNS by it. A domain no single organization owns (a public
        mail provider) belongs to nobody.
      required: [domain]
      properties:
        domain:
          type: string
          description: The caller's verified email domain; empty for an address at a shared domain.
        org:
          type: object
          description: Absent when no organization holds the domain.
          required: [handle, displayName]
          properties:
            handle:
              type: string
            displayName:
              type: string
        member:
          type: boolean
          description: Whether the caller already holds a membership there, pending or active.
        requestedToday:
          type: boolean
          description: Whether the caller already asked its administrators for access in the last day.

    AccessRequestResult:
      type: object
      required: [org, mailedAdmins]
      properties:
        org:
          type: string
        mailedAdmins:
          type: integer
          description: >
            How many of the organization's admins were mailed. Zero when
            none has a verified address that accepts organization mail;
            the request is still audited.

    Membership:
      type: object
      required: [user, role]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        role:
          $ref: "#/components/schemas/OrgRole"
        viaScim:
          type: boolean
        viaDomain:
          type: boolean
          description: >
            The domain folded this person in: their verified address is at
            a domain the organization holds, and they became pending at a
            sign-in or by the sweep that runs when the organization gains
            the domain. An admin's approval keeps the flag; the console
            says how each member arrived.
        state:
          $ref: "#/components/schemas/MembershipState"

    MembershipState:
      type: string
      description: >
        Whether the membership is in force. `pending` is someone the
        organization's IdP provisioned, or its domain folded in, who holds
        no seat and nothing of the organization until an admin approves
        them; `active` is a member. Declining a pending member removes
        them, and a decline is remembered: the domain does not fold that
        person in again unless an admin invites them.
      enum: [pending, active]

    Seats:
      type: object
      description: >
        What the organization holds against its seat allowance. A seat is
        every active membership plus every open invitation; pending people
        hold none. `max` is the allowance, 0 meaning unbounded — what a
        registry with no billing extension answers.
      required: [used, invited, pending, max]
      properties:
        used:
          type: integer
          format: int64
        invited:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        max:
          type: integer
          format: int64

    Invitation:
      type: object
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/OrgRole"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        invitedBy:
          type: string
          description: The handle of the admin who sent it.
        expired:
          type: boolean
          description: An expired invitation holds no seat and cannot be accepted.

    CreateInvitationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
        role:
          $ref: "#/components/schemas/OrgRoleAssignment"

    CreatedInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [token, acceptUrl, mailed]
          properties:
            token:
              type: string
              description: >
                The credential, shown once and never again: the registry
                keeps only its SHA-256. Give it to the person you invited
                if it was not mailed to them.
            acceptUrl:
              type: string
              description: Where the invited person accepts it.
            mailed:
              type: boolean
              description: >
                Whether the invitation was mailed. It is not when the
                address belongs to no account, to an account whose address
                the registry has not verified, or to someone who has turned
                organization-invitation mail off — the registry mails no
                address it has not confirmed (DEV-099).

    InvitationOffer:
      type: object
      required: [org, orgDisplayName, email, role, expiresAt, acceptable]
      properties:
        org:
          type: string
        orgDisplayName:
          type: string
        email:
          type: string
          description: The address the invitation is bound to.
        role:
          $ref: "#/components/schemas/OrgRole"
        expiresAt:
          type: string
          format: date-time
        acceptable:
          type: boolean
          description: Whether the signed-in account may accept it now.
        reason:
          type: string
          description: Why it cannot be accepted, when it cannot.

    Team:
      type: object
      required: [id, slug]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string

    AuditEvent:
      type: object
      required: [id, occurredAt, actorKind, action]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorKind:
          type: string
          enum: [user, pat, scim, system]
        actorHandle:
          type: string
        action:
          type: string
          description: Registered action id (internal/audit/actions.go).
        targetKind:
          type: string
        targetId:
          type: string
          format: uuid
        detail:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: string
          description: Opaque; absent on the last page.

    ActivityEvent:
      type: object
      description: One agent-scoped entry from the audit log (§9.2 activity).
      required: [id, occurredAt, action]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          description: Registered action id (internal/audit/actions.go).
        actorHandle:
          type: string
          description: Absent on the public-safe subset and for system actors.
        version:
          type: string
          description: The version this entry concerns, when it names one.
        targetKind:
          type: string
          description: What the entry acted on (agent, agent_version, pat, ssh_key, session, user…); on the caller's own feed.
        ip:
          type: string
          description: The address the action was performed from; on the caller's own feed.
        userAgent:
          type: string
          description: The client that performed it; on the caller's own feed.
        detail:
          type: object
          additionalProperties: true
          description: Present only for callers with read access.

    ActivityPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
        nextCursor:
          type: string
          description: Opaque; absent on the last page.

    AgentStats:
      type: object
      required: [stars, installsTotal, installs30d]
      properties:
        stars:
          type: integer
          format: int64
        starred:
          type: boolean
          description: Whether the calling user has starred it (authed only).
        installsTotal:
          type: integer
          format: int64
        installs30d:
          type: integer
          format: int64

    TagPage:
      type: object
      required: [tag, results]
      properties:
        tag:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        nextCursor:
          type: string
          description: Opaque; absent on the last page.

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    SessionInfo:
      type: object
      required: [id, createdAt, lastSeenAt, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making this request.
        ip:
          type: string
          description: Client address recorded at session creation.
        userAgent:
          type: string
          description: User-Agent recorded at session creation.

    RulesetRelease:
      type: object
      required: [id, semver, bundleDigest, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        semver:
          type: string
        bundleDigest:
          type: string
        notes:
          type: string
        publishedAt:
          type: string
          format: date-time

    LogoutResult:
      type: object
      required: [idpLogoutUrl]
      properties:
        idpLogoutUrl:
          type: string
          format: uri
          description: Send the browser here to end the IdP session too (SAML SLO).

    RedTeamReport:
      type: object
      description: One run of the §17.5 red-team job (agentry#67).
      required: [id, rulesetSemver, bundleDigest, fixtures, cases, evaded, createdAt, report]
      properties:
        id:
          type: string
          format: uuid
        rulesetSemver:
          type: string
        bundleDigest:
          type: string
        fixtures:
          type: integer
          description: Attack fixtures with S3/S4 expectations that fired unmutated.
        cases:
          type: integer
          description: Fixtures × applicable mutators.
        evaded:
          type: integer
          description: Cases where at least one expected rule stopped firing.
        createdAt:
          type: string
          format: date-time
        report:
          type: object
          additionalProperties: true
          description: The full report (byMutator tallies and every evasion).

    SshKey:
      type: object
      required: [id, title, keyType, fingerprint, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        keyType:
          type: string
          description: ssh-ed25519, ecdsa-sha2-nistp256, ssh-rsa, …
        fingerprint:
          type: string
          description: SHA256 fingerprint as OpenSSH prints it.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    AddSshKeyRequest:
      type: object
      required: [title, publicKey]
      properties:
        title:
          type: string
          maxLength: 120
        publicKey:
          type: string
          description: One authorized_keys line ("ssh-ed25519 AAAA… comment").

    AgentMode:
      type: string
      description: >
        A run mode a release supports (DEV-088). `autonomous` runs from its
        source files, writes its output and receipts, and ends; `interactive`
        starts from the same plan and controls but the run is a conversation
        with the user in the CLI or the desktop. A release declares one or both.
      enum: [autonomous, interactive]
    AgentModes:
      type: array
      description: The run modes a release supports; at least one.
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items:
        $ref: "#/components/schemas/AgentMode"

    AgentRole:
      type: string
      description: Per-agent grant levels (§12.2), read < write < maintain < publish.
      enum: [read, write, maintain, publish]

    CreateAgentRequest:
      type: object
      required: [namespace, name, modes]
      properties:
        namespace:
          type: string
          description: User or org handle owning the agent.
        name:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,63}[a-z0-9])?$"
        modes:
          $ref: "#/components/schemas/AgentModes"
        visibility:
          type: string
          enum: [public, private]
          default: private
        summary:
          type: string
          maxLength: 140

    EmailNotificationSettings:
      type: object
      description: Which of the registry's mails the person receives.
      required: [dependencyAlerts, quarantine, reviewDecisions, advisories, orgInvites]
      properties:
        dependencyAlerts:
          type: boolean
          description: A published version declares an MCP server with a newly known vulnerability.
        quarantine:
          type: boolean
          description: A published version was quarantined by a rescan.
        reviewDecisions:
          type: boolean
          description: A reviewer decided one of the person's submissions, or the gate held one for review.
        advisories:
          type: boolean
          description: An advisory naming one of the person's BriefAgents was published.
        orgInvites:
          type: boolean
          description: The person was added to an organization.
        billing:
          type: boolean
          description: >
            The subscription that pays for the person's work: a checkout
            confirmed, a payment failed, an organization restricted, seats
            reached, "your organization covers you" (the hosted product's
            billing mail; a registry with no billing sends none). Not
            required on a write: a client that predates the switch leaves
            it as it was rather than turning it off by omission.
    WebNotificationSettings:
      type: object
      description: In-app alerts.
      required: [dependencyAlerts]
      properties:
        dependencyAlerts:
          type: boolean
          description: Show the dependency-alert banner on every page while an alert is open (the dashboard lists alerts regardless).
    NotificationSettings:
      type: object
      required: [email, web]
      properties:
        email:
          $ref: "#/components/schemas/EmailNotificationSettings"
        web:
          $ref: "#/components/schemas/WebNotificationSettings"
    DependencyAlert:
      type: object
      description: >-
        A published version declares an MCP server version with a newly
        known high or critical vulnerability (agentry#177).
      required: [id, agent, version, ecosystem, package, packageVersion, severity, advisoryIds, fixedIn, createdAt]
      properties:
        id:
          type: string
          format: uuid
        agent:
          type: string
          description: namespace/name
        version:
          type: string
          description: The affected published version.
        ecosystem:
          type: string
          enum: [npm, pypi]
        package:
          type: string
        packageVersion:
          type: string
        severity:
          type: string
          enum: [high, critical]
        advisoryIds:
          type: array
          items:
            type: string
        fixedIn:
          type: array
          description: Server versions the advisories name as fixed.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    McpAdvisory:
      type: object
      required: [id, severity, summary]
      properties:
        id:
          type: string
        aliases:
          type: array
          items:
            type: string
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        summary:
          type: string
        fixedIn:
          type: array
          items:
            type: string
        references:
          type: array
          items:
            type: string
    ModelInputSource:
      type: string
      description: >-
        What the text is: a person's description, one web search result, a
        web page's text, an answer from the registry's public API, or a
        hosted run's input file as decoded text. It rides beside the text
        in the judge's state; nothing of the text reaches a question.
      enum: [description, search_result, page, registry, input_file]
    ModelInputVerdict:
      type: string
      description: >-
        `pass`: no question scored 2 or more. `withheld`: one did; the model
        gets the source's address and the reason, never the text.
        `not_scanned`: the judge could not answer for part of the text; a
        caller treats it as withheld.
      enum: [pass, withheld, not_scanned]
    ModelInputScores:
      type: object
      description: Per question, 0 to 3 (0.5, 0.7 and 0.9 are 1, 2 and 3).
      required: [injection, exfiltration, deception, obfuscation]
      properties:
        injection:
          type: integer
          minimum: 0
          maximum: 3
        exfiltration:
          type: integer
          minimum: 0
          maximum: 3
        deception:
          type: integer
          minimum: 0
          maximum: 3
        obfuscation:
          type: integer
          minimum: 0
          maximum: 3
    ModelInputUsage:
      type: object
      description: >-
        The judge's requests and input tokens, for the record. Never a
        price: AI Review is charged per operation (DEV-150).
      required: [requests, inputTokens]
      properties:
        requests:
          type: integer
        inputTokens:
          type: integer
    ModelInputScanRequest:
      type: object
      required: [source, text]
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/ModelInputSource"
        text:
          type: string
          description: >-
            The text as the model would read it, at most 65,536 bytes of
            UTF-8 (eight chunks); a longer text is sent in parts.
    ModelInputChunk:
      type: object
      required: [index, bytes, verdict]
      properties:
        index:
          type: integer
        bytes:
          type: integer
        verdict:
          $ref: "#/components/schemas/ModelInputVerdict"
        scores:
          $ref: "#/components/schemas/ModelInputScores"
        failure:
          type: string
          description: Why a chunk was not scanned.
          enum: [timeout, judge-error]
    ModelInputScan:
      type: object
      required: [verdict, score, scores, flagged, chunks, model, questionSet, usage]
      properties:
        verdict:
          $ref: "#/components/schemas/ModelInputVerdict"
        score:
          type: integer
          minimum: 0
          maximum: 3
          description: The highest score over every chunk and question.
        scores:
          $ref: "#/components/schemas/ModelInputScores"
        flagged:
          type: array
          description: The questions that scored 2 or more.
          items:
            type: string
            enum: [injection, exfiltration, deception, obfuscation]
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/ModelInputChunk"
        model:
          type: string
          description: The pinned judge model, such as `jev-1.13.0`.
        questionSet:
          type: string
          description: >-
            The hash of the question set and everything else that changes a
            verdict (model, wording, chunk size, thresholds).
        usage:
          $ref: "#/components/schemas/ModelInputUsage"
    WebSearchRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 400
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: How many results to ask the provider for; clamped to 1–10.
    WebSearchResult:
      type: object
      required: [url, verdict, score]
      properties:
        url:
          type: string
          description: >-
            The result's address when it passed; only its origin (scheme
            and host) when it was withheld or not scanned, since a path or
            a query can carry an instruction too.
        title:
          type: string
          description: Present only when the result passed.
        snippet:
          type: string
          description: Present only when the result passed.
        verdict:
          $ref: "#/components/schemas/ModelInputVerdict"
        score:
          type: integer
          minimum: 0
          maximum: 3
        scores:
          $ref: "#/components/schemas/ModelInputScores"
        flagged:
          type: array
          items:
            type: string
            enum: [injection, exfiltration, deception, obfuscation]
    WebSearchResults:
      type: object
      required: [provider, results, withheld, model, questionSet, usage]
      properties:
        provider:
          type: string
          description: The search provider the deployment brokers.
        results:
          type: array
          items:
            $ref: "#/components/schemas/WebSearchResult"
        withheld:
          type: integer
          description: How many results were withheld or not scanned.
        model:
          type: string
        questionSet:
          type: string
        usage:
          $ref: "#/components/schemas/ModelInputUsage"
    McpServerScan:
      type: object
      required: [ecosystem, package, version, status, advisories, firstSeenAt, lastCheckedAt]
      properties:
        ecosystem:
          type: string
          enum: [npm, pypi]
        package:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [safe, vulnerable, error]
        maxSeverity:
          type: string
          enum: [info, low, medium, high, critical]
        advisories:
          type: array
          items:
            $ref: "#/components/schemas/McpAdvisory"
        firstSeenAt:
          type: string
          format: date-time
        lastCheckedAt:
          type: string
          format: date-time
        lastError:
          type: string
    Agent:
      type: object
      required: [id, namespace, name, modes, visibility, summary, defaultBranch, gitHttpUrl, quarantineState, createdAt]
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        name:
          type: string
        modes:
          $ref: "#/components/schemas/AgentModes"
        visibility:
          type: string
          enum: [public, private]
        summary:
          type: string
        defaultBranch:
          type: string
        gitHttpUrl:
          type: string
          description: Clone URL for the hosted repository (§6.1).
        gitSshUrl:
          type: string
          description: SSH clone URL (§6.1 Q7), present when the deployment serves the SSH transport.
        dependencyAlerts:
          type: array
          description: >-
            Open dependency alerts on this agent's published versions
            (agentry#177). Present on GET /agents/{ns}/{name}.
          items:
            $ref: "#/components/schemas/DependencyAlert"
        quarantineState:
          type: string
          enum: [none, quarantined, blocked]
        autoPublishTags:
          type: boolean
          description: Present for callers with maintain (§6.3 toggle).
        allowForcePush:
          type: boolean
          description: Present for callers with maintain; whether force-push to the default branch is allowed (§6.3).
        pipelineSkip:
          type: boolean
          description: >-
            Present for callers with maintain; whether submissions are
            admitted without a scan (an organization's private agent only,
            plan organization-subscriptions §4). A version so admitted is
            served with `scanStatus: skipped` and the report's verdict
            `unscanned`.
        createdAt:
          type: string
          format: date-time

    AgentGrant:
      type: object
      required: [kind, grantee, role]
      properties:
        kind:
          type: string
          enum: [user, team]
        grantee:
          type: string
          description: User handle or team slug.
        role:
          $ref: "#/components/schemas/AgentRole"

    VersionStatus:
      type: string
      description: >
        Publication state machine states (§7). `approved` is reserved and
        never produced: a reviewer's approval publishes directly
        (needs_review → published), so clients will not observe it; it is
        kept because removing an enum value is a breaking change (DEV-046).
      enum: [submitted, scanning, needs_review, approved, published, rejected, yanked, quarantined, blocked]

    AgentVersion:
      type: object
      required: [id, version, status, channel, source, createdAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        status:
          $ref: "#/components/schemas/VersionStatus"
        statusReason:
          type: string
        channel:
          type: string
          enum: [stable, beta]
        source:
          type: string
          enum: [git-tag, cli-upload]
        scanStatus:
          type: string
          enum: [pipeline, skipped]
          description: >-
            How the version was admitted: through the pipeline, or skipped
            — no scan run, no findings, no attestation, the report's
            verdict `unscanned` (plan organization-subscriptions §4). A
            skipped version is a private organization agent's; a client
            that installs or runs one asks for consent first.
        manifestSchemaVersion:
          type: integer
          description: >
            Schema major of the manifest snapshot this version carries: 1
            (kind-classified, read through the v1 mapping) or 2 (modes).
            Clients that show a version's manifest read it accordingly.
          enum: [1, 2]
        commitSha:
          type: string
        archiveDigest:
          type: string
          description: sha256:<hex>, the release identity (D-15).
        archiveSize:
          type: integer
          format: int64
        capabilities:
          type: object
          additionalProperties: true
          description: >-
            The capability contract (§5.4): the declared capability block,
            and under `knowledge` the names of the knowledge packs the
            release ships (the manifest's `knowledge.ships`), so a release
            shipping one more than an installed one asks for consent again.
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        yankedAt:
          type: string
          format: date-time
        yankReason:
          type: string

    ResolveResult:
      type: object
      required: [namespace, name, version, digest, archiveUrl, manifest, yanked]
      properties:
        namespace:
          type: string
        name:
          type: string
        version:
          type: string
        digest:
          type: string
        archiveUrl:
          type: string
          description: Where to fetch the archive (CDN on SaaS; API path self-host).
        attestationUrl:
          type: string
          description: >
            Where to fetch the DSSE attestation over this release (§8.8,
            §9.4 step 3). Present whenever the version has been signed:
            every version published by a signing-enabled deployment. Absent
            when the deployment runs `signing.kind: none` (dev/self-host
            opt-out) or the version predates signing.
        manifest:
          type: object
          additionalProperties: true
        yanked:
          type: boolean
          description: True only for exact pins of yanked versions (§5.5).
        scanStatus:
          type: string
          enum: [pipeline, skipped]
          description: >-
            How the resolved version was admitted (plan
            organization-subscriptions §4): `skipped` is a version published
            without a scan — no attestation exists for it, which is not the
            same as an unsigned registry — and a client installs or runs it
            only with the person's consent.

    ScanFinding:
      type: object
      required: [scanner, severity, confidence, title, verdict]
      properties:
        id:
          type: string
          format: uuid
        scanner:
          type: string
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        confidence:
          type: string
          enum: [low, medium, high]
        title:
          type: string
        filePath:
          type: string
        lineStart:
          type: integer
        lineEnd:
          type: integer
        excerpt:
          type: string
        detail:
          type: object
          additionalProperties: true
        verdict:
          type: string
          enum: [open, confirmed, dismissed_false_positive, dismissed_accepted_risk]
        verdictReason:
          type: string
          description: >-
            Why a reviewer dismissed or confirmed this finding. Dismissed
            findings stay on the public report WITH their rationale (PLAN
            §8.5). A finding that vanishes without explanation is exactly
            what the report exists to prevent.

    ScanReport:
      type: object
      required: [versionStatus, findings]
      properties:
        scanRunId:
          type: string
          format: uuid
        versionStatus:
          $ref: "#/components/schemas/VersionStatus"
        rulesetVersion:
          type: string
        reportDigest:
          type: string
        judgeModel:
          type: string
          description: >-
            The judge that adjudicated this run — the AI Review model — as the
            attestation records it: the model id when the provider has one
            (typesafe, openai, anthropic, bedrock), else the provider's name
            (static, none, classifier). Recorded per run for reproducibility
            beside the rubric hash.
        judgeUsage:
          $ref: "#/components/schemas/JudgeUsage"
        scanStatus:
          type: string
          description: >-
            The scan run's status; `skipped` for a version admitted without
            a scan (M21), which has no run.
        verdict:
          $ref: "#/components/schemas/ReportVerdict"
        finishedAt:
          type: string
          format: date-time
          description: "When this scan run completed: the date the report describes."
        findingCounts:
          type: object
          additionalProperties:
            type: integer
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ScanFinding"
        knowledge:
          type: array
          description: >-
            What the scan read of each knowledge pack the release ships
            (plan knowledge.md §4.6; the manifest's `knowledge.ships`):
            every rule stage over every page and source, then AI Review over
            the pack's `sources/` and its `wiki/` in chunks no larger than
            the judge reads, or "AI Review not configured". The pack's
            findings are also the version's, in `findings`, under scanner
            `SK/…` with a file path in `knowledge/<name>/`; the release's
            own stages, AI Review included, do not read a shipped pack's
            tree. Absent for a release that ships no pack.
          items:
            $ref: "#/components/schemas/ShippedKnowledgeScan"
        rescanInFlight:
          $ref: "#/components/schemas/RescanInFlight"

    ShippedKnowledgeScan:
      type: object
      required: [name, report]
      properties:
        name:
          type: string
          description: The pack's name and its directory under `knowledge/` in the archive.
        report:
          $ref: "#/components/schemas/KnowledgeScanReport"

    RescanInFlight:
      type: object
      required: [scanRunId, startedAt]
      description: >-
        A later scan of this version still running (a ruleset or MCP rescan
        sweep, a manual rescan) while the report describes the latest run that
        finished. Present only when such a run exists: the verdict a release was
        published on stands until the rescan finishes, and the report says one
        is under way rather than going blank (agentry#542).
      properties:
        scanRunId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time

    ReportVerdict:
      type: string
      enum: [scanned, unscanned]
      description: >-
        What a report is: `scanned` when a scan run stands behind it (the
        findings say the rest), `unscanned` when the version was admitted
        without one — never conflated with "scanned with a known gap".
        Absent while a scan is still pending.

    JudgeUsage:
      type: object
      description: >-
        The token use the AI Review model's provider reported for this scan
        run — what the review cost, as measured. Present for platform staff only,
        and absent when the provider reported none (the static and
        classifier judges, an endpoint without a usage block); absent means
        unknown, not zero. Not part of the signed report.
      required: [promptTokens, completionTokens]
      properties:
        promptTokens:
          type: integer
        completionTokens:
          type: integer

    ReviewItem:
      type: object
      required: [id, queue, state, version, agent, namespace]
      properties:
        id:
          type: string
          format: uuid
        queue:
          type: string
          enum: [platform, org]
        state:
          type: string
          enum: [pending, approved, rejected]
        version:
          type: string
        # The version's own status when the item was read (§7), so a client
        # can say what a decision will do: a needs_review version rejected
        # goes to rejected, a quarantined one — public, under re-review —
        # is yanked instead, the rejected edge not existing for it
        # (agentry#273).
        versionStatus:
          $ref: "#/components/schemas/VersionStatus"
        agent:
          type: string
        namespace:
          type: string
        createdAt:
          type: string
          format: date-time

    ReviewBundle:
      type: object
      required: [item, findings]
      properties:
        item:
          $ref: "#/components/schemas/ReviewItem"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ScanFinding"
        versionDetail:
          $ref: "#/components/schemas/AgentVersion"
        previous:
          # The most recent previously published version, when one exists:
          # the baseline for the capability diff (§10.1).
          $ref: "#/components/schemas/AgentVersion"
        manifest:
          description: The submitted manifest (canonical JSON form).
          type: object
          additionalProperties: true
        report:
          $ref: "#/components/schemas/ScanReport"

    ReviewFileEntry:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64

    ReviewFileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/ReviewFileEntry"

    ReviewFileContent:
      type: object
      required: [path, size, binary, truncated]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        binary:
          type: boolean
        truncated:
          type: boolean
        content:
          description: UTF-8 text content; absent for binary files. Rendered
            by clients with invisible-character escaping (§10.3).
          type: string

    AbuseReport:
      type: object
      required: [id, namespace, agent, category, detail, state, createdAt]
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        agent:
          type: string
        version:
          type: string
        category:
          type: string
        detail:
          type: string
        state:
          type: string
          enum: [open, triaged, actioned, dismissed]
        createdAt:
          type: string
          format: date-time

    Advisory:
      type: object
      required: [id, affectedVersions, severity, summary]
      properties:
        id:
          type: string
          format: uuid
        affectedVersions:
          type: string
        severity:
          type: string
        summary:
          type: string
        detail:
          type: string
        publishedAt:
          type: string
          format: date-time
        agent:
          type: string
          description: The affected agent as `ns/name`. Present on feed and permalink responses.

    SearchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        facets:
          type: object
          description: Facet counts keyed by facet name then value.
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        total:
          type: integer
          description: >
            The number of hits for this request's predicate (query, mode,
            capability, license, verified) before limit and offset — what
            "2 of 8 results" counts. Blocked and never-published agents are
            outside it, as they are outside the results.

    AccountInstallRequest:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: The published version to record, exactly (no range).
        acceptCapabilities:
          type: boolean
          description: >-
            The caller accepts the declared capabilities of this version.
            Required true on a first install and on an update whose
            capabilities widened; not read otherwise.
        acceptUnsigned:
          type: boolean
          description: Required true when the release carries no attestation.
        acceptUnscanned:
          type: boolean
          description: Required true when the release was admitted without a scan.

    AccountInstall:
      type: object
      description: >-
        One account install, composed for a list. Only `ref` and `readable`
        are always present: a record whose BriefAgent the caller can no
        longer read carries nothing else.
      required: [ref, readable]
      properties:
        ref:
          type: string
          description: "`ns/name`."
        readable:
          type: boolean
          description: Whether the caller can read the BriefAgent today.
        installedVersion:
          type: string
        capabilities:
          type: object
          additionalProperties: true
          description: The declared capability block the caller accepted, as the version declared it.
        acceptedUnsigned:
          type: boolean
          description: The release carried no attestation and the caller accepted that.
        acceptedUnscanned:
          type: boolean
          description: The release was admitted without a scan and the caller accepted that.
        latestVersion:
          type: string
          description: The newest published version; absent when none is.
        verdict:
          $ref: "#/components/schemas/ReportVerdict"
        findingCounts:
          type: object
          additionalProperties:
            type: integer
          description: The installed version's finding counts by severity; present with a `scanned` verdict.
        signed:
          type: boolean
          description: Whether the installed version carries an attestation.
        quarantineState:
          type: string
          enum: [none, quarantined, blocked]
        installedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SearchHit:
      type: object
      required: [namespace, name, modes, summary]
      properties:
        namespace:
          type: string
        name:
          type: string
        modes:
          $ref: "#/components/schemas/AgentModes"
        summary:
          type: string
        installs30d:
          type: integer
        quarantineState:
          type: string
          enum: [none, quarantined, blocked]
        logoUrl:
          type: string
          description: >
            The publishing organization's logo, when the namespace is an
            organization with one — beside the publisher's name, never in
            place of the verdict. Absent for a person's namespace and for
            an organization without one.

    Problem:
      type: object
      description: RFC 9457 problem details (D-10).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type URI.
          example: https://agentry.dev/problems/validation
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Field-level validation errors when applicable.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    SsoConnectionTest:
      type: object
      required: [ok, kind, summary, checkedAt]
      properties:
        ok:
          type: boolean
        kind:
          type: string
          enum: [saml, oidc]
        summary:
          description: One line for the admin page.
          type: string
        details:
          description: Discovered endpoints / metadata facts (strings only).
          type: object
          additionalProperties:
            type: string
        warnings:
          type: array
          items:
            type: string
        checkedAt:
          type: string
          format: date-time
    SsoConnection:
      type: object
      required: [kind, enabled]
      properties:
        kind:
          type: string
          enum: [saml, oidc]
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: Non-secret connection settings (client secrets are redacted).

    SsoConnectionInput:
      type: object
      required: [enabled, config]
      properties:
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: SAML (idpMetadataXml or idpEntityId+idpCertificatePem+idpSsoUrl) or OIDC (issuer, clientId, clientSecret) settings. An OIDC save that omits clientSecret keeps the stored one; to drop the secret, delete the connection.

    ScimToken:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    ScimTokenCreated:
      type: object
      required: [id, token]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: The SCIM bearer token; shown once.
        expiresAt:
          type: string
          format: date-time

    WebhookEndpoint:
      type: object
      required: [id, url, events, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    WebhookEndpointCreated:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The HMAC signing secret; shown once.

    WebhookInput:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          description: HTTPS endpoint (§9.3 requires https).
        events:
          type: array
          items:
            type: string

    WebhookDelivery:
      type: object
      required: [id, eventType, attempt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        attempt:
          type: integer
        statusCode:
          type: integer
        error:
          type: string
        deliveredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    DomainClaim:
      type: object
      required: [domain, verificationToken, verified]
      properties:
        domain:
          type: string
        verificationToken:
          type: string
        recordName:
          type: string
          description: The DNS TXT record name to create.
        recordValue:
          type: string
          description: The DNS TXT record value to publish.
        verified:
          type: boolean
        verifiedAt:
          type: string
          format: date-time

    AuditExport:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
        eventCount:
          type: integer
        downloadPath:
          type: string
          description: Blob-store reference; presign is a deployment concern.
        error:
          type: string
        createdAt:
          type: string
          format: date-time

  responses:
    Problem:
      description: Error following RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  securitySchemes:
    pat:
      type: http
      scheme: bearer
      bearerFormat: "agy_ personal access token"
    session:
      type: apiKey
      in: cookie
      name: agentry_session
    jobToken:
      type: apiKey
      in: header
      name: X-Agentry-Job-Token
      description: >-
        A hosted job's credential for the model-input routes, minted by an
        extension for one job and valid while it runs (agentry#608). Never
        a personal access token.

security:
  - pat: []
  - session: []
