        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}/file:
    get:
      operationId: getVersionFile
      tags: [versions]
      summary: Read one file from the version's release archive (§10.2).
      description: >
        Text files return UTF-8 content up to the display cap with a
