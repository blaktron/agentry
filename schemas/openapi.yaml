      description: >
        OIDC: runs discovery against the stored issuer and reports the
        endpoints it advertises. SAML: parses the stored IdP metadata and
        reports entity id, sign-on URLs and signing-certificate expiry.
        Neither contacts the IdP's sign-in flow or uses the client secret.
        A failed probe is a 200 with ok=false and the reason, so the admin
        page can show it inline.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/SsoKind"
      responses:
        "200":
          description: Probe outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoConnectionTest"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/sso/saml/metadata:
    get:
      operationId: getSamlMetadata
      tags: [sso]
      summary: SP SAML metadata for this org's connection (§12.4).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: SP metadata XML.
          content:
            application/samlmetadata+xml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/saml/acs:
    post:
      operationId: samlAcs
      tags: [sso]
      summary: "SAML Assertion Consumer Service: consume a signed assertion (§12.4)."
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: SSO session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/oidc/start:
    get:
      operationId: oidcStart
      tags: [sso]
      summary: Begin the OIDC auth-code + PKCE flow (redirect to IdP, §12.4).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "302":
          description: Redirect to the IdP authorization endpoint.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [sso]
      summary: "OIDC redirect URI: exchange the code and establish a session (§12.4)."
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: SSO session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/scim/tokens:
    get:
      operationId: listScimTokens
      tags: [scim]
      summary: List active SCIM provisioning tokens (owner, §12.5).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: SCIM tokens (secret shown only at creation).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScimToken"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createScimToken
      tags: [scim]
      summary: Mint a SCIM bearer token (owner, §12.5).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 730
      responses:
        "201":
          description: Token created; the token value is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimTokenCreated"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/scim/tokens/{tokenId}:
    delete:
      operationId: revokeScimToken
      tags: [scim]
      summary: Revoke a SCIM token (owner, §12.5).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhook endpoints (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Webhook endpoints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEndpoint"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Create a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookInput"
      responses:
        "201":
          description: Endpoint created; the signing secret is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointCreated"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks/{id}:
    get:
      operationId: getWebhook
      tags: [webhooks]
      summary: Get a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: Endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateWebhook
      tags: [webhooks]
      summary: Update a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                active:
                  type: boolean
      responses:
        "200":
          description: Updated endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks/{id}/ping:
    post:
      operationId: pingWebhook
      tags: [webhooks]
      summary: Send a test delivery to an endpoint (admin+, §9.2).
      description: >
        Enqueues a signed `ping` delivery through the ordinary webhook
        machinery (same signature header, same SSRF guard, same retry
        schedule), so the recorded attempt appears in
        `GET …/{id}/deliveries`. Honours `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "202":
          description: Test delivery enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: Recent delivery attempts for an endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit100"
      responses:
        "200":
          description: 'Deliveries (`Link` header with rel=next when more remain).'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/domain-claims:
    get:
      operationId: listDomainClaims
      tags: [domains]
      summary: List domain claims (admin+, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Domain claims.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainClaim"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDomainClaim
      tags: [domains]
      summary: Start a domain claim; returns the DNS TXT challenge (admin+, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        "201":
          description: Claim created with a verification challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainClaim"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/domain-claims/verify:
    post:
      operationId: verifyDomainClaim
      tags: [domains]
      summary: Check the DNS TXT record and mark verified (admin+, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainClaim"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/audit/exports:
    post:
      operationId: createAuditExport
      tags: [audit]
      summary: Start an async NDJSON audit export (admin+, §12.6).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: Optional action filter.
      responses:
        "202":
          description: Export job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExport"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/audit/exports/{id}:
    get:
      operationId: getAuditExport
      tags: [audit]
      summary: Poll an audit export's status and download reference (admin+, §12.6).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExport"
        default:
          $ref: "#/components/responses/Problem"

  /platform/audit:
    get:
      operationId: listPlatformAudit
      tags: [audit]
      summary: Audit events across every org (platform staff, §12.6).
      description: >
        The staff-wide slice of the audit log, newest first. Staff access to
        it is itself audited (§12.6), one event per call.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit200"
        - name: action
          in: query
          schema:
            type: string
        - name: org
          in: query
          description: Restrict to one org handle.
          schema:
            type: string
      responses:
        "200":
          description: 'Audit page (`Link` header with rel=next when more remain).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Problem"

  /platform/ruleset-releases:
    post:
      operationId: createRulesetRelease
      tags: [platform]
      summary: Register a ruleset release (platform staff, §9.2).
      description: >
        Records the versioned scanner bundle a deployment is running, so scan
        runs can name it. Omitting the body registers the server's own
        embedded bundle (§8.3). Honours `Idempotency-Key`; re-registering the
        same semver returns the existing row.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                semver:
                  type: string
                  pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+].*)?$"
                bundleDigest:
                  type: string
                  description: "sha256:<hex> of the bundle."
                notes:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Release registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetRelease"
        "200":
          description: This semver was already registered; the existing row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetRelease"
        default:
          $ref: "#/components/responses/Problem"

  /platform/agents/{ns}/{name}/{action}:
    post:
      operationId: platformAgentAction
      tags: [platform]
      summary: Quarantine, block, or reinstate an agent (platform staff, §7).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [quarantine, block, reinstate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: Action applied.
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/abuse-reports:
    post:
      operationId: reportAbuse
      tags: [platform]
      summary: Report malicious or abusive content (authed, rate-limited §8.7).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, detail]
              properties:
                category:
                  type: string
                  enum: [malicious_content, hidden_instructions, credential_theft, typosquat, spam, license, other]
                detail:
                  type: string
                  minLength: 10
                  maxLength: 4000
                version:
                  type: string
      responses:
        "202":
          description: Report received and queued for triage.
        default:
          $ref: "#/components/responses/Problem"

  /platform/abuse-reports:
    get:
      operationId: listAbuseReports
      tags: [platform]
      summary: Abuse reports for triage (platform staff).
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [open, triaged, actioned, dismissed]
          description: Filter by triage state; defaults to open.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Reports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbuseReport"
        default:
          $ref: "#/components/responses/Problem"

  /platform/abuse-reports/{id}:
    post:
      operationId: triageAbuseReport
      tags: [platform]
      summary: Record a triage outcome for an abuse report (platform staff).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, resolution]
              properties:
                state:
                  type: string
                  enum: [triaged, actioned, dismissed]
                resolution:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: Triage recorded.
        default:
          $ref: "#/components/responses/Problem"

  /advisories:
    get:
      operationId: listAdvisories
      tags: [platform]
      summary: Published advisories — for one agent, or the global feed (§8.7).
      description: >
        With `affecting`, the advisories against that agent (newest first).
        Without it, the global feed: every published advisory against a
        public agent, newest first, keyset-paged with `cursor`/`limit` and a
        `Link: rel="next"` header (§9.1). Each item carries `agent`
        (`ns/name`) so a feed reader can find the affected BriefAgent.
      security: []
      parameters:
        - name: affecting
          in: query
          required: false
          schema:
            type: string
          description: ns/name. Omit for the global feed.
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque keyset cursor from the previous page's Link header (feed mode).
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Page size (feed mode; clamped).
      responses:
        "200":
          description: Advisories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advisory"
        default:
          $ref: "#/components/responses/Problem"

  /advisories/{advisoryId}:
    get:
      operationId: getAdvisory
      tags: [platform]
      summary: One published advisory (permalink); public agents only.
      security: []
      parameters:
        - name: advisoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The advisory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advisory"
        default:
          $ref: "#/components/responses/Problem"


  /search:
    get:
      operationId: searchAgents
      tags: [search]
      summary: Full-text search over public agents with facets (§10.4).
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free-text query; empty lists by popularity.
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/AgentKind"
        - name: capability
          in: query
          description: >
            Capability the latest published version actually asks for, e.g.
            `network`, `filesystem`, `exec`, `secrets`, `dataAccess` (§5.4).
            A capability declared as `none`, null, or empty does not match:
            `network: {egress: none}` is not a network agent.
          schema:
            type: string
            maxLength: 64
        - name: license
          in: query
          description: SPDX identifier from the latest published manifest.
          schema:
            type: string
            maxLength: 64
        - name: verified
          in: query
          description: Only agents in an org namespace with a verified domain.
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, installs, newest]
            default: relevance
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Search results with facet counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        default:
          $ref: "#/components/responses/Problem"

  /tags/{tag}:
    get:
      operationId: listAgentsByTag
      tags: [search]
      summary: Public agents tagged with {tag} (§9.2).
      description: >
        Matches the tag list of each agent's latest published manifest
        (`manifest.tags`, V8). Blocked agents never appear.
      security: []
      parameters:
        - name: tag
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit100"
      responses:
        "200":
          description: 'Tagged agents (`Link` header with rel=next when more remain).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPage"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/readme:
    get:
      operationId: getAgentReadme
      tags: [agents]
      summary: The agent README rendered to sanitized HTML (§10.3, D-11).
      description: >
        Markdown is rendered server-side through a strict allowlist: no raw
        HTML, no user styles, no SVG, external links rewritten, and invisible
        or bidi Unicode replaced with visible placeholders.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - name: version
          in: query
          schema:
            type: string
          description: Version to render; defaults to the latest published.
      responses:
        "200":
          description: Sanitized HTML fragment.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"


components:
  parameters:
    VersionString:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+].*)?$"
    Namespace:
      name: ns
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    AgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,63}[a-z0-9])?$"
    Handle:
      name: handle
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    OrgHandle:
      name: org
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    TeamSlug:
      name: team
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    SsoKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [saml, oidc]
    WebhookID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SocialProvider:
      name: provider
      in: path
      required: true
      description: >
        Social identity provider id (§12.1). google and microsoft use their
        built-in OIDC endpoints; openai and claude need an operator-set
        issuer; authentik is the deployment's own directory service
        (DEV-057) and also needs one; an unconfigured provider answers 404.
      schema:
        type: string
        enum: [google, github, microsoft, openai, claude, authentik]
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `Link` header.
      schema:
        type: string
        maxLength: 512
    Limit100:
      name: limit
      in: query
      description: Page size; values outside the range are clamped, not rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Limit200:
      name: limit
      in: query
      description: Page size; values outside the range are clamped, not rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 200

  schemas:
    Meta:
      type: object
      required: [version, apiVersion, features]
      properties:
        version:
          type: string
          description: agentryd semantic version (build-stamped).
          example: 0.1.0
        apiVersion:
          type: string
          description: API surface major.
          example: v1
        features:
          type: object
          description: >
            Self-host feature flags: `judge`, `signing`, `redis`, `s3`, and
            `externalOnly` (accounts live in an external directory service;
            the native register/password/TOTP surface answers 410 — clients
            should not offer those forms).
          additionalProperties:
            type: boolean
        minCLIVersion:
          type: string
          description: Oldest supported agentry CLI version (§11 distribution note).

    RegisterRequest:
      type: object
      required: [handle, email, password]
      properties:
        handle:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 256
        displayName:
          type: string
          maxLength: 120

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Handle or email.
        password:
          type: string
        totpCode:
          type: string
          description: Required when the account has TOTP enabled.

    LoginResult:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Echo in X-Agentry-CSRF on cookie-authenticated mutations.

    SocialLoginResult:
      type: object
      description: >
        Outcome of a social-login callback: either a session (like password
        login) or a pending TOTP challenge to complete at
        POST /auth/2fa/totp/challenge.
      required: [totpRequired]
      properties:
        totpRequired:
          type: boolean
        challenge:
          type: string
          description: Single-use, five-minute challenge; present iff totpRequired.
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Echo in X-Agentry-CSRF on cookie-authenticated mutations.

    TotpSetupResult:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret:
          type: string
          description: Base32 TOTP secret (display once for authenticator apps).
        otpauthUrl:
          type: string

    User:
      type: object
      required: [id, handle, email, displayName, emailVerified, totpEnabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        email:
          type: string
        displayName:
          type: string
        emailVerified:
          type: boolean
        totpEnabled:
          type: boolean
        cookieAckAt:
          description: When this account acknowledged the cookie notice.
          type: string
          format: date-time
        platformStaff:
          type: boolean
        orgs:
          description: The caller's org memberships (present on GET /user only).
          type: array
          items:
            type: object
            required: [handle, role]
            properties:
              handle:
                type: string
              role:
                type: string
        createdAt:
          type: string
          format: date-time

    PublicUser:
      type: object
      required: [handle, displayName]
      properties:
        handle:
          type: string
        displayName:
          type: string

    Pat:
      type: object
      required: [id, name, prefix, scopes, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First 12 characters, for display and lookup (§4.2 pats).
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        orgHandle:
          type: string
          description: Set when org-bound (enforced SSO, §12.4).
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    PatCreated:
      allOf:
        - $ref: "#/components/schemas/Pat"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The full secret. Shown exactly once.

    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        expiresAt:
          type: string
          format: date-time
          description: Defaults to (and is capped at) the max PAT lifetime (§12.3).
        orgHandle:
          type: string
          description: >
            Bind the token to this org (§12.4). Requires the current session to
            be SSO-fresh for the org; org-bound tokens are capped at 90 days and
            are the only tokens accepted against an enforced-SSO org's resources.

    DesktopGrantRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          pattern: "^[A-Za-z0-9_-]{8,128}$"
          description: The desktop app's nonce; the exchange must present the same value.

    DesktopGrant:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: Single-use exchange code. Appears only in this response.
        expiresAt:
          type: string
          format: date-time

    DesktopExchangeRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
        state:
          type: string
          pattern: "^[A-Za-z0-9_-]{8,128}$"

    Scope:
      type: string
      description: PAT scopes (§12.3).
      enum:
        - repo:read
        - repo:write
        - agent:publish
        - agent:read
        - org:admin
        - review:act
        - audit:read
        - user:profile

    OrgRole:
      type: string
      description: Org roles, ordered owner > admin > security_reviewer | member (§12.2).
      enum: [owner, admin, security_reviewer, member]

    CreateOrgRequest:
      type: object
      required: [handle, displayName]
      properties:
        handle:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
        displayName:
          type: string
          maxLength: 120

    Org:
      type: object
      required: [id, handle, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        verifiedDomain:
          type: string
        ssoRequired:
          type: boolean
          description: Present for org admins only.
        createdAt:
          type: string
          format: date-time

    Membership:
      type: object
      required: [user, role]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        role:
          $ref: "#/components/schemas/OrgRole"
        viaScim:
          type: boolean

    Team:
      type: object
      required: [id, slug]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string

    AuditEvent:
      type: object
      required: [id, occurredAt, actorKind, action]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorKind:
          type: string
          enum: [user, pat, scim, system]
        actorHandle:
          type: string
        action:
          type: string
          description: Registered action id (internal/audit/actions.go).
        targetKind:
          type: string
        targetId:
          type: string
          format: uuid
        detail:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: string
          description: Opaque; absent on the last page.

    ActivityEvent:
      type: object
      description: One agent-scoped entry from the audit log (§9.2 activity).
      required: [id, occurredAt, action]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          description: Registered action id (internal/audit/actions.go).
        actorHandle:
          type: string
          description: Absent on the public-safe subset and for system actors.
        version:
          type: string
          description: The version this entry concerns, when it names one.
        detail:
          type: object
          additionalProperties: true
          description: Present only for callers with read access.

    ActivityPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
        nextCursor:
          type: string
          description: Opaque; absent on the last page.

    AgentStats:
      type: object
      required: [stars, installsTotal, installs30d]
      properties:
        stars:
          type: integer
          format: int64
        starred:
          type: boolean
          description: Whether the calling user has starred it (authed only).
        installsTotal:
          type: integer
          format: int64
        installs30d:
          type: integer
          format: int64

    TagPage:
      type: object
      required: [tag, results]
      properties:
        tag:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        nextCursor:
          type: string
          description: Opaque; absent on the last page.

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    SessionInfo:
      type: object
      required: [id, createdAt, lastSeenAt, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making this request.
        ip:
          type: string
          description: Client address recorded at session creation.
        userAgent:
          type: string
          description: User-Agent recorded at session creation.

    RulesetRelease:
      type: object
      required: [id, semver, bundleDigest, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        semver:
          type: string
        bundleDigest:
          type: string
        notes:
          type: string
        publishedAt:
          type: string
          format: date-time

    AgentKind:
      type: string
      description: Supported agent kinds (§1.4).
      enum: [skill, prompt-agent, mcp-server]

    AgentRole:
      type: string
      description: Per-agent grant levels (§12.2), read < write < maintain < publish.
      enum: [read, write, maintain, publish]

    CreateAgentRequest:
      type: object
      required: [namespace, name, kind]
      properties:
        namespace:
          type: string
          description: User or org handle owning the agent.
        name:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,63}[a-z0-9])?$"
        kind:
          $ref: "#/components/schemas/AgentKind"
        visibility:
          type: string
          enum: [public, private]
          default: private
        summary:
          type: string
          maxLength: 140

    Agent:
      type: object
      required: [id, namespace, name, kind, visibility, summary, defaultBranch, gitHttpUrl, quarantineState, createdAt]
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AgentKind"
        visibility:
          type: string
          enum: [public, private]
        summary:
          type: string
        defaultBranch:
          type: string
        gitHttpUrl:
          type: string
          description: Clone URL for the hosted repository (§6.1).
        quarantineState:
          type: string
          enum: [none, quarantined, blocked]
        autoPublishTags:
          type: boolean
          description: Present for callers with maintain (§6.3 toggle).
        createdAt:
          type: string
          format: date-time

    AgentGrant:
      type: object
      required: [kind, grantee, role]
      properties:
        kind:
          type: string
          enum: [user, team]
        grantee:
          type: string
          description: User handle or team slug.
        role:
          $ref: "#/components/schemas/AgentRole"

    VersionStatus:
      type: string
      description: >
        Publication state machine states (§7). `approved` is reserved and
        never produced: a reviewer's approval publishes directly
        (needs_review → published), so clients will not observe it; it is
        kept because removing an enum value is a breaking change (DEV-046).
      enum: [submitted, scanning, needs_review, approved, published, rejected, yanked, quarantined, blocked]

    AgentVersion:
      type: object
      required: [id, version, status, channel, source, createdAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        status:
          $ref: "#/components/schemas/VersionStatus"
        statusReason:
          type: string
        channel:
          type: string
          enum: [stable, beta]
        source:
          type: string
          enum: [git-tag, cli-upload]
        commitSha:
          type: string
        archiveDigest:
          type: string
          description: sha256:<hex>, the release identity (D-15).
        archiveSize:
          type: integer
          format: int64
        capabilities:
          type: object
          additionalProperties: true
          description: The declared capability block (§5.4).
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        yankedAt:
          type: string
          format: date-time
        yankReason:
          type: string

    ResolveResult:
      type: object
      required: [namespace, name, version, digest, archiveUrl, manifest, yanked]
      properties:
        namespace:
          type: string
        name:
          type: string
        version:
          type: string
        digest:
          type: string
        archiveUrl:
          type: string
          description: Where to fetch the archive (CDN on SaaS; API path self-host).
        attestationUrl:
          type: string
          description: >
            Where to fetch the DSSE attestation over this release (§8.8,
            §9.4 step 3). Present whenever the version has been signed:
            every version published by a signing-enabled deployment. Absent
            when the deployment runs `signing.kind: none` (dev/self-host
            opt-out) or the version predates signing.
        manifest:
          type: object
          additionalProperties: true
        yanked:
          type: boolean
          description: True only for exact pins of yanked versions (§5.5).

    ScanFinding:
      type: object
      required: [scanner, severity, confidence, title, verdict]
      properties:
        id:
          type: string
          format: uuid
        scanner:
          type: string
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        confidence:
          type: string
          enum: [low, medium, high]
        title:
          type: string
        filePath:
          type: string
        lineStart:
          type: integer
        lineEnd:
          type: integer
        excerpt:
          type: string
        detail:
          type: object
          additionalProperties: true
        verdict:
          type: string
          enum: [open, confirmed, dismissed_false_positive, dismissed_accepted_risk]
        verdictReason:
          type: string
          description: >-
            Why a reviewer dismissed or confirmed this finding. Dismissed
            findings stay on the public report WITH their rationale (PLAN
            §8.5). A finding that vanishes without explanation is exactly
            what the report exists to prevent.

    ScanReport:
      type: object
      required: [versionStatus, findings]
      properties:
        scanRunId:
          type: string
          format: uuid
        versionStatus:
          $ref: "#/components/schemas/VersionStatus"
        rulesetVersion:
          type: string
        reportDigest:
          type: string
        judgeModel:
          type: string
        scanStatus:
          type: string
        finishedAt:
          type: string
          format: date-time
          description: "When this scan run completed: the date the report describes."
        findingCounts:
          type: object
          additionalProperties:
            type: integer
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ScanFinding"

    ReviewItem:
      type: object
      required: [id, queue, state, version, agent, namespace]
      properties:
        id:
          type: string
          format: uuid
        queue:
          type: string
          enum: [platform, org]
        state:
          type: string
          enum: [pending, approved, rejected]
        version:
          type: string
        agent:
          type: string
        namespace:
          type: string
        createdAt:
          type: string
          format: date-time

    ReviewBundle:
      type: object
      required: [item, findings]
      properties:
        item:
          $ref: "#/components/schemas/ReviewItem"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ScanFinding"
        versionDetail:
          $ref: "#/components/schemas/AgentVersion"
        previous:
          # The most recent previously published version, when one exists:
          # the baseline for the capability diff (§10.1).
          $ref: "#/components/schemas/AgentVersion"
        manifest:
          description: The submitted manifest (canonical JSON form).
          type: object
          additionalProperties: true
        report:
          $ref: "#/components/schemas/ScanReport"

    ReviewFileEntry:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64

    ReviewFileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/ReviewFileEntry"

    ReviewFileContent:
      type: object
      required: [path, size, binary, truncated]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        binary:
          type: boolean
        truncated:
          type: boolean
        content:
          description: UTF-8 text content; absent for binary files. Rendered
            by clients with invisible-character escaping (§10.3).
          type: string

    AbuseReport:
      type: object
      required: [id, namespace, agent, category, detail, state, createdAt]
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        agent:
          type: string
        version:
          type: string
        category:
          type: string
        detail:
          type: string
        state:
          type: string
          enum: [open, triaged, actioned, dismissed]
        createdAt:
          type: string
          format: date-time

    Advisory:
      type: object
      required: [id, affectedVersions, severity, summary]
      properties:
        id:
          type: string
          format: uuid
        affectedVersions:
          type: string
        severity:
          type: string
        summary:
          type: string
        detail:
          type: string
        publishedAt:
          type: string
          format: date-time
        agent:
          type: string
          description: The affected agent as `ns/name`. Present on feed and permalink responses.

    SearchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        facets:
          type: object
          description: Facet counts keyed by facet name then value.
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        total:
          type: integer

    SearchHit:
      type: object
      required: [namespace, name, kind, summary]
      properties:
        namespace:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AgentKind"
        summary:
          type: string
        installs30d:
          type: integer
        quarantineState:
          type: string
          enum: [none, quarantined, blocked]

    Problem:
      type: object
      description: RFC 9457 problem details (D-10).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type URI.
          example: https://agentry.dev/problems/validation
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Field-level validation errors when applicable.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    SsoConnectionTest:
      type: object
      required: [ok, kind, summary, checkedAt]
      properties:
        ok:
          type: boolean
        kind:
          type: string
          enum: [saml, oidc]
        summary:
          description: One line for the admin page.
          type: string
        details:
          description: Discovered endpoints / metadata facts (strings only).
          type: object
          additionalProperties:
            type: string
        warnings:
          type: array
          items:
            type: string
        checkedAt:
          type: string
          format: date-time
    SsoConnection:
      type: object
      required: [kind, enabled]
      properties:
        kind:
          type: string
          enum: [saml, oidc]
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: Non-secret connection settings (client secrets are redacted).

    SsoConnectionInput:
      type: object
      required: [enabled, config]
      properties:
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: SAML (idpMetadataXml or idpEntityId+idpCertificatePem+idpSsoUrl) or OIDC (issuer, clientId, clientSecret) settings.

    ScimToken:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    ScimTokenCreated:
      type: object
      required: [id, token]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: The SCIM bearer token; shown once.
        expiresAt:
          type: string
          format: date-time

    WebhookEndpoint:
      type: object
      required: [id, url, events, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    WebhookEndpointCreated:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The HMAC signing secret; shown once.

    WebhookInput:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          description: HTTPS endpoint (§9.3 requires https).
        events:
          type: array
          items:
            type: string

    WebhookDelivery:
      type: object
      required: [id, eventType, attempt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        attempt:
          type: integer
        statusCode:
          type: integer
        error:
          type: string
        deliveredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    DomainClaim:
      type: object
      required: [domain, verificationToken, verified]
      properties:
        domain:
          type: string
        verificationToken:
          type: string
        recordName:
          type: string
          description: The DNS TXT record name to create.
        recordValue:
          type: string
          description: The DNS TXT record value to publish.
        verified:
          type: boolean
        verifiedAt:
          type: string
          format: date-time

    AuditExport:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
        eventCount:
          type: integer
        downloadPath:
          type: string
          description: Blob-store reference; presign is a deployment concern.
        error:
          type: string
        createdAt:
          type: string
          format: date-time

  responses:
    Problem:
      description: Error following RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  securitySchemes:
    pat:
      type: http
      scheme: bearer
      bearerFormat: "agy_ personal access token"
    session:
      type: apiKey
      in: cookie
      name: agentry_session

security:
  - pat: []
  - session: []
