# Agentry public REST API — spec-first contract (PLAN D-09, §9).
# This file is the source of truth; server stubs and clients are generated
# from it (make generate). Changes within /api/v1 must be additive; the CI
# oasdiff gate enforces it. Document version 3.0.3 per DEVIATIONS.md DEV-002.
openapi: 3.0.3
info:
  title: Agentry API
  description: >
    Public REST API for the Agentry registry: agents, versions, publishing,
    scanning reports, orgs, and enterprise administration. Errors follow
    RFC 9457 (application/problem+json). Pagination is cursor-based.
  version: 0.2.0
  license:
    name: PLACEHOLDER (Q2 pending)
servers:
  - url: /api/v1
tags:
  - name: meta
    description: Server metadata and feature discovery.
  - name: auth
    description: Registration, login, sessions, 2FA (§12.1).
  - name: users
    description: Current user, public profiles, personal access tokens.
  - name: orgs
    description: Organizations, members, teams (§12.2).
  - name: audit
    description: Org audit log (§12.6).
  - name: agents
    description: Agents, hosted repos, per-agent grants (§9.2).
  - name: search
    description: Full-text search and facets for discovery (§10.4).
  - name: versions
    description: Version submission, resolution, downloads (§7, §9.4).
  - name: reviews
    description: Review queue and finding verdicts (§8.5, §8.6).
  - name: policies
    description: Platform baseline and org policy overlays (§8.6).
  - name: platform
    description: Trust & safety actions and advisories (§7, §8.7).
  - name: sso
    description: Enterprise SSO — SAML 2.0 SP and OIDC RP (§12.4).
  - name: scim
    description: SCIM 2.0 provisioning tokens (§12.5).
  - name: webhooks
    description: Org webhook endpoints and deliveries (§9.3).
  - name: domains
    description: Domain verification for JIT auto-linking (§12.4).

paths:
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Server version and self-host feature flags (§9.2).
      security: []
      responses:
        "200":
          description: Server metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an individual account (email+password, §12.1).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; verification email queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address with the mailed token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: Email verified.
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Password (+TOTP when enabled) login; sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established. The response sets the
            `agentry_session` cookie; `csrfToken` must be echoed in the
            `X-Agentry-CSRF` header on all cookie-authenticated mutations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session.
      responses:
        "204":
          description: Session revoked.
        default:
          $ref: "#/components/responses/Problem"

  /auth/2fa/totp/setup:
    post:
      operationId: totpSetup
      tags: [auth]
      summary: Begin TOTP enrollment; returns the provisioning secret.
      responses:
        "200":
          description: Enrollment secret (confirm with /auth/2fa/totp/verify).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupResult"
        default:
          $ref: "#/components/responses/Problem"

  /auth/2fa/totp/verify:
    post:
      operationId: totpVerify
      tags: [auth]
      summary: Confirm TOTP enrollment with a current code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "204":
          description: TOTP enabled.
        default:
          $ref: "#/components/responses/Problem"

  /user:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: The authenticated user.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update profile fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 120
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /user/delete:
    post:
      operationId: deleteCurrentUser
      tags: [users]
      summary: Erase the caller's account (GDPR flow, §12.7).
      description: >
        Purges personal data and pseudonymizes the account. Published public
        versions are not deleted — they are yanked so already-installed
        copies keep verifying — or you can transfer the agents to an org
        first and then delete.
      parameters:
        - name: publishedContent
          in: query
          schema:
            type: string
            enum: [yank, transfer]
          description: What to do with published public versions (default yank).
      responses:
        "204":
          description: Account erased; session revoked.
        default:
          $ref: "#/components/responses/Problem"

  /users/{handle}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Public profile for a user handle.
      security: []
      parameters:
        - $ref: "#/components/parameters/Handle"
      responses:
        "200":
          description: Public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        default:
          $ref: "#/components/responses/Problem"

  /user/tokens:
    get:
      operationId: listTokens
      tags: [users]
      summary: List the caller's personal access tokens (metadata only).
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pat"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      tags: [users]
      summary: Mint a PAT. The secret is returned exactly once (D-22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created; `token` appears only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatCreated"
        default:
          $ref: "#/components/responses/Problem"

  /user/tokens/{tokenId}:
    delete:
      operationId: revokeToken
      tags: [users]
      summary: Revoke a PAT immediately (§12.3).
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /orgs:
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create an organization; caller becomes owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}:
    get:
      operationId: getOrg
      tags: [orgs]
      summary: Organization profile (public fields; settings for admins).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOrg
      tags: [orgs]
      summary: Update org settings (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 120
                ssoRequired:
                  type: boolean
                  description: Enforce SSO for org resources (§12.4). Owner only.
      responses:
        "200":
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/members:
    get:
      operationId: listOrgMembers
      tags: [orgs]
      summary: List members with roles (members can view).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/members/{handle}:
    put:
      operationId: setOrgMember
      tags: [orgs]
      summary: Add a member or change a role (admin+; owner grants owner/admin).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/Handle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/OrgRole"
      responses:
        "200":
          description: Membership set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeOrgMember
      tags: [orgs]
      summary: Remove a member (admin+; owners removable only by owners).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/Handle"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/teams:
    get:
      operationId: listTeams
      tags: [orgs]
      summary: List teams (members can view).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Teams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTeam
      tags: [orgs]
      summary: Create a team (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                  pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/teams/{team}:
    delete:
      operationId: deleteTeam
      tags: [orgs]
      summary: Delete a team (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/TeamSlug"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/teams/{team}/members:
    get:
      operationId: listTeamMembers
      tags: [orgs]
      summary: List team members (org members can view).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/TeamSlug"
      responses:
        "200":
          description: Team members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicUser"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/teams/{team}/members/{handle}:
    put:
      operationId: addTeamMember
      tags: [orgs]
      summary: Add an org member to a team (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/TeamSlug"
        - $ref: "#/components/parameters/Handle"
      responses:
        "204":
          description: Added.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeTeamMember
      tags: [orgs]
      summary: Remove a member from a team (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/TeamSlug"
        - $ref: "#/components/parameters/Handle"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/audit:
    get:
      operationId: listOrgAudit
      tags: [audit]
      summary: Org audit events, newest first (admin+; cursor paged, §12.6).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: action
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Problem"

  /agents:
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an agent and its hosted git repository (§9.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents in a namespace (public ones for everyone).
      security: []
      parameters:
        - name: namespace
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Agent metadata (public agents readable by anyone).
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update agent settings (maintain).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                  maxLength: 140
                visibility:
                  type: string
                  enum: [public, private]
                autoPublishTags:
                  type: boolean
      responses:
        "200":
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/grants:
    get:
      operationId: listAgentGrants
      tags: [agents]
      summary: List explicit grants (maintain).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Grants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentGrant"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/grants/user/{handle}:
    put:
      operationId: setAgentUserGrant
      tags: [agents]
      summary: Grant a user a per-agent role (maintain).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/Handle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/AgentRole"
      responses:
        "204":
          description: Grant set.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeAgentUserGrant
      tags: [agents]
      summary: Remove a user grant (maintain).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/Handle"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/grants/team/{team}:
    put:
      operationId: setAgentTeamGrant
      tags: [agents]
      summary: Grant an org team a per-agent role (maintain; org agents only).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/TeamSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/AgentRole"
      responses:
        "204":
          description: Grant set.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeAgentTeamGrant
      tags: [agents]
      summary: Remove a team grant (maintain).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/TeamSlug"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"


  /agents/{ns}/{name}/versions:
    post:
      operationId: submitVersion
      tags: [versions]
      summary: Submit a version for publication (§7 state machine entry).
      description: >
        Two sources (§6.5): JSON {tag} submits an existing repo tag
        (git-tag source); multipart/form-data with an `archive` part
        (tar.zst) submits a client-built package (cli-upload source; the
        server re-validates, re-packs deterministically, and compares
        digests — client packing is never trusted).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag:
                  type: string
                  description: Existing repo tag vX.Y.Z.
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive:
                  type: string
                  format: binary
                digest:
                  type: string
                  description: Client-computed sha256 digest to cross-check.
      responses:
        "202":
          description: Version accepted into the pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listVersions
      tags: [versions]
      summary: Version history, newest first.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentVersion"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}:
    get:
      operationId: getVersionInfo
      tags: [versions]
      summary: One version with its state and archive identity.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/VersionString"
      responses:
        "200":
          description: Version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}/manifest:
    get:
      operationId: getVersionManifest
      tags: [versions]
      summary: The validated manifest (canonical JSON, §4.2).
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/VersionString"
      responses:
        "200":
          description: Canonical manifest document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}/yank:
    post:
      operationId: yankVersion
      tags: [versions]
      summary: Yank a published version (§5.5 semantics; publish permission).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/VersionString"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "204":
          description: Yanked.
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}/download:
    get:
      operationId: downloadVersion
      tags: [versions]
      summary: Download the release archive (§9.4; counts an install).
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/VersionString"
      responses:
        "200":
          description: The tar.zst archive (self-host streams directly).
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to the CDN object (SaaS).
        "410":
          description: Version blocked by trust & safety (§7).
        default:
          $ref: "#/components/responses/Problem"

  /resolve:
    get:
      operationId: resolveRef
      tags: [versions]
      summary: Resolve ns/name@range to a concrete version (§9.4 step 1).
      security: []
      parameters:
        - name: ref
          in: query
          required: true
          schema:
            type: string
          description: "ns/name, ns/name@^1.2, ns/name@1.2.3, or ns/name@beta."
        - name: channel
          in: query
          schema:
            type: string
            enum: [stable, beta]
      responses:
        "200":
          description: Resolution result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResult"
        default:
          $ref: "#/components/responses/Problem"


  /agents/{ns}/{name}/versions/{version}/report:
    get:
      operationId: getVersionReport
      tags: [versions]
      summary: The scan report for a version (findings, ruleset, verdict, §8).
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/VersionString"
      responses:
        "200":
          description: Scan report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReport"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}/attestation:
    get:
      operationId: getVersionAttestation
      tags: [versions]
      summary: The signed DSSE attestation (§8.8), verbatim.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/VersionString"
      responses:
        "200":
          description: DSSE envelope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: No attestation (unsigned/unpublished).
        default:
          $ref: "#/components/responses/Problem"

  /review-queue:
    get:
      operationId: listReviewQueue
      tags: [reviews]
      summary: Pending review items (platform staff or org security_reviewer).
      parameters:
        - name: queue
          in: query
          required: true
          schema:
            type: string
            enum: [platform, org]
        - name: org
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Review items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewItem"
        default:
          $ref: "#/components/responses/Problem"

  /review-items/{id}:
    get:
      operationId: getReviewItem
      tags: [reviews]
      summary: One review item with its findings bundle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Review bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewBundle"
        default:
          $ref: "#/components/responses/Problem"

  /review-items/{id}/decision:
    post:
      operationId: decideReviewItem
      tags: [reviews]
      summary: Approve or reject a version under review (not its author, §12.2).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, rationale]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                rationale:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: Decision recorded.
        default:
          $ref: "#/components/responses/Problem"

  /findings/{id}/verdict:
    post:
      operationId: setFindingVerdict
      tags: [reviews]
      summary: Confirm or dismiss a finding (§8.5 dismissals).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict, reason]
              properties:
                verdict:
                  type: string
                  enum: [confirmed, dismissed_false_positive, dismissed_accepted_risk]
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: Verdict recorded.
        default:
          $ref: "#/components/responses/Problem"

  /platform/policy:
    get:
      operationId: getPlatformPolicy
      tags: [policies]
      summary: The read-only platform baseline policy (§8.6).
      security: []
      responses:
        "200":
          description: Baseline policy document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/policy:
    get:
      operationId: getOrgPolicy
      tags: [policies]
      summary: The org policy overlay (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Org policy document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setOrgPolicy
      tags: [policies]
      summary: Set the org policy overlay (owner; tighten-only, §8.6).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Effective (merged) policy after the update.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/connections:
    get:
      operationId: listSsoConnections
      tags: [sso]
      summary: List the org's SSO connections (owner, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Connections (secrets redacted).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SsoConnection"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/connections/{kind}:
    put:
      operationId: putSsoConnection
      tags: [sso]
      summary: Create or update a SAML/OIDC connection (owner, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/SsoKind"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoConnectionInput"
      responses:
        "200":
          description: Connection stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoConnection"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSsoConnection
      tags: [sso]
      summary: Delete a connection (owner, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/SsoKind"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/saml/metadata:
    get:
      operationId: getSamlMetadata
      tags: [sso]
      summary: SP SAML metadata for this org's connection (§12.4).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: SP metadata XML.
          content:
            application/samlmetadata+xml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/saml/acs:
    post:
      operationId: samlAcs
      tags: [sso]
      summary: SAML Assertion Consumer Service — consume a signed assertion (§12.4).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: SSO session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/oidc/start:
    get:
      operationId: oidcStart
      tags: [sso]
      summary: Begin the OIDC auth-code + PKCE flow (redirect to IdP, §12.4).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "302":
          description: Redirect to the IdP authorization endpoint.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/sso/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [sso]
      summary: OIDC redirect URI — exchange the code and establish a session (§12.4).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: SSO session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/scim/tokens:
    get:
      operationId: listScimTokens
      tags: [scim]
      summary: List active SCIM provisioning tokens (owner, §12.5).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: SCIM tokens (secret shown only at creation).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScimToken"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createScimToken
      tags: [scim]
      summary: Mint a SCIM bearer token (owner, §12.5).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 730
      responses:
        "201":
          description: Token created; the token value is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimTokenCreated"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/scim/tokens/{tokenId}:
    delete:
      operationId: revokeScimToken
      tags: [scim]
      summary: Revoke a SCIM token (owner, §12.5).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhook endpoints (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Webhook endpoints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEndpoint"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Create a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookInput"
      responses:
        "201":
          description: Endpoint created; the signing secret is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointCreated"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks/{id}:
    get:
      operationId: getWebhook
      tags: [webhooks]
      summary: Get a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: Endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateWebhook
      tags: [webhooks]
      summary: Update a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                active:
                  type: boolean
      responses:
        "200":
          description: Updated endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: Recent delivery attempts for an endpoint (admin+, §9.3).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: Deliveries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/domain-claims:
    get:
      operationId: listDomainClaims
      tags: [domains]
      summary: List domain claims (admin+, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Domain claims.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainClaim"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDomainClaim
      tags: [domains]
      summary: Start a domain claim; returns the DNS TXT challenge (admin+, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        "201":
          description: Claim created with a verification challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainClaim"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/domain-claims/verify:
    post:
      operationId: verifyDomainClaim
      tags: [domains]
      summary: Check the DNS TXT record and mark verified (admin+, §12.4).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainClaim"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/audit/exports:
    post:
      operationId: createAuditExport
      tags: [audit]
      summary: Start an async NDJSON audit export (admin+, §12.6).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: Optional action filter.
      responses:
        "202":
          description: Export job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExport"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/audit/exports/{id}:
    get:
      operationId: getAuditExport
      tags: [audit]
      summary: Poll an audit export's status and download reference (admin+, §12.6).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExport"
        default:
          $ref: "#/components/responses/Problem"

  /platform/agents/{ns}/{name}/{action}:
    post:
      operationId: platformAgentAction
      tags: [platform]
      summary: Quarantine, block, or reinstate an agent (platform staff, §7).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [quarantine, block, reinstate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: Action applied.
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/abuse-reports:
    post:
      operationId: reportAbuse
      tags: [platform]
      summary: Report malicious or abusive content (authed, rate-limited §8.7).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, detail]
              properties:
                category:
                  type: string
                  enum: [malicious_content, hidden_instructions, credential_theft, typosquat, spam, license, other]
                detail:
                  type: string
                  minLength: 10
                  maxLength: 4000
                version:
                  type: string
      responses:
        "202":
          description: Report received and queued for triage.
        default:
          $ref: "#/components/responses/Problem"

  /platform/abuse-reports:
    get:
      operationId: listAbuseReports
      tags: [platform]
      summary: Open abuse reports (platform staff).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Open reports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbuseReport"
        default:
          $ref: "#/components/responses/Problem"

  /advisories:
    get:
      operationId: listAdvisories
      tags: [platform]
      summary: Published advisories affecting an agent (§8.7).
      security: []
      parameters:
        - name: affecting
          in: query
          required: true
          schema:
            type: string
          description: ns/name.
      responses:
        "200":
          description: Advisories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advisory"
        default:
          $ref: "#/components/responses/Problem"


  /search:
    get:
      operationId: searchAgents
      tags: [search]
      summary: Full-text search over public agents with facets (§10.4).
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free-text query; empty lists by popularity.
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/AgentKind"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Search results with facet counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/readme:
    get:
      operationId: getAgentReadme
      tags: [agents]
      summary: The agent README rendered to sanitized HTML (§10.3, D-11).
      description: >
        Markdown is rendered server-side through a strict allowlist: no raw
        HTML, no user styles, no SVG, external links rewritten, and invisible
        or bidi Unicode replaced with visible placeholders.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - name: version
          in: query
          schema:
            type: string
          description: Version to render; defaults to the latest published.
      responses:
        "200":
          description: Sanitized HTML fragment.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"


components:
  parameters:
    VersionString:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+].*)?$"
    Namespace:
      name: ns
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    AgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,63}[a-z0-9])?$"
    Handle:
      name: handle
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    OrgHandle:
      name: org
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    TeamSlug:
      name: team
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
    SsoKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [saml, oidc]
    WebhookID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Meta:
      type: object
      required: [version, apiVersion, features]
      properties:
        version:
          type: string
          description: agentryd semantic version (build-stamped).
          example: 0.1.0
        apiVersion:
          type: string
          description: API surface major.
          example: v1
        features:
          type: object
          description: Self-host feature flags (judge provider, signing, redis).
          additionalProperties:
            type: boolean
        minCLIVersion:
          type: string
          description: Oldest supported agentry CLI version (§11 distribution note).

    RegisterRequest:
      type: object
      required: [handle, email, password]
      properties:
        handle:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 256
        displayName:
          type: string
          maxLength: 120

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Handle or email.
        password:
          type: string
        totpCode:
          type: string
          description: Required when the account has TOTP enabled.

    LoginResult:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Echo in X-Agentry-CSRF on cookie-authenticated mutations.

    TotpSetupResult:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret:
          type: string
          description: Base32 TOTP secret (display once for authenticator apps).
        otpauthUrl:
          type: string

    User:
      type: object
      required: [id, handle, email, displayName, emailVerified, totpEnabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        email:
          type: string
        displayName:
          type: string
        emailVerified:
          type: boolean
        totpEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PublicUser:
      type: object
      required: [handle, displayName]
      properties:
        handle:
          type: string
        displayName:
          type: string

    Pat:
      type: object
      required: [id, name, prefix, scopes, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First 12 characters, for display and lookup (§4.2 pats).
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        orgHandle:
          type: string
          description: Set when org-bound (enforced SSO, §12.4).
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    PatCreated:
      allOf:
        - $ref: "#/components/schemas/Pat"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The full secret. Shown exactly once.

    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        expiresAt:
          type: string
          format: date-time
          description: Defaults to (and is capped at) the max PAT lifetime (§12.3).
        orgHandle:
          type: string
          description: >
            Bind the token to this org (§12.4). Requires the current session to
            be SSO-fresh for the org; org-bound tokens are capped at 90 days and
            are the only tokens accepted against an enforced-SSO org's resources.

    Scope:
      type: string
      description: PAT scopes (§12.3).
      enum:
        - repo:read
        - repo:write
        - agent:publish
        - agent:read
        - org:admin
        - review:act
        - audit:read
        - user:profile

    OrgRole:
      type: string
      description: Org roles, ordered owner > admin > security_reviewer | member (§12.2).
      enum: [owner, admin, security_reviewer, member]

    CreateOrgRequest:
      type: object
      required: [handle, displayName]
      properties:
        handle:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
        displayName:
          type: string
          maxLength: 120

    Org:
      type: object
      required: [id, handle, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        verifiedDomain:
          type: string
        ssoRequired:
          type: boolean
          description: Present for org admins only.
        createdAt:
          type: string
          format: date-time

    Membership:
      type: object
      required: [user, role]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        role:
          $ref: "#/components/schemas/OrgRole"
        viaScim:
          type: boolean

    Team:
      type: object
      required: [id, slug]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string

    AuditEvent:
      type: object
      required: [id, occurredAt, actorKind, action]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorKind:
          type: string
          enum: [user, pat, scim, system]
        actorHandle:
          type: string
        action:
          type: string
          description: Registered action id (internal/audit/actions.go).
        targetKind:
          type: string
        targetId:
          type: string
          format: uuid
        detail:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: string
          description: Opaque; absent on the last page.

    AgentKind:
      type: string
      description: Supported agent kinds (§1.4).
      enum: [skill, prompt-agent, mcp-server]

    AgentRole:
      type: string
      description: Per-agent grant levels (§12.2), read < write < maintain < publish.
      enum: [read, write, maintain, publish]

    CreateAgentRequest:
      type: object
      required: [namespace, name, kind]
      properties:
        namespace:
          type: string
          description: User or org handle owning the agent.
        name:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,63}[a-z0-9])?$"
        kind:
          $ref: "#/components/schemas/AgentKind"
        visibility:
          type: string
          enum: [public, private]
          default: private
        summary:
          type: string
          maxLength: 140

    Agent:
      type: object
      required: [id, namespace, name, kind, visibility, summary, defaultBranch, gitHttpUrl, quarantineState, createdAt]
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AgentKind"
        visibility:
          type: string
          enum: [public, private]
        summary:
          type: string
        defaultBranch:
          type: string
        gitHttpUrl:
          type: string
          description: Clone URL for the hosted repository (§6.1).
        quarantineState:
          type: string
          enum: [none, quarantined, blocked]
        autoPublishTags:
          type: boolean
          description: Present for callers with maintain (§6.3 toggle).
        createdAt:
          type: string
          format: date-time

    AgentGrant:
      type: object
      required: [kind, grantee, role]
      properties:
        kind:
          type: string
          enum: [user, team]
        grantee:
          type: string
          description: User handle or team slug.
        role:
          $ref: "#/components/schemas/AgentRole"

    VersionStatus:
      type: string
      description: Publication state machine states (§7).
      enum: [submitted, scanning, needs_review, approved, published, rejected, yanked, quarantined, blocked]

    AgentVersion:
      type: object
      required: [id, version, status, channel, source, createdAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        status:
          $ref: "#/components/schemas/VersionStatus"
        statusReason:
          type: string
        channel:
          type: string
          enum: [stable, beta]
        source:
          type: string
          enum: [git-tag, cli-upload]
        commitSha:
          type: string
        archiveDigest:
          type: string
          description: sha256:<hex> — the release identity (D-15).
        archiveSize:
          type: integer
          format: int64
        capabilities:
          type: object
          additionalProperties: true
          description: The declared capability block (§5.4).
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        yankedAt:
          type: string
          format: date-time
        yankReason:
          type: string

    ResolveResult:
      type: object
      required: [namespace, name, version, digest, archiveUrl, manifest, yanked]
      properties:
        namespace:
          type: string
        name:
          type: string
        version:
          type: string
        digest:
          type: string
        archiveUrl:
          type: string
          description: Where to fetch the archive (CDN on SaaS; API path self-host).
        attestationUrl:
          type: string
          description: DSSE attestation location (M4+; absent until signing ships).
        manifest:
          type: object
          additionalProperties: true
        yanked:
          type: boolean
          description: True only for exact pins of yanked versions (§5.5).

    ScanFinding:
      type: object
      required: [scanner, severity, confidence, title, verdict]
      properties:
        id:
          type: string
          format: uuid
        scanner:
          type: string
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        confidence:
          type: string
          enum: [low, medium, high]
        title:
          type: string
        filePath:
          type: string
        lineStart:
          type: integer
        lineEnd:
          type: integer
        excerpt:
          type: string
        detail:
          type: object
          additionalProperties: true
        verdict:
          type: string
          enum: [open, confirmed, dismissed_false_positive, dismissed_accepted_risk]

    ScanReport:
      type: object
      required: [versionStatus, findings]
      properties:
        scanRunId:
          type: string
          format: uuid
        versionStatus:
          $ref: "#/components/schemas/VersionStatus"
        rulesetVersion:
          type: string
        reportDigest:
          type: string
        judgeModel:
          type: string
        scanStatus:
          type: string
        findingCounts:
          type: object
          additionalProperties:
            type: integer
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ScanFinding"

    ReviewItem:
      type: object
      required: [id, queue, state, version, agent, namespace]
      properties:
        id:
          type: string
          format: uuid
        queue:
          type: string
          enum: [platform, org]
        state:
          type: string
          enum: [pending, approved, rejected]
        version:
          type: string
        agent:
          type: string
        namespace:
          type: string
        createdAt:
          type: string
          format: date-time

    ReviewBundle:
      type: object
      required: [item, findings]
      properties:
        item:
          $ref: "#/components/schemas/ReviewItem"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ScanFinding"

    AbuseReport:
      type: object
      required: [id, namespace, agent, category, detail, state, createdAt]
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        agent:
          type: string
        version:
          type: string
        category:
          type: string
        detail:
          type: string
        state:
          type: string
          enum: [open, triaged, actioned, dismissed]
        createdAt:
          type: string
          format: date-time

    Advisory:
      type: object
      required: [id, affectedVersions, severity, summary]
      properties:
        id:
          type: string
          format: uuid
        affectedVersions:
          type: string
        severity:
          type: string
        summary:
          type: string
        detail:
          type: string
        publishedAt:
          type: string
          format: date-time

    SearchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        facets:
          type: object
          description: Facet counts keyed by facet name then value.
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        total:
          type: integer

    SearchHit:
      type: object
      required: [namespace, name, kind, summary]
      properties:
        namespace:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AgentKind"
        summary:
          type: string
        installs30d:
          type: integer
        quarantineState:
          type: string
          enum: [none, quarantined, blocked]

    Problem:
      type: object
      description: RFC 9457 problem details (D-10).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type URI.
          example: https://agentry.dev/problems/validation
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Field-level validation errors when applicable.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    SsoConnection:
      type: object
      required: [kind, enabled]
      properties:
        kind:
          type: string
          enum: [saml, oidc]
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: Non-secret connection settings (client secrets are redacted).

    SsoConnectionInput:
      type: object
      required: [enabled, config]
      properties:
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: SAML (idpMetadataXml or idpEntityId+idpCertificatePem+idpSsoUrl) or OIDC (issuer, clientId, clientSecret) settings.

    ScimToken:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    ScimTokenCreated:
      type: object
      required: [id, token]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: The SCIM bearer token; shown once.
        expiresAt:
          type: string
          format: date-time

    WebhookEndpoint:
      type: object
      required: [id, url, events, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    WebhookEndpointCreated:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The HMAC signing secret; shown once.

    WebhookInput:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          description: HTTPS endpoint (§9.3 requires https).
        events:
          type: array
          items:
            type: string

    WebhookDelivery:
      type: object
      required: [id, eventType, attempt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        attempt:
          type: integer
        statusCode:
          type: integer
        error:
          type: string
        deliveredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    DomainClaim:
      type: object
      required: [domain, verificationToken, verified]
      properties:
        domain:
          type: string
        verificationToken:
          type: string
        recordName:
          type: string
          description: The DNS TXT record name to create.
        recordValue:
          type: string
          description: The DNS TXT record value to publish.
        verified:
          type: boolean
        verifiedAt:
          type: string
          format: date-time

    AuditExport:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
        eventCount:
          type: integer
        downloadPath:
          type: string
          description: Blob-store reference; presign is a deployment concern.
        error:
          type: string
        createdAt:
          type: string
          format: date-time

  responses:
    Problem:
      description: Error following RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  securitySchemes:
    pat:
      type: http
      scheme: bearer
      bearerFormat: "agy_ personal access token"
    session:
      type: apiKey
      in: cookie
      name: agentry_session

security:
  - pat: []
  - session: []
