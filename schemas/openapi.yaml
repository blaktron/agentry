      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update agent settings (maintain).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                  maxLength: 140
                visibility:
                  type: string
                  enum: [public, private]
                autoPublishTags:
                  type: boolean
      responses:
        "200":
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent that was never published (maintain, §9.2).
      description: >
        Deletes the agent and its hosted repository. Refused (409) once the
        agent has any version row, because §4.3 forbids deleting version rows:
        a version past `submitted` is history consumers may depend on, and a
        version still at `submitted` is mid-pipeline. Published agents are
        yanked or blocked, never deleted.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "204":
          description: Deleted.
        "409":
          description: The agent has versions, advisories, or abuse reports.
        default:
          $ref: "#/components/responses/Problem"

