  /agents/{ns}/{name}/versions:
    post:
      operationId: submitVersion
      tags: [versions]
      summary: Submit a version for publication (§7 state machine entry).
      description: >
        Two sources (§6.5): JSON {tag} submits an existing repo tag
        (git-tag source); multipart/form-data with an `archive` part
        (tar.zst) submits a client-built package (cli-upload source; the
        server re-validates, re-packs deterministically, and compares
        digests: client packing is never trusted).

        A deployment with an admission extension (the hosted product's
        subscription tiers) may refuse a submission after every core check
        has passed and before anything is stored: `402` with the problem
        type `credits-exhausted` carries `balance`, `resetsAt` and
        `account` — the handle whose balance is short, which is the
        submitter's own or, for a member of a paid organization, the
        organization's — at the top level of the problem body.
        `402 subscription-inactive` refuses one whose payer is an
        organization that is awaiting payment or has lapsed, and carries
        `account` the same way. `503 admission-unavailable` means the check
        could not be reached and nothing was recorded. A core registry
        never answers any of them. The gate's verdict never depends on
        admission.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag:
                  type: string
                  description: Existing repo tag vX.Y.Z.
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive:
                  type: string
                  format: binary
                digest:
                  type: string
                  description: Client-computed sha256 digest to cross-check.
      responses:
        "202":
          description: Version accepted into the pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "402":
          description: >-
            Refused by the deployment's admission extension (problem type
            `credits-exhausted` with `balance`, `resetsAt` and `account`,
            or `subscription-inactive` with `account`); nothing was
            stored. Never answered by a core registry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: >-
            `scan-not-scheduled` (the version was recorded and a watchdog
            routes it to review) or `admission-unavailable` (nothing was
            recorded; retry).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listVersions
      tags: [versions]
      summary: Version history, newest first.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentVersion"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}:
    get:
      operationId: getVersionInfo
      tags: [versions]
      summary: One version with its state and archive identity.
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/VersionString"
      responses:
