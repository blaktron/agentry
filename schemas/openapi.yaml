          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}/download:
    get:
      operationId: downloadVersion
      tags: [versions]
      summary: Download the release archive (§9.4; counts an install).
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/VersionString"
      responses:
        "200":
          description: The tar.zst archive (self-host streams directly).
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect to the CDN object (SaaS).
        "410":
          description: Version blocked by trust & safety (§7).
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/versions/{version}/files:
    get:
      operationId: listVersionFiles
      tags: [versions]
      summary: List the files inside the version's release archive (§10.2).
      description: >
        The same inventory a reviewer sees (§10.1), opened under the
        download access gate: published and yanked versions list, blocked
