      responses:
        "200":
          description: File metadata and, for text files, its content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewFileContent"
        "410":
          description: Version blocked by trust & safety (§7).
        default:
          $ref: "#/components/responses/Problem"

