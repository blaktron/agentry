      operationId: getVersionManifest
      tags: [versions]
      summary: The validated manifest (canonical JSON, §4.2).
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/VersionString"
