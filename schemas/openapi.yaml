# Agentry public REST API: spec-first contract (PLAN D-09, §9).
# This file is the source of truth; server stubs and clients are generated
# from it (make generate). Changes within /api/v1 must be additive; the CI
# oasdiff gate enforces it. Document version 3.0.3 per DEVIATIONS.md DEV-002.
openapi: 3.0.3
info:
  title: Agentry API
  description: >
    Public REST API for the Agentry registry: agents, versions,
    publishing, scanning reports, orgs, and enterprise administration. Errors
    follow RFC 9457 (application/problem+json).


    Pagination (§9.1): list endpoints take `?cursor=&limit=` with an opaque
    cursor and return the next page as a `Link: <…>; rel="next"` header
    (cursor-carrying bodies keep `nextCursor` too). A `limit` outside the
    documented bounds is clamped, never rejected.


    Rate limits (§19) are reported on every response with
    `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`
    (plus `Retry-After` on 429).


    Idempotency (§9.1): mutating POSTs accept an `Idempotency-Key` request
    header (≤255 chars). The first request under a key executes and its
    response is recorded. A retry with the same key, user, endpoint, and
    body replays that recorded response verbatim. Reusing a key with a
    *different* body is a 409. Keys are scoped per user and endpoint and
    expire after 24 hours. Endpoints that honour the header: `POST /orgs`,
    `POST /orgs/{org}/webhooks`, `POST /orgs/{org}/webhooks/{id}/ping`,
    `POST /platform/ruleset-releases`,
    `POST /agents/{ns}/{name}/versions`.
  version: 0.2.0
  license:
    name: MIT
    url: https://github.com/blaktron/agentry/blob/main/LICENSE
servers:
  - url: /api/v1
tags:
  - name: meta
    description: Server metadata and feature discovery.
  - name: auth
    description: Registration, login, sessions, 2FA (§12.1).
  - name: users
    description: Current user, public profiles, personal access tokens.
  - name: orgs
    description: Organizations, members, teams (§12.2).
  - name: audit
    description: Org audit log (§12.6).
  - name: agents
    description: Agents, hosted repos, per-agent grants (§9.2).
  - name: search
    description: Full-text search and facets for discovery (§10.4).
  - name: versions
    description: Version submission, resolution, downloads (§7, §9.4).
  - name: reviews
    description: Review queue and finding verdicts (§8.5, §8.6).
  - name: policies
    description: Platform baseline and org policy overlays (§8.6).
  - name: platform
    description: Trust & safety actions and advisories (§7, §8.7).
  - name: sso
    description: "Enterprise SSO: SAML 2.0 SP and OIDC RP (§12.4)."
  - name: scim
    description: SCIM 2.0 provisioning tokens (§12.5).
  - name: webhooks
    description: Org webhook endpoints and deliveries (§9.3).
  - name: domains
    description: Domain verification for JIT auto-linking (§12.4).
  - name: stars
    description: Stars and per-agent counters (§9.2).

paths:
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Server version and self-host feature flags (§9.2).
      security: []
      responses:
        "200":
          description: Server metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an individual account (email+password, §12.1).
      description: >
        When the deployment delegates accounts to an external directory
        (`AGENTRY_AUTH_EXTERNAL_ONLY`, DEV-057), this endpoint answers 410 Gone;
        sign in through /auth/oidc/{provider}/start instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; verification email queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      description: >
        When the deployment delegates accounts to an external directory
        (`AGENTRY_AUTH_EXTERNAL_ONLY`, DEV-057), this endpoint answers 410 Gone;
        sign in through /auth/oidc/{provider}/start instead.
      tags: [auth]
      summary: Confirm an email address with the mailed token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: Email verified.
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      description: >
        When the deployment delegates accounts to an external directory
        (`AGENTRY_AUTH_EXTERNAL_ONLY`, DEV-057), this endpoint answers 410 Gone;
        sign in through /auth/oidc/{provider}/start instead.
      tags: [auth]
      summary: Password (+TOTP when enabled) login; sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established. The response sets the
            `agentry_session` cookie; `csrfToken` must be echoed in the
            `X-Agentry-CSRF` header on all cookie-authenticated mutations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session.
      responses:
        "204":
          description: Session revoked.
        default:
          $ref: "#/components/responses/Problem"

  /auth/2fa/totp/setup:
    post:
      operationId: totpSetup
      description: >
        When the deployment delegates accounts to an external directory
        (`AGENTRY_AUTH_EXTERNAL_ONLY`, DEV-057), this endpoint answers 410 Gone;
        sign in through /auth/oidc/{provider}/start instead.
      tags: [auth]
      summary: Begin TOTP enrollment; returns the provisioning secret.
      responses:
        "200":
          description: Enrollment secret (confirm with /auth/2fa/totp/verify).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupResult"
        default:
          $ref: "#/components/responses/Problem"

  /auth/2fa/totp/verify:
    post:
      operationId: totpVerify
      description: >
        When the deployment delegates accounts to an external directory
        (`AGENTRY_AUTH_EXTERNAL_ONLY`, DEV-057), this endpoint answers 410 Gone;
        sign in through /auth/oidc/{provider}/start instead.
      tags: [auth]
      summary: Confirm TOTP enrollment with a current code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "204":
          description: TOTP enabled.
        default:
          $ref: "#/components/responses/Problem"

  /auth/2fa/totp/challenge:
    post:
      operationId: totpChallenge
      tags: [auth]
      summary: Complete a pending 2FA challenge and open the session (§12.1).
      description: >
        Second leg of a login that could not carry a TOTP code inline. Today
        the only such login is social login: its callback is a browser
        redirect. The challenge is opaque, single-use and expires in five
        minutes; it proves nothing on its own, so a valid TOTP code is still
        required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Problem"

  /auth/desktop/exchange:
    post:
      operationId: exchangeDesktopCode
      tags: [auth]
      summary: Exchange a desktop sign-in code for the PAT it granted.
      description: >
        Unauthenticated; the code is the credential. Single use, bound to the
        `state` nonce the desktop app generated, and valid for 60 seconds from
        the grant. The PAT is minted at this moment and returned exactly once,
        like `createToken`. Rate-limited with the login class (§19).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopExchangeRequest"
      responses:
        "201":
          description: Token minted; `token` appears only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatCreated"
        default:
          $ref: "#/components/responses/Problem"

  /auth/oidc/{provider}/start:
    get:
      operationId: socialOidcStart
      tags: [auth]
      summary: Begin social login with a configured provider (§12.1).
      description: >
        Individual-account login through a social identity provider
        (`google` = OIDC proper; `github` = an OAuth2 shim, since GitHub is
        not an OIDC issuer). Providers must be configured on the server
        (`AGENTRY_SOCIAL_<PROVIDER>_CLIENT_ID`/`_SECRET`); unconfigured
        providers return 404. This is individual login and never grants org
        membership. Org SSO lives under /orgs/{org}/sso (§12.4).
      security: []
      parameters:
        - $ref: "#/components/parameters/SocialProvider"
        - name: next
          in: query
          description: >
            Browser mode. An in-app, path-absolute return target (e.g.
            `/dashboard`). When present and valid, the callback answers the
            browser with a 303 to it instead of the JSON result, and a
            failed login 303s to `/login?error=…`. Anything that is not a
            single-slash path on this origin is ignored (open-redirect
            guard), which leaves the API behaviour unchanged.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint.
        default:
          $ref: "#/components/responses/Problem"

  /auth/oidc/{provider}/callback:
    get:
      operationId: socialOidcCallback
      tags: [auth]
      summary: "Social login redirect URI: establish a session (§12.1)."
      description: >
        Exchanges the code, verifies the identity, then links or JIT-creates
        an individual account (`identities.provider_kind='social'`).
        Auto-linking to an existing account happens only when the provider
        asserts a verified email that matches a verified account email
        (T-12); otherwise the response is 409 and the accounts must be linked
        explicitly. When the account has TOTP enabled the response is a
        pending 2FA challenge rather than a session. A login begun with
        `next` (browser mode) answers 303 to that in-app path once the
        session cookie is set, or to `/login?error=…` on failure; the JSON
        result is the API mode, used when `next` was absent.
      security: []
      parameters:
        - $ref: "#/components/parameters/SocialProvider"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Session established, or a pending TOTP challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialLoginResult"
        "303":
          description: Browser mode — session cookie set, redirect to `next`.
        "409":
          description: An account with this email exists; link it explicitly.
        default:
          $ref: "#/components/responses/Problem"

  /user:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: The authenticated user.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update profile fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 120
                cookieAck:
                  description: >
                    True records acceptance of the cookie notice on the account
                    (write-once timestamp; false is ignored).
                  type: boolean
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /user/delete:
    post:
      operationId: deleteCurrentUser
      tags: [users]
      summary: Erase the caller's account (GDPR flow, §12.7).
      description: >
        Purges personal data and pseudonymizes the account. Published public
        versions are never deleted (§12.7): they are either yanked, so
        already-installed copies keep verifying, or the personal-namespace
        agents are transferred to an organization the caller administers.
        When the account has published public versions the choice is
        explicit: omitting `publishedContent` is a 400, never a silent yank.
        When the deployment holds credentials in a directory service and is
        configured to reach it (`AGENTRY_IDP_ADMIN_URL`), the sign-in account
        there is deleted in the same step; the outcome is audited as
        `user.directory_erase`.
      parameters:
        - name: publishedContent
          in: query
          schema:
            type: string
            enum: [yank, transfer]
          description: >
            What to do with published public versions. Required when the
            account has any; ignored (and defaulted to yank) when it has none.
        - name: transferOrg
          in: query
          schema:
            type: string
            pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
          description: >
            Destination org handle, required with publishedContent=transfer.
            The caller must be an owner or admin of that org.
      responses:
        "204":
          description: Account erased; session revoked.
        default:
          $ref: "#/components/responses/Problem"

  /user/stars/{ns}/{name}:
    put:
      operationId: starAgent
      tags: [stars]
      summary: Star an agent (idempotent, §9.2).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "204":
          description: Starred (already-starred is also 204).
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unstarAgent
      tags: [stars]
      summary: Remove a star (idempotent, §9.2).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "204":
          description: Unstarred (not-starred is also 204).
        default:
          $ref: "#/components/responses/Problem"

  /users/{handle}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Public profile for a user handle.
      security: []
      parameters:
        - $ref: "#/components/parameters/Handle"
      responses:
        "200":
          description: Public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        default:
          $ref: "#/components/responses/Problem"

  /user/tokens:
    get:
      operationId: listTokens
      tags: [users]
      summary: List the caller's personal access tokens (metadata only).
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pat"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      tags: [users]
      summary: Mint a PAT. The secret is returned exactly once (D-22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created; `token` appears only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatCreated"
        default:
          $ref: "#/components/responses/Problem"

  /user/tokens/desktop-grant:
    post:
      operationId: createDesktopGrant
      tags: [users]
      summary: Record a one-time grant for the desktop app's browser sign-in.
      description: >
        Session-only. The web tier's authorize page calls this after the user
        consents; the response is a short-lived, single-use `code` bound to the
        app's `state` nonce. No token is minted here — the desktop app
        exchanges the code at `POST /auth/desktop/exchange` from its own
        process, so the PAT never travels in a URL (DEV-058 hardening,
        agentry#19). The grant's scopes are fixed to the desktop set
        (agent:read, agent:publish, repo:read, repo:write, user:profile).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopGrantRequest"
      responses:
        "201":
          description: Grant recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopGrant"
        default:
          $ref: "#/components/responses/Problem"

  /user/tokens/{tokenId}:
    delete:
      operationId: revokeToken
      tags: [users]
      summary: Revoke a PAT immediately (§12.3).
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /user/sessions:
    get:
      operationId: listUserSessions
      tags: [users]
      summary: List the caller's active browser sessions (§12.1).
      description: >
        Sessions are cookie sessions. A PAT-authenticated caller has no
        sessions of its own, so the list is empty (200, not an error).
        A PAT is not a way to enumerate someone's browser sessions.
      responses:
        "200":
          description: Active, unexpired, unrevoked sessions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeOtherUserSessions
      tags: [users]
      summary: Revoke every session except the calling one ("sign out everywhere else").
      description: >
        The calling session survives, so the caller is not logged out of the
        browser they are using. Session-only: a PAT cannot revoke sessions
        (403), for the same reason it cannot list them.
      responses:
        "204":
          description: Other sessions revoked.
        default:
          $ref: "#/components/responses/Problem"

  /user/sessions/{sessionId}:
    delete:
      operationId: revokeUserSession
      tags: [users]
      summary: Revoke one of the caller's own sessions (§12.1).
      description: >
        Own sessions only. An id that is not one of the caller's live
        sessions answers 404 whether it does not exist or belongs to
        somebody else. The two are deliberately indistinguishable.
        Session-only: a PAT cannot revoke sessions (403).
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /ruleset-releases/latest/bundle:
    get:
      operationId: getLatestRulesetBundle
      tags: [meta]
      summary: The newest published S3/S4 rule bundle, for `agentry validate --rules-update`.
      description: >
        Returns the deployment's rule bundle as an uncompressed tar of the
        bundle directory (`bundle.yaml` plus the family YAML files), exactly
        the bytes `pkg/rules.LoadBundle` reads. The advertised identity
        travels in headers so a client can check what it got without
        unpacking first:


        `X-Agentry-Bundle-Semver`: the ruleset release semver;
        `X-Agentry-Bundle-Digest`: the `sha256:<hex>` content digest
        recorded on the `ruleset_releases` row; `ETag`: the same digest.


        The digest is the pin: a client MUST recompute it over the received
        bundle and refuse a mismatch. Bundle-level *signatures* do not exist
        yet (see DEVIATIONS DEV-024); this endpoint pins by digest only.
      security: []
      responses:
        "200":
          description: The rule bundle as a tar archive.
          headers:
            X-Agentry-Bundle-Semver:
              schema:
                type: string
              description: Ruleset release semver.
            X-Agentry-Bundle-Digest:
              schema:
                type: string
              description: "sha256:<hex> content digest of the bundle."
            ETag:
              schema:
                type: string
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /ruleset-releases/latest/attestation:
    get:
      operationId: getLatestRulesetAttestation
      tags: [platform]
      summary: DSSE attestation over the bundle `…/latest/bundle` serves.
      description: >
        An in-toto statement (predicate `https://agentry.dev/attestation/ruleset/v1`)
        whose subject digest is the bundle's content digest, signed with the
        registry's release-signing key (`/.well-known/agentry/signing-keys.json`).
        Lets `agentry validate --rules-update` verify a fetched bundle by
        signature rather than only by the digest the same server advertised
        (agentry#25). 404 when the registry does not sign (`signing.kind: none`).
      security: []
      responses:
        "200":
          description: The DSSE envelope (application/json).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /orgs:
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create an organization; caller becomes owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}:
    get:
      operationId: getOrg
      tags: [orgs]
      summary: Organization profile (public fields; settings for admins).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOrg
      tags: [orgs]
      summary: Update org settings (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 120
                ssoRequired:
                  type: boolean
                  description: Enforce SSO for org resources (§12.4). Owner only.
      responses:
        "200":
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/members:
    get:
      operationId: listOrgMembers
      tags: [orgs]
      summary: List members with roles (members can view).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/members/{handle}:
    put:
      operationId: setOrgMember
      tags: [orgs]
      summary: Add a member or change a role (admin+; owner grants owner/admin).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/Handle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/OrgRole"
      responses:
        "200":
          description: Membership set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeOrgMember
      tags: [orgs]
      summary: Remove a member (admin+; owners removable only by owners).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/Handle"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/teams:
    get:
      operationId: listTeams
      tags: [orgs]
      summary: List teams (members can view).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Teams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTeam
      tags: [orgs]
      summary: Create a team (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
