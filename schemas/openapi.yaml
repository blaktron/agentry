  /agents:
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an agent and its hosted git repository (§9.2).
      description: >
        A private agent counts against the namespace's private-agent cap
        when the deployment's entitlements set one (the hosted product's
        subscription tiers): at the cap the answer is `422` with the problem
        type `private-agent-cap`, and the same on `PATCH` when an agent is
        turned private. A core registry caps nothing. A cap never deletes
        or hides an agent that is already private.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "422":
          description: >-
            Validation, or `private-agent-cap` when the namespace holds as
            many private agents as its tier allows (a core registry caps
            nothing).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents in a namespace (public ones for everyone).
      security: []
      parameters:
        - name: namespace
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Agent metadata (public agents readable by anyone).
      description: >-
        A public agent is readable by anyone. A private agent is readable by
        its owner, the owning org's admins, and anyone holding a
        grant on it; every other caller, anonymous included, gets the 404 a
        missing name gets — never a 401 or 403 that would confirm the name
        exists. The same rule holds on every route under `/agents/{ns}/{name}`
        (agentry#313).
      security: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update agent settings (maintain).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                  maxLength: 140
                visibility:
                  type: string
                  enum: [public, private]
                autoPublishTags:
                  type: boolean
                allowForcePush:
                  description: >
                    Allow non-fast-forward pushes to the default branch
                    (§6.3). Off by default; maintain only.
                  type: boolean
                pipelineSkip:
                  description: >-
                    Admit submissions to this agent without a scan (plan
                    organization-subscriptions §4, D16). Settable by the
                    namespace's administrators on a private agent of an
                    organization's whose subscription includes unscanned
                    agents; refused on a public agent
                    (`pipeline-skip-public`) and in a personal namespace
                    (`pipeline-skip-personal`), and with
                    `feature-not-included` where the tier lacks it. While
                    it is set, and while a version published unscanned
                    stands, the agent cannot be made public
                    (`agent-unscanned`). Clearing it changes nothing
                    already published; the next submission goes through
                    the whole pipeline.
                  type: boolean
                modes:
                  description: >
                    Replace the run modes the agent advertises (maintain
                    only). Published versions keep the modes their own
                    manifests declare.
                  $ref: "#/components/schemas/AgentModes"
      responses:
        "200":
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent that was never published (maintain, §9.2).
      description: >
        Deletes the agent and its hosted repository. Refused (409) once the
        agent has any version row, because §4.3 forbids deleting version rows:
        a version past `submitted` is history consumers may depend on, and a
        version still at `submitted` is mid-pipeline. Published agents are
        yanked or blocked, never deleted.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "204":
          description: Deleted.
        "409":
          description: The agent has versions, advisories, or abuse reports.
        default:
          $ref: "#/components/responses/Problem"

  /agents/{ns}/{name}/stats:
