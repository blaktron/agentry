# Agentry public REST API: spec-first contract (PLAN D-09, §9).
# This file is the source of truth; server stubs and clients are generated
# from it (make generate). Changes within /api/v1 must be additive; the CI
# oasdiff gate enforces it. Document version 3.0.3 per DEVIATIONS.md DEV-002.
openapi: 3.0.3
info:
  title: Agentry API
  description: >
    Public REST API for the Agentry registry: agents, versions,
    publishing, scanning reports, orgs, and enterprise administration. Errors
    follow RFC 9457 (application/problem+json).


    Pagination (§9.1): list endpoints take `?cursor=&limit=` with an opaque
    cursor and return the next page as a `Link: <…>; rel="next"` header
    (cursor-carrying bodies keep `nextCursor` too). A `limit` outside the
    documented bounds is clamped, never rejected.


    Rate limits (§19) are reported on every rate-limited response with
    `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`
    (plus `Retry-After` on 429); an extension's signed-callback route that
    opts out of the anonymous class carries none.


    Compatibility: 0.3.0 broke the additive-only rule once, deliberately
    (DEV-088, 2026-09-05): the `kind` classification (skill | prompt-agent |
    mcp-server) was replaced by `modes`, the set of run modes a release
    supports (autonomous | interactive); `?kind=` became `?mode=` and the
    `kind` facet became `mode`. There were no external consumers before the
    beta. The rule is additive again from 0.3.0.


    Idempotency (§9.1): mutating POSTs accept an `Idempotency-Key` request
    header (≤255 chars). The first request under a key executes and its
    response is recorded. A retry with the same key, user, endpoint, and
    body replays that recorded response verbatim. Reusing a key with a
    *different* body is a 409. Keys are scoped per user and endpoint and
    expire after 24 hours. Endpoints that honour the header: `POST /orgs`,
    `POST /orgs/{org}/webhooks`, `POST /orgs/{org}/webhooks/{id}/ping`,
    `POST /platform/ruleset-releases`,
    `POST /agents/{ns}/{name}/versions`.
  version: 0.3.0
  license:
    name: MIT
    url: https://github.com/blaktron/agentry/blob/main/LICENSE
servers:
  - url: /api/v1
tags:
  - name: meta
    description: Server metadata and feature discovery.
  - name: auth
    description: >-
      Registration, login, sessions, 2FA (§12.1); sign-in through the
      directory service (DEV-057) and the desktop app's one-time-code
      exchange (DEV-058).
  - name: users
    description: >-
      Current user, public profiles, personal access tokens, SSH keys,
      browser sessions, and the account's directory-service settings
      (DEV-089).
  - name: orgs
    description: Organizations, members, teams (§12.2).
  - name: audit
    description: Org audit log (§12.6).
  - name: agents
    description: Agents, hosted repos, per-agent grants (§9.2).
  - name: search
    description: Full-text search and facets for discovery (§10.4).
  - name: versions
    description: Version submission, resolution, downloads (§7, §9.4).
  - name: reviews
    description: Review queue and finding verdicts (§8.5, §8.6).
  - name: policies
    description: Platform baseline and org policy overlays (§8.6).
  - name: platform
    description: Trust & safety actions and advisories (§7, §8.7).
  - name: sso
    description: "Enterprise SSO: SAML 2.0 SP and OIDC RP (§12.4)."
  - name: scim
    description: SCIM 2.0 provisioning tokens (§12.5).
  - name: webhooks
    description: Org webhook endpoints and deliveries (§9.3).
  - name: domains
    description: >-
      Domain verification (§12.4). A verified domain is what an
      organization proves it controls, and three things rest on it: linking
      an SSO identity to an existing member's account for the first time,
      mailing an invitation to an address there, and treating that address
      as confirmed when its invitation is accepted.
  - name: mcp-servers
    description: >-
      The registry of scanned MCP server package versions S7 keeps and the
      daily sweep refreshes (agentry#177).
  - name: stars
    description: Stars and per-agent counters (§9.2).
  - name: installs
    description: >-
      Account installs (agentry#448): a signed-in person's record of a
      BriefAgent release they accepted for their account and the contract
      they consented to. Not a star, not the desktop's or the CLI's
      per-machine record; no download counter moves.
  - name: knowledge
    description: >-
      Knowledge packs (agentry#593): an account's packs kept in the
      registry, sealed under data keys of their own, scanned on arrival,
      and the wrap and unwrap of their data keys.
  - name: model-input
    description: >-
      AI Review of text a model is about to read, and web search brokered
      by the registry (agentry#608; plan builder-rework.md D20–D24). The
      caller pushes the text; the registry asks the deployment's judge
      with the model-input question set and keeps the keys. Open to
      platform staff by session and, where an extension admits them, to
      hosted jobs by their job credential; never to an ordinary account's
      token, since the routes spend the deployment's own judge and search
      keys.

paths:
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Server version and self-host feature flags (§9.2).
      security: []
      responses:
        "200":
          description: Server metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an individual account (email+password, §12.1).
      description: >
        When the deployment delegates accounts to an external directory
        (`AGENTRY_AUTH_EXTERNAL_ONLY`, DEV-057), this endpoint answers 410 Gone;
        sign in through /auth/oidc/{provider}/start instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; verification email queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      description: >
        When the deployment delegates accounts to an external directory
        (`AGENTRY_AUTH_EXTERNAL_ONLY`, DEV-057), this endpoint answers 410 Gone;
        sign in through /auth/oidc/{provider}/start instead.
      tags: [auth]
      summary: Confirm an email address with the mailed token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: Email verified.
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      description: >
        When the deployment delegates accounts to an external directory
        (`AGENTRY_AUTH_EXTERNAL_ONLY`, DEV-057), this endpoint answers 410 Gone;
        sign in through /auth/oidc/{provider}/start instead.
      tags: [auth]
      summary: Password (+TOTP when enabled) login; sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established. The response sets the
            `agentry_session` cookie; `csrfToken` must be echoed in the
            `X-Agentry-CSRF` header on all cookie-authenticated mutations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session.
      description: >-
        Answers 204 for a native or OIDC session. For a session established
        through an organization's SAML connection whose IdP publishes a
        Single Logout endpoint, answers 200 with the IdP logout URL the
        browser should be sent to next (SP-initiated SLO, §12.4); the
        registry session is revoked either way.
      responses:
        "204":
          description: Session revoked.
        "200":
          description: Session revoked; continue the logout at the IdP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
        default:
          $ref: "#/components/responses/Problem"

  /auth/2fa/totp/setup:
    post:
      operationId: totpSetup
      description: >
        When the deployment delegates accounts to an external directory
        (`AGENTRY_AUTH_EXTERNAL_ONLY`, DEV-057), this endpoint answers 410 Gone;
        sign in through /auth/oidc/{provider}/start instead.
      tags: [auth]
      summary: Begin TOTP enrollment; returns the provisioning secret.
      responses:
        "200":
          description: Enrollment secret (confirm with /auth/2fa/totp/verify).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupResult"
        default:
          $ref: "#/components/responses/Problem"

  /auth/2fa/totp/verify:
    post:
      operationId: totpVerify
      description: >
        When the deployment delegates accounts to an external directory
        (`AGENTRY_AUTH_EXTERNAL_ONLY`, DEV-057), this endpoint answers 410 Gone;
        sign in through /auth/oidc/{provider}/start instead.
      tags: [auth]
      summary: Confirm TOTP enrollment with a current code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "204":
          description: TOTP enabled.
        default:
          $ref: "#/components/responses/Problem"

  /auth/2fa/totp/challenge:
    post:
      operationId: totpChallenge
      tags: [auth]
      summary: Complete a pending 2FA challenge and open the session (§12.1).
      description: >
        Second leg of a login that could not carry a TOTP code inline. Today
        the only such login is social login: its callback is a browser
        redirect. The challenge is opaque, single-use and expires in five
        minutes; it proves nothing on its own, so a valid TOTP code is still
        required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Problem"

  /auth/desktop/exchange:
    post:
      operationId: exchangeDesktopCode
      tags: [auth]
      summary: Exchange a desktop sign-in code for the PAT it granted.
      description: >
        Unauthenticated; the code is the credential. Single use, bound to the
        `state` nonce the desktop app generated, and valid for 60 seconds from
        the grant. The PAT is minted at this moment and returned exactly once,
        like `createToken`. Rate-limited with the login class (§19).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopExchangeRequest"
      responses:
        "201":
          description: Token minted; `token` appears only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatCreated"
        default:
          $ref: "#/components/responses/Problem"

  /auth/oidc/{provider}/start:
    get:
      operationId: socialOidcStart
      tags: [auth]
      summary: Begin social login with a configured provider (§12.1).
      description: >
        Individual-account login through a social identity provider
        (`google` = OIDC proper; `github` = an OAuth2 shim, since GitHub is
        not an OIDC issuer). Providers must be configured on the server
        (`AGENTRY_SOCIAL_<PROVIDER>_CLIENT_ID`/`_SECRET`); unconfigured
        providers return 404. This is individual login and never grants org
        membership. Org SSO lives under /orgs/{org}/sso (§12.4).
      security: []
      parameters:
        - $ref: "#/components/parameters/SocialProvider"
        - name: next
          in: query
          description: >
            Browser mode. An in-app, path-absolute return target (e.g.
            `/dashboard` on the site, `/ui/account` on the server's own
            pages). When present and valid, the callback answers the
            browser with a 303 to it instead of the JSON result, and a
            failed login 303s to the sign-in page with `?error=…` (the
            site's `/login`, or `/ui/login`). Anything that is not a
            single-slash path on this origin is ignored (open-redirect
            guard), which leaves the API behaviour unchanged.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint.
        default:
          $ref: "#/components/responses/Problem"

  /auth/oidc/{provider}/callback:
    get:
      operationId: socialOidcCallback
      tags: [auth]
      summary: "Social login redirect URI: establish a session (§12.1)."
      description: >
        Exchanges the code, verifies the identity, then links or JIT-creates
        an individual account (`identities.provider_kind='social'`).
        Auto-linking to an existing account happens only when the provider
        asserts a verified email that matches a verified account email
        (T-12); otherwise the response is 409 and the accounts must be linked
        explicitly. When the account has TOTP enabled the response is a
        pending 2FA challenge rather than a session. A login begun with
        `next` (browser mode) answers 303 to that in-app path once the
        session cookie is set, or to `/login?error=…` on failure; the JSON
        result is the API mode, used when `next` was absent.
      security: []
      parameters:
        - $ref: "#/components/parameters/SocialProvider"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Session established, or a pending TOTP challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialLoginResult"
        "303":
          description: Browser mode — session cookie set, redirect to `next`.
        "409":
          description: An account with this email exists; link it explicitly.
        default:
          $ref: "#/components/responses/Problem"

  /user:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: The authenticated user.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update profile fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 120
                cookieAck:
                  description: >
                    True records acceptance of the cookie notice on the account
                    (write-once timestamp; false is ignored).
                  type: boolean
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /user/delete:
    post:
      operationId: deleteCurrentUser
      tags: [users]
      summary: Erase the caller's account (GDPR flow, §12.7).
      description: >
        Purges personal data and pseudonymizes the account. Published public
        versions are never deleted (§12.7): they are either yanked, so
        already-installed copies keep verifying, or the personal-namespace
        agents are transferred to an organization the caller administers.
        When the account has published public versions the choice is
        explicit: omitting `publishedContent` is a 400, never a silent yank.
        When the deployment holds credentials in a directory service and is
        configured to reach it (`AGENTRY_IDP_ADMIN_URL`), the sign-in account
        there is deleted in the same step; the outcome is audited as
        `user.directory_erase` and returned in the `X-Agentry-Directory-Erasure`
        header. A failed
        directory attempt does not undo the registry's erasure: it is retried
        by a job with backoff (each attempt audited) and the response says
        `pending`; a retry budget that runs out is audited as `abandoned` and
        raised to the operator. An account that is an organization's last
        admin is refused (409 last-admin) until another admin is in
        place; a transfer that would put the organization over its
        private-agent cap is refused (422 private-agent-cap) with nothing
        erased. The erased account's memberships go with it.
      parameters:
        - name: publishedContent
          in: query
          schema:
            type: string
            enum: [yank, transfer]
          description: >
            What to do with published public versions. Required when the
            account has any; ignored (and defaulted to yank) when it has none.
        - name: transferOrg
          in: query
          schema:
            type: string
            pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?$"
          description: >
            Destination org handle, required with publishedContent=transfer.
            The caller must be an admin of that org.
      responses:
        "204":
          description: Account erased; session revoked.
          headers:
            X-Agentry-Directory-Erasure:
              description: >
                The directory half of the erasure (agentry#499). `deleted`:
                the sign-in account at the directory is gone. `not-found`:
                the directory holds no account with this address.
                `not-configured`: the deployment reaches no directory, so
                erasure is registry-only. `pending`: the directory could not
                be reached; a job retries it with backoff for about four and
                a half hours, and the operator is alerted if it never
                succeeds. `failed`: the retry could not be queued; the
                operator is alerted and finishes it by hand.
              schema:
                type: string
                enum: [deleted, not-found, not-configured, pending, failed]
        default:
          $ref: "#/components/responses/Problem"

  /user/clear-data:
    post:
      operationId: clearCurrentUserData
      tags: [users]
      summary: Clear the caller's credentials, installs and settings, and keep the account (session only).
      description: >
        Revokes every personal access token and SSH key, deletes every
        remembered browser (the ones that skip the second factor), consumes
        every pending desktop sign-in code, ends every session but the
        caller's, removes every account install, and resets the display name
        and the notification settings to their defaults (every switch on; mail
        still goes only to a verified address). The account itself stays: the
        handle, the email, the sign-in account at the directory, organization
        memberships, BriefAgents with their versions and repositories, stars,
        the subscription and credits are untouched. Audited as
        `user.data_clear` with the count of each class; after the commit an
        extension event `user.data_cleared` carries the user id, so an
        extension clears what it holds for the account (hosted run history).
        Session only: a token is refused, and so is a request without the
        session's CSRF token.
      responses:
        "204":
          description: Cleared; the caller's session is still signed in.
        default:
          $ref: "#/components/responses/Problem"

  /user/domain-org:
    get:
      operationId: getDomainOrg
      tags: [users]
      summary: >
        Which organization the caller's verified email domain belongs to.
        403 email-unverified until the address is verified.
      responses:
        "200":
          description: The domain and, when one holds it, the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainOrg"
        default:
          $ref: "#/components/responses/Problem"

  /user/domain-org/request-access:
    post:
      operationId: requestDomainOrgAccess
      tags: [users]
      summary: >
        Ask the administrators of the organization that holds the caller's
        email domain to add them (session only). Mails the admins, once a
        day per person (429 rate-limited afterwards), audited as
        `org.access_request`. 404 when no organization holds the domain;
        409 when the caller is already a member there.
      responses:
        "202":
          description: The request was recorded and the admins mailed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequestResult"
        default:
          $ref: "#/components/responses/Problem"

  /user/stars/{ns}/{name}:
    put:
      operationId: starAgent
      tags: [stars]
      summary: Star an agent (idempotent, §9.2).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "204":
          description: Starred (already-starred is also 204).
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unstarAgent
      tags: [stars]
      summary: Remove a star (idempotent, §9.2).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "204":
          description: Unstarred (not-starred is also 204).
        default:
          $ref: "#/components/responses/Problem"

  /user/installs:
    get:
      operationId: listAccountInstalls
      tags: [installs]
      summary: The caller's account installs, composed for a list.
      description: >-
        Every record the caller holds, newest change first. A record whose
        BriefAgent the caller can no longer read — made private to them,
        its organization suspended — is listed as the bare `ref` with
        `readable: false` and nothing else, so the list tells a former
        reader nothing they did not already know. A PAT needs
        `user:profile`.
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountInstall"
        default:
          $ref: "#/components/responses/Problem"

  /user/installs/{ns}/{name}:
    put:
      operationId: putAccountInstall
      tags: [installs]
      summary: Record a BriefAgent release as installed to the account, or move the record to another version.
      description: >-
        The version must be a published release the caller can read: a
        non-reader gets the missing name's 404, an unpublished version `409
        version-not-published`, a blocked BriefAgent `410 blocked`. The
        request carries the acceptances the release needs and is refused
        with `409 install-consent-required`, naming the missing ones in
        `missing`, when it lacks any: `capabilities` on a first install and,
        on an update, when the new version's declared capabilities widened
        against the accepted snapshot (`widened` lists what did); `unsigned`
        whenever the release carries no attestation; `unscanned` whenever it
        was admitted without a scan. A PUT on an existing record is the
        update, to any published version, an older one included: the
        version moves and the snapshot follows it. The action is
        audited as `agent.install`; no download counter moves. A PAT needs
        `user:profile`, and `agent:read` for a private BriefAgent.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInstallRequest"
      responses:
        "200":
          description: The record, composed as the list composes it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInstall"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAccountInstall
      tags: [installs]
      summary: Remove the caller's record for a BriefAgent (idempotent).
      description: >-
        204 whether or not a record existed, and whether or not the name
        resolves: the row is the caller's own, so no BriefAgent is read and
        nothing is learned about one — a record whose BriefAgent the caller
        can no longer read is removed by the ref the list shows for it.
        Audited as `agent.uninstall` when a record went. A PAT needs
        `user:profile`.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/AgentName"
      responses:
        "204":
          description: Removed, or nothing to remove.
        default:
          $ref: "#/components/responses/Problem"

  /users/{handle}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Public profile for a user handle.
      security: []
      parameters:
        - $ref: "#/components/parameters/Handle"
      responses:
        "200":
          description: Public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "404":
          description: >-
            No active account holds this handle. Only that: a lookup that
            failed answers 500, so a client may take this as absence.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The lookup failed; the handle may or may not exist. Retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /user/tokens:
    get:
      operationId: listTokens
      tags: [users]
      summary: List the caller's personal access tokens (metadata only).
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pat"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      tags: [users]
      summary: Mint a PAT. The secret is returned exactly once (D-22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created; `token` appears only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatCreated"
        default:
          $ref: "#/components/responses/Problem"

  /user/ssh-keys:
    get:
      operationId: listSshKeys
      tags: [users]
      summary: List the caller's SSH public keys for the git transport (§6.1 Q7).
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SshKey"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addSshKey
      tags: [users]
      summary: Register an SSH public key for ssh://git@…/{ns}/{name}.git (session-only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSshKeyRequest"
      responses:
        "201":
          description: Key registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKey"
        default:
          $ref: "#/components/responses/Problem"

  /user/ssh-keys/{keyId}:
    delete:
      operationId: removeSshKey
      tags: [users]
      summary: Remove an SSH public key (session-only).
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Key removed.
        default:
          $ref: "#/components/responses/Problem"

  /user/notifications:
    get:
      operationId: getUserNotificationSettings
      tags: [users]
      summary: How the registry's alerts reach the caller (agentry#190).
      description: >-
        Email per kind of notification, and whether the dependency-alert
        banner shows in a front end (the site reads it). An account that
        never changed anything reads back with everything on.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateUserNotificationSettings
      tags: [users]
      summary: Replace the caller's notification settings (agentry#190).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettings"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        default:
          $ref: "#/components/responses/Problem"
  /user/activity:
    get:
      operationId: listUserActivity
      tags: [users]
      summary: The caller's own activity — the audit events they performed (agentry#192).
      description: >-
        Sign-ins, tokens and SSH keys created or revoked, profile and
        notification changes, publishes and reviews, newest first, with the
        address and user agent each was performed from. Keyset-paged like
        the agent activity feed.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        default:
          $ref: "#/components/responses/Problem"
  /user/dependency-alerts:
    get:
      operationId: listUserDependencyAlerts
      tags: [users]
      summary: Open dependency alerts on published versions the caller submitted (agentry#177).
      description: >-
        A dependency alert says a published version declares an MCP server
        version that the daily sweep found to carry a newly known high or
        critical vulnerability. It closes on its own when the version is
        yanked, quarantined or blocked, or when the advisory is withdrawn;
        publishing a fixed version does not close the old version's alert.
        A front end shows these; the site renders them as the banner after
        sign-in and on the dashboard.
      responses:
        "200":
          description: Open alerts, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DependencyAlert"
        default:
          $ref: "#/components/responses/Problem"
  /user/tokens/desktop-grant:
    post:
      operationId: createDesktopGrant
      tags: [users]
      summary: Record a one-time grant for the desktop app's browser sign-in.
      description: >
        Session-only. The server's own `/ui/authorize` page (DR-17) calls this after the user
        consents; the response is a short-lived, single-use `code` bound to the
        app's `state` nonce. No token is minted here — the desktop app
        exchanges the code at `POST /auth/desktop/exchange` from its own
        process, so the PAT never travels in a URL (DEV-058 hardening,
        agentry#19). The grant's scopes are fixed to the desktop set
        (agent:read, agent:publish, repo:read, repo:write, user:profile, run:read, run:write).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopGrantRequest"
      responses:
        "201":
          description: Grant recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopGrant"
        default:
          $ref: "#/components/responses/Problem"

  /user/tokens/{tokenId}:
    delete:
      operationId: revokeToken
      tags: [users]
      summary: Revoke a PAT immediately (§12.3).
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /user/directory:
    get:
      operationId: getUserDirectory
      tags: [users]
      summary: Where the caller manages password, MFA and profile when a directory service owns the account (DEV-057).
      description: >
        With auth.externalOnly, credentials live in the directory service
        (Authentik). This answers the settings page's question "where do I
        change my password or add an authenticator?" with the directory's
        flow URLs, and lists the caller's enrolled authenticator devices
        when the server has directory admin access (auth.idpAdminURL).
        Without a directory, `managed` is false and the rest is absent.
      responses:
        "200":
          description: Directory account links and devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDirectory"
        default:
          $ref: "#/components/responses/Problem"
  /user/directory/devices/{kind}/{deviceId}:
    delete:
      operationId: deleteUserDirectoryDevice
      tags: [users]
      summary: Remove one of the caller's own authenticators from the directory service (agentry#164).
      description: >
        With auth.externalOnly and directory admin access, removes the
        caller's authenticator device of this kind and id through the
        directory's admin API, so the settings page manages MFA without
        ever showing the directory's own panel. The device must be on the
        caller's own account: an id that is somebody else's answers 404
        exactly like a missing one. 404 when the server has no directory
        admin access; 502 when the directory did not answer.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [totp, webauthn, static, duo, sms, email]
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"
  /user/sessions:
    get:
      operationId: listUserSessions
      tags: [users]
      summary: List the caller's active browser sessions (§12.1).
      description: >
        Sessions are cookie sessions. A PAT-authenticated caller has no
        sessions of its own, so the list is empty (200, not an error).
        A PAT is not a way to enumerate someone's browser sessions.
      responses:
        "200":
          description: Active, unexpired, unrevoked sessions, most recently seen first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeOtherUserSessions
      tags: [users]
      summary: Revoke every session except the calling one ("sign out everywhere else").
      description: >
        The calling session survives, so the caller is not logged out of the
        browser they are using. Session-only: a PAT cannot revoke sessions
        (403), for the same reason it cannot list them.
      responses:
        "204":
          description: Other sessions revoked.
        default:
          $ref: "#/components/responses/Problem"

  /user/sessions/{sessionId}:
    delete:
      operationId: revokeUserSession
      tags: [users]
      summary: Revoke one of the caller's own sessions (§12.1).
      description: >
        Own sessions only. An id that is not one of the caller's live
        sessions answers 404 whether it does not exist or belongs to
        somebody else. The two are deliberately indistinguishable.
        Session-only: a PAT cannot revoke sessions (403).
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /ruleset-releases/latest/bundle:
    get:
      operationId: getLatestRulesetBundle
      tags: [meta]
      summary: The newest published S3/S4 rule bundle, for `agentry validate --rules-update`.
      description: >
        Returns the deployment's rule bundle as an uncompressed tar of the
        bundle directory (`bundle.yaml` plus the family YAML files), exactly
        the bytes `pkg/rules.LoadBundle` reads. The advertised identity
        travels in headers so a client can check what it got without
        unpacking first:


        `X-Agentry-Bundle-Semver`: the ruleset release semver;
        `X-Agentry-Bundle-Digest`: the `sha256:<hex>` content digest
        recorded on the `ruleset_releases` row; `ETag`: the same digest.


        The digest is the pin: a client MUST recompute it over the received
        bundle and refuse a mismatch. Bundle-level *signatures* do not exist
        yet (see DEVIATIONS DEV-024); this endpoint pins by digest only.
      security: []
      responses:
        "200":
          description: The rule bundle as a tar archive.
          headers:
            X-Agentry-Bundle-Semver:
              schema:
                type: string
              description: Ruleset release semver.
            X-Agentry-Bundle-Digest:
              schema:
                type: string
              description: "sha256:<hex> content digest of the bundle."
            ETag:
              schema:
                type: string
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /ruleset-releases/latest/attestation:
    get:
      operationId: getLatestRulesetAttestation
      tags: [platform]
      summary: DSSE attestation over the bundle `…/latest/bundle` serves.
      description: >
        An in-toto statement (predicate `https://agentry.dev/attestation/ruleset/v1`)
        whose subject digest is the bundle's content digest, signed with the
        registry's release-signing key (`/.well-known/agentry/signing-keys.json`).
        Lets `agentry validate --rules-update` verify a fetched bundle by
        signature rather than only by the digest the same server advertised
        (agentry#25). The worker signs it at start and stores it, so every
        replica serves the same envelope (agentry#479). 404 when the registry
        does not sign (`signing.kind: none`), or when no process holding the
        signing key has started with this bundle yet (a rolling deploy).
      security: []
      responses:
        "200":
          description: The DSSE envelope (application/json).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"

  /orgs:
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create an organization; the caller becomes its first admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}:
    get:
      operationId: getOrg
      tags: [orgs]
      summary: Organization profile (public fields; settings for admins).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "404":
          description: >-
            No active organisation holds this handle. Only that: a lookup that
            failed answers 500, so a client may take this as absence.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The lookup failed; the handle may or may not exist. Retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOrg
      tags: [orgs]
      summary: Update org settings (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 120
                ssoRequired:
                  type: boolean
                  description: Enforce SSO for org resources (§12.4). Admin only.
      responses:
        "200":
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/decommission:
    post:
      operationId: decommissionOrg
      tags: [orgs]
      summary: >
        Decommission the organization (admin; session only). It enters a
        read-only hold — members keep read and export — and at the end of
        the hold its agents, repositories, blobs and invitations are
        erased, its handle and domain released. The body must repeat the
        organization's handle. The last admin goes with it: this is the
        one way an organization loses its last admin (409 last-admin
        everywhere else).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: The organization's handle, typed again.
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: The organization, now decommissioning, with when the hold ends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "409":
          description: The organization is not active, or `confirm` is not its handle (422).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/suspend:
    post:
      operationId: suspendOrg
      tags: [orgs]
      summary: >
        Suspend the organization (platform staff). It and everything under
        it answer 404 to everyone, over the API and over git, until it is
        reinstated. Nothing is deleted.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: The organization, now suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/reinstate:
    post:
      operationId: reinstateOrg
      tags: [orgs]
      summary: >
        Reinstate a suspended organization, or cancel a decommission hold
        before its erasure runs (platform staff). An organization already
        erased cannot come back (409).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: The organization, active again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/logo:
    get:
      operationId: getOrgLogo
      tags: [orgs]
      summary: The organization's logo, as this registry re-encoded it.
      description: >
        A raster the core decoded and encoded again from the pixels: the
        bytes an admin uploaded are never what is served (§10.3). The type
        is pinned and not sniffed. The URL an organization's resource
        carries (`logoUrl`) names the content by its `v`, and that URL is
        served as immutable for a year; the bare path, or one whose `v` is
        no longer the logo served, answers the current logo with
        `no-cache`. Clients render `logoUrl` as given and never build the
        path. 404 when the organization has none, or is not one the
        caller may see.
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: The logo.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putOrgLogo
      tags: [orgs]
      summary: Set the organization's logo (admin; the subscription must include branding).
      description: >
        Multipart, one part named `file`: PNG or JPEG, at most 256 KB.
        Anything else is 415 `unsupported-image` — SVG in particular, for
        which this registry has no sanitiser. Over the cap, over 16
        million pixels, or larger re-encoded than a logo may be, is 413
        `upload-too-large`. The core decodes it and encodes it again; the
        pixels are kept, the bytes are not. Replaces any logo the
        organization had. 403 `feature-not-included` while the
        subscription does not include branding.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The logo is set.
          content:
            application/json:
              schema:
                type: object
                required: [logoUrl]
                properties:
                  logoUrl:
                    type: string
                    description: Where the logo is served, versioned by its content.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteOrgLogo
      tags: [orgs]
      summary: Remove the organization's logo (admin).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "204":
          description: Removed, or there was none.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/members:
    get:
      operationId: listOrgMembers
      tags: [orgs]
      summary: List members with roles (members can view).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/members/{handle}:
    put:
      operationId: setOrgMember
      tags: [orgs]
      summary: >
        Change a member's role (admin). Adding is retired: an organization
        is joined by accepting an invitation, or by an admin approving
        someone the IdP provisioned, and a PUT for a handle that holds no
        membership answers 422 naming those doors.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/Handle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/OrgRoleAssignment"
      responses:
        "200":
          description: Membership set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeOrgMember
      tags: [orgs]
      summary: >
        Remove a member (admin), or leave: any active member may remove
        themselves, since a person belongs to one organization at a time
        and must be able to leave it. Removing a pending member is how an
        admin declines them; the last admin cannot be removed or leave
        (409 last-admin) — only a decommission removes them.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/Handle"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/members/{handle}/approve:
    post:
      operationId: approveOrgMember
      tags: [orgs]
      summary: >
        Approve a pending member (admin). The seat check fires here: a
        person provisioned by SCIM, or folded in from the organization's
        domain, holds no seat until an admin approves them.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/Handle"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/OrgRoleAssignment"
      responses:
        "200":
          description: Approved; the membership is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/members/{handle}/decline:
    post:
      operationId: declineOrgMember
      tags: [orgs]
      summary: >
        Decline a pending member (admin): the pending membership is
        removed and no seat is consumed. An active member is removed with
        DELETE instead.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - $ref: "#/components/parameters/Handle"
      responses:
        "204":
          description: Declined.
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/invitations:
    get:
      operationId: listInvitations
      tags: [orgs]
      summary: List the organization's open invitations (admin).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Open invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvitation
      tags: [orgs]
      summary: >
        Invite someone by email (admin). The invitation reserves a seat
        when it is sent and expires in seven days. Its token is a
        credential shown once in this response and stored only as a hash.
        It is also mailed to the address when the registry may write
        there: an address at the organization's own verified domain
        always, and any other address only when it belongs to an account
        whose address the registry has confirmed. Accepting an invitation
        sent to the organization's verified domain also confirms the
        accepting account's address, because the organization proved it
        controls that domain.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created; acceptUrl and token are shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/invitations/{id}:
    delete:
      operationId: revokeInvitation
      tags: [orgs]
      summary: Revoke an open invitation (admin); its seat is released.
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [orgs]
      summary: >
        Read an invitation by its token (session only). Says which
        organization and role it offers and whether the signed-in account
        may accept it.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The offer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationOffer"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: acceptInvitation
      tags: [orgs]
      summary: >
        Accept an invitation (session only). Refused unless the session's
        verified email is the invited address; single use.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted; the membership is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"

  /orgs/{org}/teams:
    get:
      operationId: listTeams
      tags: [orgs]
      summary: List teams (members can view).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      responses:
        "200":
          description: Teams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTeam
      tags: [orgs]
      summary: Create a team (admin+).
      parameters:
        - $ref: "#/components/parameters/OrgHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
